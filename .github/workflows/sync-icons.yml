name: Sync Icons from Figma

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Sync icons from Figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: NIechyVGJuzroGt5UdFFOR
        run: python3 scripts/sync_icons.py

      - name: Rebuild design-system.html
        run: python3 build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add icons/ design-system.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(icons): Figma 아이콘 자동 동기화 $(date +'%Y-%m-%d')"
            git push origin main
          fi
