------|\n| **MAJOR** | 첫째 | 기존 코드가 깨지는 변경 | 클래스명·토큰명 변경, variant 제거 |\n| **MINOR** | 둘째 | 기존 코드 유지 + 기능 추가 | 새 variant·상태·토큰 추가 |\n| **PATCH** | 셋째 | 스펙 변경 없는 문서 수정 | 오탈자·설명·예시 수정 |\n\n```\n# MAJOR — 기존 코드를 다시 수정해야 함\n0.2.0  →  1.0.0   .btn--primary 클래스명이 .btn--brand로 변경됨\n\n# MINOR — 기존 코드는 그대로, 새 기능만 추가됨\n0.1.0  →  0.2.0   ghost variant 추가\n\n# PATCH — 코드와 스펙 변경 없음\n0.1.0  →  0.1.1   설명 오탈자 수정\n```\n\n> 💡 **판단 기준:** \"이 변경으로 기존에 만들어진 코드를 다시 수정해야 하는가?\"\n> YES → MAJOR  /  새 기능 추가 → MINOR  /  문서만 수정 → PATCH\n\n변경 절차: `CHANGELOG.md [Unreleased]` 기록 → 헤더 업데이트 → 릴리즈 시 git tag.\n", "previewCSS": ""}, {"path": "governance/_spec.md", "label": "문서 작성 규칙", "group": "governance", "slug": "governance--spec", "raw": "---\nfile: governance/_spec.md\nversion: 1.0.0\n---\n\n# 문서 공통 작성 규칙\n\n토큰·컴포넌트·워크플로 등 디자인 시스템 내 **모든 `.md` 파일**에 적용되는 표 작성 규칙.\n\n---\n\n## DO / DON'T 작성 형식\n\n모든 DO/DON'T는 아래 형식을 따른다. DO와 DON'T는 빈 줄로 분리하고, 각 항목은 설명과 코드 예시를 한 쌍으로 작성한다.\n\n```\n> ✅ DO — [설명]\n> `[코드 예시]`\n\n> ❌ DON'T — [설명]\n> `[코드 예시]`\n```\n\n> ⚠️ 여러 DO 또는 DON'T를 한 블록에 묶지 않는다. 항목마다 빈 줄로 분리한다.\n\n> ⚠️ 코드 예시 없이 설명만 작성 금지. 반드시 한 쌍으로 작성한다.\n\n---\n\n## 표 — 다중값 나열\n\n마크다운 표의 한 셀에 토큰, 클래스, 기타 나열 항목이 2개 이상일 때는 **`<br>`로 줄바꿈해 한 행에 하나씩** 나열한다. 쉼표 나열 금지.\n\n> ❌ DON'T — 쉼표 나열\n> `` `--color-text-body`, `--color-text-subtle`, `--color-text-disabled` ``\n\n> ✅ DO — `<br>` 줄바꿈\n> `` `--color-text-body`<br>`--color-text-subtle`<br>`--color-text-disabled` ``\n\n같은 규칙이 클래스 열에도 적용된다.\n\n> ❌ DON'T\n> `` `.text-button-sm`, `.text-button-md`, `.text-button-lg` ``\n\n> ✅ DO\n> `` `.text-button-sm`<br>`.text-button-md`<br>`.text-button-lg` ``\n\n---\n\n## 표 — 토큰·클래스명 표기\n\n토큰명이나 클래스명 뒤에 **px값·설명·주석을 인라인으로 삽입하지 않는다.** 값과 설명은 hover 툴팁으로 제공된다.\n\n> ❌ DON'T — `` `--radius-md`(8px, base) ``\n> ✅ DO — `` `--radius-md` ``\n\n---\n\n## 표 — 토큰·클래스 열 위치\n\n토큰명·클래스명은 **표의 오른쪽**에 위치한다. 앞 열에서 맥락(그룹·사용처)을 먼저 제공하고, 토큰·클래스명이 우측에 온다. 열이 여러 개여도 무방하며, 맥락 열보다 오른쪽이면 된다.\n\n> ❌ DON'T — 토큰이 첫 열\n> `| 토큰 | 사용처 |`\n\n> ✅ DO — 토큰이 우측\n> `| 사용처 | 토큰 |` 또는 `| 그룹 | 사용처 | 토큰 |` 또는 `| 그룹 | 사용처 | 클래스A | 클래스B |`\n\n**예외 — 원시값 key-value 표**: 토큰과 그 원시값만 나열하는 2열 표(`| 토큰 | 값 |`)는 시각화 디렉티브(`:::scale`, `:::palette`)로 대체한다. 디렉티브가 없는 경우 열 순서를 `| 사용처 | 토큰 |`으로 맞추고 값은 hover 툴팁으로 제공한다.\n\n---\n\n## 표 — 동일 그룹 행 구분\n\n그룹 값이 같은 연속 행은 **별도 구분선 없이 바로 이어 작성한다.** 마크다운 렌더러가 행 사이에 기본 구분선을 그리므로 추가 구분은 하지 않는다.\n\n```md\n| 그룹 | 사용처 | 토큰 |\n|------|--------|------|\n| `surface` | 중립 배경 | `--color-surface-base`<br>`--color-surface-subtle` |\n| `surface` | 브랜드 배경 | `--color-surface-brand`<br>`--color-surface-brand-subtle` |\n| `text` | 본문·UI 텍스트 | `--color-text-body`<br>`--color-text-display` |\n```\n\n> ✅ 같은 그룹(`surface`)이 연속으로 이어져도 빈 행이나 구분 기호를 삽입하지 않는다.\n", "previewCSS": ""}, {"path": "tokens/_index.md", "label": "아키텍처", "group": "tokens", "slug": "tokens--index", "raw": "---\nfile: tokens/_index.md\nversion: 1.0.0\n---\n\n# 디자인 시스템 아키텍처\n\n원시값(Primitive)에서 시작해 의미(Semantic)·컴포넌트(Component) 토큰으로 단계를 올리고, 반복되는 use case는 유틸리티 클래스로 묶는다.\n\n## 토큰 (3-tier)\n\nPrimitive(원시값) → Semantic(용도 부여) → Component(컴포넌트 전용) 순으로 참조한다.\n\n| Tier | 위치 | 컴포넌트에서 직접 사용 |\n|------|------|----------------------|\n| Primitive | `tokens.css` 상단 | ❌ 금지 |\n| Semantic | `tokens.css` 중단 | ✅ 사용 |\n| Component | 각 `.md` 스펙 섹션 | ✅ 사용 |\n\n### 토큰 네이밍\n\n> Semantic 패턴은 최대 3단계([속성]-[맥락]-[변형])이며, 맥락 차원이 의미 없는 토큰은 2단계도 유효하다.\n> `radius`(코너 크기만 존재), `height`(density가 맥락), `shadow`·`duration`·`z-index` 등이 해당한다.\n> typography는 5축(font-family·font-size·line-height·letter-spacing·font-weight)을 각각 독립적인 Semantic으로 정의한다.\n> use case별 조합은 토큰이 아닌 [유틸리티 클래스](#유틸리티-클래스)로 제공한다.\n\n| 토큰 | Primitive | Semantic |\n|------|-----------|----------|\n| **패턴** | --[속성]-[값] | --[속성]-[맥락]-[변형] |\n| `tokens/color.md` | --color-[팔레트]-[50–950]<br>`--color-blue-500` | --color-[맥락]-[변형]<br>`--color-text-body` |\n| `tokens/space.md` | --space-[px값]<br>`--space-8` | --space-[유형]-[크기]<br>`--space-inset-md` |\n| `tokens/space.md` | --height-[px값]<br>`--height-36` | --height-[density]<br>`--height-base` |\n| `tokens/typography.md` | --font-size-[px값]<br>`--font-size-14` | --font-size-[역할]<br>`--font-size-base` |\n| `tokens/typography.md` | --font-weight-[weight명]<br>`--font-weight-semibold` | --font-weight-[강조]<br>`--font-weight-heading` |\n| `tokens/typography.md` | --line-height-[밀도]<br>`--line-height-base` | --line-height-[성질]<br>`--line-height-ui` |\n| `tokens/typography.md` | --letter-spacing-[크기]<br>`--letter-spacing-normal` | --letter-spacing-[계층]<br>`--letter-spacing-default` |\n| `tokens/typography.md` | — | --font-family-[유형]<br>`--font-family-base` |\n| `tokens/radius.md` | --radius-[px값]<br>`--radius-4` | --radius-[크기]<br>`--radius-sm` |\n| `tokens/elevation.md` | — | --shadow-[크기]<br>`--shadow-md` |\n| `tokens/elevation.md` | — | --z-[맥락]<br>`--z-modal` |\n| `tokens/elevation.md` | — | --z-[수식어]<br>`--z-above` |\n| `tokens/motion.md` | — | --duration-[속도]<br>`--duration-fast` |\n| `tokens/motion.md` | — | --easing-[방향]<br>`--easing-enter` |\n| `tokens/icon.md` | — | --icon-[크기]<br>`--icon-md` |\n| `tokens/stroke.md` | — | --stroke-[크기]<br>`--stroke-sm` |\n| `tokens/stroke.md` | — | --stroke-[스타일]<br>`--stroke-solid` |\n\n> Component 토큰은 복잡한 컴포넌트(Modal, Table)의 고유값에만 사용한다.<br>\n> Button·Badge처럼 단순한 컴포넌트는 Semantic만으로 충분하다.\n\n| 토큰 | Component |\n|------|-----------|\n| **패턴** | --[속성]-[컴포넌트]-[변형]-[역할] |\n| `tokens/color.md` | `--color-button-primary-fill` |\n\n### 토큰 사용 규칙\n\n> ✅ DO — Semantic 토큰 참조\n> `background: var(--color-surface-brand);`\n\n> ✅ DO — Component 토큰 참조\n> `background: var(--color-button-primary-fill);`\n\n> ❌ DON'T — Primitive 직접 사용\n> `background: var(--color-blue-600);`\n\n> ❌ DON'T — hex 직접 사용\n> `background: #115ac6;`\n\n\n## 유틸리티 클래스\n\n여러 Semantic 토큰을 use case 단위로 묶은 **CSS 클래스**. 토큰이 아니므로 `var()`로 참조하지 않고 `class` 속성으로 적용한다.\n반복적으로 함께 쓰이는 토큰 조합을 한 클래스로 묶어, 컴포넌트 코드에서 use case 의도를 직접 드러낸다.\n\n### 유틸리티 네이밍\n\n> `[변형]`은 크기·강조 등이 필요할 때만 추가한다.<br>\n> 자세한 use case 목록은 각 속성의 스펙 문서를 참조한다 (typography는 `tokens/typography.md`).\n\n| 유틸리티 | 클래스 |\n|---------|--------|\n| **패턴** | .[속성]-[use case]-[변형] |\n| `tokens/typography.md` | .text-[use case]<br>.text-[use case]-[변형]<br>`.text-body`<br>`.text-button-md`<br>`.text-page-title` |\n| `tokens/layout.md` | .layout-[use case]<br>`.layout-two-panel`<br>`.layout-row-between`<br>`.layout-form-stack`<br>`.layout-form-row` |\n\n### 유틸리티 사용 규칙\n\n새 use case가 생겼을 때 아래 흐름으로 판단한다.\n\n```\n기존 Utility 클래스가 있나?\n    ├─ 있다 → Utility 클래스 사용\n    └─ 없다 → 여러 컴포넌트·컨텍스트에서 반복되나?\n                  ├─ 반복된다 → Utility 신규 등록 후 사용\n                  └─ 하나의 컴포넌트에서만 쓰인다 → 컴포넌트 CSS에서 Semantic 토큰 직접 참조\n```\n\n> ✅ DO — 유틸리티 클래스로 use case 적용\n> `<button class=\"text-button-md\">버튼<\/button>`\n\n> ✅ DO — 정의된 use case가 없을 때만 Semantic 토큰 직접 참조\n> `font-size: var(--font-size-base); font-weight: var(--font-weight-heading);`\n\n> ❌ DON'T — 유틸리티 클래스를 토큰처럼 참조\n> `font: var(--text-button-md);`\n", "previewCSS": "", "usedBy": [{"label": "ActionGroup", "slug": "components--atoms--action-group"}, {"label": "Button", "slug": "components--atoms--button"}, {"label": "Icon", "slug": "components--atoms--icon"}]}, {"path": "tokens/_spec.md", "label": "문서 규칙", "group": "tokens", "slug": "tokens--spec", "raw": "---\nfile: tokens/_spec.md\nversion: 1.0.0\ndepends-on: governance/_spec.md\n---\n\n# 토큰 정의 문서 작성 규칙\n\n> 표 작성 공통 규칙(다중값 나열·토큰명 표기·동일 그룹 행 구분)은 `governance/_spec.md`를 따른다.\n\n## 문서 헤더\n\n최상단에 아래 필드를 포함한다.\n\n```yaml\n---\nfile: tokens/[name].md\nversion:    0.1.0\ndepends-on: tokens/_index.md\n---\n```\n\n| 필드 | 작성 기준 | 언제 업데이트 |\n|------|----------|-------------|\n| `version` | 정의서 변경 범위 (Semantic Versioning) | 내용이 바뀔 때마다. 규칙은 `governance/versioning.md` |\n| `depends-on` | 참조하는 상위 문서 | 의존성이 바뀔 때 |\n\n---\n\n## 섹션 순서\n\n> ⚠️ 순서 고정. 변경 금지. Primitive(원시 스케일이 없는 경우)·Utility(use case 클래스가 없는 경우)는 생략한다.\n\n```\n## Primitive  →  ## Semantic  →  ## Utility  →  ## Do / Don't\n```\n\n| 섹션 | 필수 | 비고 |\n|------|------|------|\n| `## Primitive` | 선택 | 원시값 시각화가 유의미할 때 작성 |\n| `## Semantic` | 필수 | Primitive 없이 작성 가능 (icon·stroke·motion·elevation) |\n| `## Utility` | 선택 | use case별 묶음 클래스가 있을 때만 작성 |\n| `## Do / Don't` | 필수 | — |\n\n---\n\n## 디렉티브\n\n토큰 문서를 작성하거나 수정할 때, 해당 토큰의 값을 사람이 직관적으로 볼 수 있는 시각화를 반드시 포함한다. 디렉티브는 그 시각화를 HTML 뷰어에 삽입하는 마커다.\n\n**시각화 방식 선택 기준** — 토큰의 특성이 가장 잘 드러나는 방식을 선택한다.\n\n| 토큰 특성 | 적합한 시각화 | 디렉티브 |\n|----------|-------------|---------|\n| 색상 팔레트 (50–950 스케일) | 색상 칩 나열 | `:::palette [이름]` |\n| 수치 스케일 (크기·간격·두께 등) | 값에 비례한 막대·컬럼 비교 | `:::scale [속성]` |\n| box-shadow | 실제 그림자가 적용된 박스 | `:::shadow` |\n| z-index 계층 | 값에 비례한 높이 스택 | `:::z-index` |\n\n기존 디렉티브로 표현이 충분하지 않으면 새 디렉티브를 build.py에 추가한다.\n\n**새 디렉티브를 추가할 때** (build.py 구현 규칙):\n\n> ⚠️ 새 디렉티브 또는 시각화 블록을 추가할 때 아래 규칙을 반드시 따른다.\n\n- 시각화 박스는 **값(value)만** 표시한다. (예: `2px`, `#1A73E8`, `50%`)\n- 값이 단순 수치·색상이면 그대로 표시한다. **값이 복합 문자열(box-shadow 등)이라 직접 표시가 불가능한 경우, 토큰 suffix(예: `sm`, `md`)를 식별자로 표시한다.**\n- 토큰명은 **hover 시 툴팁**으로만 노출한다.\n- 박스 아래 별도 label로 토큰의 semantic 용도를 표시하지 않는다.\n- 렌더링 요소에는 반드시 `data-token-value=\"--token-name\"` 속성을 부여한다.\n- `build.py` mouseover 핸들러에 해당 클래스를 추가한다. 등록된 클래스 목록은 `build.py` mouseover 핸들러를 정본으로 한다.\n\n---\n\n## Primitive 섹션 형식\n\n원시값 카테고리별로 `###`으로 분기. 디렉티브 앞에 한 줄 설명을 붙일 수 있다.\n\n**설명 작성 기준 — 아래 중 하나라도 해당하면 작성, 없으면 생략한다.**\n\n| 작성 조건 | 예시 |\n|----------|------|\n| 스케일 구조·단계 규칙이 있다 | \"4px 기반 스케일. 소형은 세밀하게, 대형은 8px 이상으로 점프\" |\n| 숫자 방향·의미가 직관적이지 않다 | \"숫자가 클수록 어둡다 (50 = 가장 밝음, 950 = 가장 어두움)\" |\n| 컴포넌트 직접 참조 금지 등 제약이 있다 | \"팔레트 원시값이며 컴포넌트에서 직접 참조하지 않는다\" |\n| 폴백·의존 관계가 있다 | \"로드 실패 시 뒤의 값이 순서대로 대체된다\" |\n\n> ❌ 토큰명만 보면 알 수 있는 당연한 설명은 작성하지 않는다.\n> `이름은 px값과 동일하다` — radius 토큰명(`--radius-4`)에서 이미 명백. 생략.\n> `이름은 숫자다` — space 토큰에 적용했다면 마찬가지로 생략.\n\n---\n\n## Semantic 섹션 형식\n\n`| 그룹 | 사용처 | 토큰 |` 3컬럼이 표준.\n\n```md\n| 그룹 | 사용처 | 토큰 |\n|------|--------|------|\n| `surface` | 중립 배경 | `--color-surface-base`<br>`--color-surface-subtle` |\n| `text` | 본문·UI 텍스트 | `--color-text-body`<br>`--color-text-display` |\n```\n\n**컬럼 규칙:**\n- `그룹` — 토큰명 중간 키워드 (`surface`, `text`, `inset`, `gap` 등)\n- `사용처` — 한 줄 설명. 무엇을 위한 그룹인지 명확히\n- `토큰` — 다중값 나열·px 주석 금지는 `governance/_spec.md` 표 규칙을 따른다\n\n> ⚠️ **토큰명·클래스명은 표의 오른쪽**에 위치한다. 열이 여러 개여도 무방하며, 맥락 열(그룹·사용처)보다 오른쪽이면 된다.\n\n> typography처럼 축이 여러 개인 토큰은 첫 컬럼명을 `축`으로 바꿔도 됨.\n\n---\n\n## Utility 섹션 형식\n\nSemantic 토큰을 use case 단위로 묶은 클래스가 있을 때만 작성. `| 그룹 | 사용처 | 클래스 |` 3컬럼이 기본이며, 내용상 필요한 경우 열을 추가할 수 있다. 클래스 열은 표의 오른쪽에 위치한다. 클래스 열 나열은 `governance/_spec.md` 표 규칙을 따른다.\n\n```md\n| 그룹 | 사용처 | 클래스 |\n|------|--------|--------|\n| `button` | 버튼 레이블 — 소·중·대 | `.text-button-sm`<br>`.text-button-md`<br>`.text-button-lg` |\n```\n\n---\n\n## Do / Don't 형식\n\n각 항목은 `>` 인용 블록. 첫 줄에 의미, 둘째 줄에 코드 예시.\n\n```md\n> ✅ DO — 용도 설명\n> `code example;`\n\n> ❌ DON'T — 위반 사유\n> `bad example;`\n\n> ⚠️ 주의 사항\n```\n\n| 기호 | 의미 |\n|------|------|\n| ✅ DO | 권장 사용법 |\n| ❌ DON'T | 금지 사용법 |\n| ⚠️ | 주의 사항·경고 |\n\n---\n\n## CSS 파일 동기화 규칙\n\n`tokens/*.css` 주석은 md와 같은 정보 소스다. md를 수정할 때 CSS 주석도 함께 갱신한다.\n\n**1. Semantic 토큰 주석에 사용처 명시**\n\n```css\n--font-size-label: var(--font-size-12);  /* 칩·뱃지·헬퍼 */\n```\n\n**2. Utility 카테고리 블록 주석은 현행 클래스명 반영**\n\n```css\n/* 카테고리:\n     Status — badge, chip, tooltip\n*/\n```\n\n**3. 토큰·클래스 추가·제거·이름 변경 시 CSS 주석을 동시에 수정**\n\n> ⚠️ CSS 주석이 stale되면 AI가 잘못된 사용처를 인용한다. 변경 작업 시 주석 동기화를 워크플로 체크리스트에 포함한다.\n\n---\n\n## Deprecation 정책\n\n토큰·유틸리티 제거 절차는 `workflow/designer.md`의 **토큰 제거** · **유틸리티 제거** 흐름을 따른다.\n", "previewCSS": "--font-size-label: var(--font-size-12);  /* 칩·뱃지·헬퍼 */\n\n/* 카테고리:\n     Status — badge, chip, tooltip\n*/\n", "usedBy": [{"label": "ActionGroup", "slug": "components--atoms--action-group"}, {"label": "Button", "slug": "components--atoms--button"}, {"label": "Icon", "slug": "components--atoms--icon"}]}, {"path": "tokens/color.md", "label": "색상", "group": "tokens", "slug": "tokens--color", "raw": "---\nfile: tokens/color.md\nversion: 2.0.2\ndepends-on: tokens/_index.md\n---\n\n# 색상 시스템\n\n## Primitive\n\n밝기 스케일(50–950)로 구성된다. 숫자가 클수록 어둡다. gray만 양 끝에 `0`(#ffffff)과 `1000`(#000000)이 추가로 존재한다. 팔레트별 원시값이며 컴포넌트에서 직접 참조하지 않는다.\n\n### Blue\n\n주요 브랜드 컬러. CTA 버튼, 링크, 포커스 링, 선택·활성 상태.\n\n<div class=\"palette-placeholder\" data-palette=\"blue\"><\/div>\n\n### Cyan\n\n보조 브랜드 컬러. 정보성 배지, 보조 액션, 데이터 시각화 계열.\n\n<div class=\"palette-placeholder\" data-palette=\"cyan\"><\/div>\n\n### Gray\n\n중립 UI. 텍스트, 배경, 구분선, 비활성 상태 전반.\n\n<div class=\"palette-placeholder\" data-palette=\"gray\"><\/div>\n\n### Green\n\n성공·긍정 상태. 완료, 승인, 성공 메시지, 유효성 검사 통과.\n\n<div class=\"palette-placeholder\" data-palette=\"green\"><\/div>\n\n### Orange\n\n경고·주의 상태. 주의가 필요한 정보, 기한 임박, 권장 사항.\n\n<div class=\"palette-placeholder\" data-palette=\"orange\"><\/div>\n\n### Red\n\n오류·위험 상태. 에러 메시지, 삭제 확인, 위험 액션.\n\n<div class=\"palette-placeholder\" data-palette=\"red\"><\/div>\n\n## Semantic\n\n| 그룹 | 사용처 | 토큰 |\n|------|--------|------|\n| `surface` | 중립 배경 | `--color-surface-base`<br>`--color-surface-subtle`<br>`--color-surface-neutral`<br>`--color-surface-disabled`<br>`--color-surface-dark`<br>`--color-surface-dim` |\n| `surface` | 브랜드 배경 | `--color-surface-brand`<br>`--color-surface-brand-subtle`<br>`--color-surface-brand-tint`<br>`--color-surface-info-subtle`<br>`--color-surface-info-tint` |\n| `surface` | 상태 배경 | `--color-surface-success-subtle`<br>`--color-surface-caution-subtle`<br>`--color-surface-error-subtle` |\n| `text` | 본문·UI 텍스트 | `--color-text-body`<br>`--color-text-display`<br>`--color-text-label`<br>`--color-text-subtle`<br>`--color-text-disabled`<br>`--color-text-inverse` |\n| `text` | 브랜드 텍스트 | `--color-text-brand-vivid`<br>`--color-text-brand`<br>`--color-text-brand-muted`<br>`--color-text-info`<br>`--color-text-info-muted` |\n| `text` | 상태 피드백 | `--color-text-caution`<br>`--color-text-error` |\n| `border` | 테두리·구분선 | `--color-border-subtle`<br>`--color-border-default`<br>`--color-border-disabled`<br>`--color-border-selected`<br>`--color-border-brand`<br>`--color-border-focus`<br>`--color-border-error` |\n| `button` | 버튼 스타일 색. fill(배경)·solid(텍스트·테두리) 공용 | `--color-button-brand`<br>`--color-button-neutral`<br>`--color-button-error` |\n| `action` | 중립 인터랙션 | `--color-action-neutral-hover`<br>`--color-action-neutral-pressed`<br>`--color-action-neutral-selected`<br>`--color-action-neutral-overlay` |\n| `action` | 브랜드 인터랙션 | `--color-action-brand-hover`<br>`--color-action-brand-pressed`<br>`--color-action-brand-selected`<br>`--color-action-brand-overlay`<br>`--color-action-info-hover`<br>`--color-action-info-pressed`<br>`--color-action-info-selected`<br>`--color-action-info-overlay`<br>`--color-action-info-subtle` |\n| `action` | 위험 인터랙션 | `--color-action-error-hover`<br>`--color-action-error-pressed`<br>`--color-action-error-selected`<br>`--color-action-error-overlay` |\n\n\n## Do / Don't\n\n> ✅ DO — Semantic 사용\n> `color: var(--color-text-body);`\n> `border: 1px solid var(--color-border-default);`\n\n> ❌ DON'T — Primitive 직접 참조\n> `color: var(--color-gray-950);`\n\n> ❌ DON'T — hex 직접 사용\n> `color: #131416;`\n\n> ✅ DO — 투명도가 필요하면 `color-mix()`로 Semantic 토큰을 정의해 사용\n> `color-mix(in srgb, var(--color-gray-950) 8%, transparent)`\n\n> ❌ DON'T — `rgba()` 또는 `opacity` 직접 사용\n> `rgba(0, 0, 0, 0.08)` ← 토큰 시스템 밖으로 나가며 다크모드 전환 불가\n", "previewCSS": "", "usedBy": [{"label": "ActionGroup", "slug": "components--atoms--action-group"}, {"label": "Button", "slug": "components--atoms--button"}, {"label": "Icon", "slug": "components--atoms--icon"}]}, {"path": "tokens/space.md", "label": "공간", "group": "tokens", "slug": "tokens--space", "raw": "---\nfile: tokens/space.md\nversion: 1.1.0\ndepends-on: tokens/_index.md\n---\n\n# 공간 시스템\n\n## Primitive\n\n4px 기반 스케일로 구성된다. 소형(2–8px)은 컴포넌트 내부 여백에서 세밀하게, 중형(8–24px)은 4px 배수, 대형(24px~)은 8px 이상으로 점프한다.\n\n### Space\n\n<!-- AI: :::scale space renders primitive space tokens (4px base):\n--space-2: 2px  --space-4: 4px  --space-6: 6px   --space-8: 8px\n--space-12: 12px  --space-16: 16px  --space-20: 20px  --space-24: 24px\n--space-32: 32px  --space-48: 48px  --space-64: 64px\n-->\n<div class=\"scale-placeholder\" data-scale=\"space\"><\/div>\n\n### Height\n\n컴포넌트 클릭 영역 고정 높이. padding으로 높이를 만들지 않는다.\n\n<!-- AI: :::scale height renders primitive height tokens (component click area):\n--height-24: 24px  --height-28: 28px  --height-32: 32px\n--height-36: 36px  --height-40: 40px  --height-48: 48px\n-->\n<div class=\"scale-placeholder\" data-scale=\"height\"><\/div>\n\n## Semantic\n\n<!-- AI: 사용처 열의 <div data-ex=\"...\"> 요소는 HTML 뷰어에서 패딩 방향을 시각적으로 렌더링하기 위한 마커다. 의미 있는 텍스트가 아니므로 무시하고 뒤에 오는 설명 텍스트를 사용처로 읽는다. -->\n| 그룹 | 사용처 | 토큰 |\n|------|--------|------|\n| `inset` | <div data-ex=\"space-inset\"><\/div> 컨테이너 사방 padding | `--space-inset-xs`<br>`--space-inset-sm`<br>`--space-inset-md`<br>`--space-inset-lg`<br>`--space-inset-xl`<br>`--space-inset-2xl` |\n| `inset-squish` | <div data-ex=\"space-inset-squish\"><\/div> 좌우가 상하의 2배인 padding — 버튼·태그·pill | `--space-inset-squish-xs`<br>`--space-inset-squish-sm`<br>`--space-inset-squish-md`<br>`--space-inset-squish-lg`<br>`--space-inset-squish-xl`<br>`--space-inset-squish-2xl` |\n| `stack` | <div data-ex=\"space-stack\"><\/div> 요소 아래 세로 margin | `--space-stack-xs`<br>`--space-stack-sm`<br>`--space-stack-md`<br>`--space-stack-lg`<br>`--space-stack-xl`<br>`--space-stack-2xl` |\n| `gap` | <div data-ex=\"space-gap\"><\/div> flex·grid 자식 간격 — 부모에 적용 | `--space-gap-2xs`<br>`--space-gap-xs`<br>`--space-gap-sm`<br>`--space-gap-md`<br>`--space-gap-lg`<br>`--space-gap-xl`<br>`--space-gap-2xl`<br>`--space-gap-3xl` |\n| `generic` | 단방향 margin 등 위 4가지로 안 되는 예외 | `--space-generic-xs`<br>`--space-generic-sm`<br>`--space-generic-md`<br>`--space-generic-lg`<br>`--space-generic-xl`<br>`--space-generic-2xl` |\n| `height` | 컴포넌트 클릭 영역 고정 높이 | `--height-tight`<br>`--height-dense`<br>`--height-compact`<br>`--height-base`<br>`--height-spacious`<br>`--height-loose` |\n| `offset` | focus ring과 요소 사이 간격 — `outline-offset` 전용 | `--space-offset-focus` |\n\n## Do / Don't\n\n> ✅ DO — 용도에 맞는 Semantic 사용\n> `padding: var(--space-inset-md);`\n> `padding: var(--space-inset-squish-md);`\n> `margin-bottom: var(--space-stack-sm);`\n> `gap: var(--space-gap-sm);`\n\n> ❌ DON'T — 임의값 직접 사용\n> `padding: 16px;`\n> `margin-bottom: 8px;`\n\n> ✅ DO — height 토큰으로 높이 고정\n> `.btn { height: var(--height-base); display: flex; align-items: center; }`\n\n> ❌ DON'T — padding으로 높이 조절\n> `.btn { padding: 8px 16px; }`\n\n> ✅ DO — 단방향 margin은 generic으로 값을 가져오고 방향은 CSS로 지정\n> `margin-inline-end: var(--space-generic-sm);`\n\n> ❌ DON'T — Primitive 직접 참조\n> `padding: var(--space-16);`\n", "previewCSS": "", "usedBy": [{"label": "ActionGroup", "slug": "components--atoms--action-group"}, {"label": "Button", "slug": "components--atoms--button"}]}, {"path": "tokens/typography.md", "label": "타이포그래피", "group": "tokens", "slug": "tokens--typography", "raw": "---\nfile: tokens/typography.md\nversion: 1.1.0\ndepends-on: tokens/_index.md\n---\n\n# 타이포그래피 시스템\n\n3-tier 구조. Primitive(원시값) → Semantic(축별 의미) → Utility(컴포넌트 use case 묶음).\n컴포넌트는 **`.text-*` 유틸 클래스**로 적용한다.\n\n## Primitive\n\n### Font Size\n\n소형(11–15px)은 UI 밀도용, 중형(17–20px)은 UI 강조·소제목, 대형(28–32px)은 페이지 구조.\n\n<!-- AI: :::scale font-size renders primitive font-size tokens:\n--font-size-11: 11px  --font-size-12: 12px  --font-size-13: 13px\n--font-size-14: 14px  --font-size-15: 15px  --font-size-17: 17px\n--font-size-20: 20px  --font-size-28: 28px  --font-size-32: 32px\n-->\n<div class=\"scale-placeholder\" data-scale=\"font-size\"><\/div>\n\n### Font Weight · Line Height · Letter Spacing\n\n<!-- AI: :::scale typography-props renders:\nFont weight:    --font-weight-regular: 400 | --font-weight-medium: 500 | --font-weight-semibold: 600 | --font-weight-bold: 700\nLine height:    --line-height-none: 1 | --line-height-tight: 1.25 | --line-height-base: 1.5 | --line-height-relaxed: 1.625\nLetter spacing: --letter-spacing-tight: -0.02em | --letter-spacing-normal: 0em | --letter-spacing-wide: 0.05em\n-->\n<div class=\"scale-placeholder\" data-scale=\"typography-props\"><\/div>\n\n## Semantic — 5축\n\n각 속성을 독립적인 축으로 분리한다. 유틸 클래스가 이 값을 조합한다.\n\n| 축 | 사용처 | 토큰 |\n|---|--------|------|\n| `font-family` | 기본 서체 스택 — Pretendard 로드 실패 시 뒤의 폰트가 순서대로 대체 | `--font-family-base` |\n| `font-size` | 역할별 크기 (11–32px) | `--font-size-meta`<br>`--font-size-label`<br>`--font-size-sm`<br>`--font-size-base`<br>`--font-size-lg`<br>`--font-size-h4`<br>`--font-size-h3`<br>`--font-size-h2`<br>`--font-size-h1` |\n| `line-height` | 콘텐츠 성질 — 한 줄 UI · 다줄 본문 · 긴 글 | `--line-height-ui`<br>`--line-height-reading`<br>`--line-height-prose` |\n| `letter-spacing` | 계층 — 기본 · 28px 이상 대형 헤딩 | `--letter-spacing-default`<br>`--letter-spacing-display` |\n| `font-weight` | 강조 — 본문 · 헤딩·UI · 페이지 타이틀 | `--font-weight-body`<br>`--font-weight-heading`<br>`--font-weight-display` |\n\n## Utility — Use Case별 묶음 클래스\n\n컴포넌트 use case별로 5축을 묶은 클래스. **컴포넌트는 이 클래스로 적용한다.**\n\n| 그룹 | 사용처 | 클래스 |\n|------|--------|--------|\n| `button` | 버튼 레이블 — 소·중·대 | `.text-button-sm`<br>`.text-button-md`<br>`.text-button-lg` |\n| `form` | 인풋·라벨·헬퍼 — 인풋은 소·중 | `.text-input-sm`<br>`.text-input-md`<br>`.text-form-label`<br>`.text-helper` |\n| `table` | 데이터 테이블 헤더·셀 — 소·중·대 | `.text-table-header-sm`<br>`.text-table-header-md`<br>`.text-table-header-lg`<br>`.text-table-cell-sm`<br>`.text-table-cell-md`<br>`.text-table-cell-lg` |\n| `navigation` | 탭·브레드크럼·메뉴 — 메뉴는 1뎁스 항목·그룹 제목·하위 항목 | `.text-tab`<br>`.text-breadcrumb`<br>`.text-menu-item`<br>`.text-menu-group`<br>`.text-menu-list-item` |\n| `hierarchy` | 페이지·카드 제목 | `.text-page-title`<br>`.text-card-title` |\n| `modal` | 모달 타이틀 — 대·소 | `.text-modal-title`<br>`.text-modal-title-sm` |\n| `status` | 뱃지·칩·툴팁 | `.text-badge`<br>`.text-chip`<br>`.text-tooltip` |\n| `body·meta` | 기능 설명·본문·메타정보 | `.text-description`<br>`.text-body`<br>`.text-meta` |\n\n## Do / Don't\n\n> ✅ DO — `.text-*` 유틸 클래스 적용\n> `<button class=\"text-button-md\">버튼<\/button>`\n> `<p class=\"text-body\">본문<\/p>`\n\n> ✅ DO — use case 없을 때 Semantic 토큰 직접 참조\n> `font-size: var(--font-size-base);`\n> `font-weight: var(--font-weight-heading);`\n\n> ❌ DON'T — Primitive 직접 참조\n> `font-size: var(--font-size-14);`\n\n> ❌ DON'T — 임의값 직접 사용\n> `font-size: 14px; line-height: 1.5;`\n\n> ⚠️ 새 use case가 반복적으로 등장하면 → 새 `.text-*` 클래스 추가\n> ⚠️ 본문 최소 13px (가독성)\n", "previewCSS": "", "usedBy": [{"label": "ActionGroup", "slug": "components--atoms--action-group"}, {"label": "Button", "slug": "components--atoms--button"}]}, {"path": "tokens/radius.md", "label": "Radius", "group": "tokens", "slug": "tokens--radius", "raw": "---\nfile: tokens/radius.md\nversion: 1.0.0\ndepends-on: tokens/_index.md\n---\n\n# Radius 시스템\n\n## Primitive\n\n<!-- AI: :::scale radius renders primitive radius tokens:\n--radius-4:    4px\n--radius-6:    6px\n--radius-8:    8px\n--radius-12:  12px\n--radius-16:  16px\n--radius-1000: 1000px  (pill 형태)\n-->\n<div class=\"scale-placeholder\" data-scale=\"radius\"><\/div>\n\n## Semantic\n\n컴포넌트 shape 변형에 따라 radius 토큰이 결정된다. sharp는 radius 미적용(`border-radius: 0`), rounded는 `size` 그룹, pill은 `--radius-pill`.\n\n| 그룹 | 사용처 | 토큰 |\n|------|--------|------|\n| `size` | 크기별 border-radius — 컴포넌트 기본 shape | `--radius-xs`<br>`--radius-sm`<br>`--radius-md`<br>`--radius-lg`<br>`--radius-xl` |\n| `pill` | shape: round — 태그·배지·pill 버튼 | `--radius-pill` |\n\n## Do / Don't\n\n> ✅ DO — Semantic 토큰 사용\n> `border-radius: var(--radius-pill);`\n> `border-radius: var(--radius-sm);`\n\n> ❌ DON'T — 임의값 직접 사용\n> `border-radius: 1000px;`\n> `border-radius: 4px;`\n\n> ⚠️ Figma에 없는 radius 값을 임의로 추가하지 않는다. 새 값이 필요하면 Figma에 먼저 정의한 후 추출한다.\n", "previewCSS": "", "usedBy": [{"label": "ActionGroup", "slug": "components--atoms--action-group"}, {"label": "Button", "slug": "components--atoms--button"}]}, {"path": "tokens/elevation.md", "label": "Elevation", "group": "tokens", "slug": "tokens--elevation", "raw": "---\nfile: tokens/elevation.md\nversion: 1.0.0\ndepends-on: tokens/_index.md\n---\n\n# Elevation 시스템\n\nz축(깊이)을 shadow와 z-index 두 가지로 표현한다.\n\n## Semantic\n\n### Shadow\n\n크기 기반으로 명명된다 (`sm` → `xl`). 숫자가 클수록 더 높이 떠 있는 느낌.\n\n<!-- AI: :::shadow renders shadow tokens (semantic only, no primitives):\n--shadow-sm: 0 1px 2px rgba(#000, 6%)\n--shadow-md: 0 2px 8px rgba(#000, 8%) + 0 1px 2px rgba(#000, 6%)\n--shadow-lg: 0 4px 16px rgba(#000, 10%) + 0 2px 4px rgba(#000, 6%)\n--shadow-xl: 0 8px 32px rgba(#000, 12%) + 0 4px 8px rgba(#000, 6%)\n알파값은 color-mix(in srgb, var(--color-gray-1000) N%, transparent)로 표현된다.\n-->\n<div class=\"shadow-placeholder\"><\/div>\n\n| 그룹 | 사용처 | 토큰 |\n|------|--------|------|\n| `shadow` | 카드·드롭다운·모달·다이얼로그·토스트·툴팁 | `--shadow-sm`<br>`--shadow-md`<br>`--shadow-lg`<br>`--shadow-xl` |\n\n### Z-Index\n\n목적 기반으로 명명된다. z-index 숫자 자체는 임의적이어서 값 기반 명명(`--z-100`)보다 목적 기반 명명(`--z-dropdown`)이 직관적이다. 레이어 맥락별로 100 단위로 점프한다.\n\nbackdrop(200)과 modal(210)은 함께 쓰이는 쌍이다. backdrop은 모달 뒷배경(딤 처리)이고 modal은 그 위의 패널이다. 둘이 항상 같이 등장하므로 같은 100 단위 구간 안에서 10 단위 차이로 배치한다.\n\n`--z-auto`는 `z-index: auto`의 토큰화로, stacking context를 새로 만들지 않고 부모 컨텍스트를 그대로 상속할 때 사용한다.\n\n<!-- AI: :::z-index renders z-index tokens (purpose-based, 100-unit jumps):\nModifiers:  --z-above: 1 | --z-below: -1 | --z-auto: auto\nLayers:     --z-dropdown: 100 | --z-sticky: 150\n            --z-backdrop: 200 | --z-modal: 210  ← backdrop+modal은 항상 쌍으로 사용\n            --z-dialog: 250 | --z-toast: 300 | --z-tooltip: 400\n-->\n<div class=\"zindex-placeholder\"><\/div>\n\n| 그룹 | 사용처 | 토큰 |\n|------|--------|------|\n| `z-index` | 전역 레이어 순서 | `--z-dropdown`<br>`--z-sticky`<br>`--z-backdrop`<br>`--z-modal`<br>`--z-dialog`<br>`--z-toast`<br>`--z-tooltip` |\n| `z-index` modifier | stacking context 내부 상대 계층 조정 | `--z-above`<br>`--z-below`<br>`--z-auto` |\n\n## Utility\n\nshadow와 z-index는 서로 다른 CSS 속성이라 하나의 CSS 변수로 묶을 수 없다. 따라서 두 속성을 레이어 계층에 맞게 묶은 유틸리티 클래스를 제공한다. `base`는 shadow만 적용하며 z-index는 지정하지 않는다.\n\n| 그룹 | 사용처 | 클래스 |\n|------|--------|--------|\n| `base` | 카드, hover 강조 | `.elevation-base` |\n| `dropdown` | 드롭다운, 팝오버 | `.elevation-dropdown` |\n| `modal` | 모달, 사이드 패널 | `.elevation-modal` |\n| `dialog` | 확인 다이얼로그 (모달 위) | `.elevation-dialog` |\n| `toast` | Toast, 최상위 알림 | `.elevation-toast` |\n| `tooltip` | 툴팁 | `.elevation-tooltip` |\n\n> `sticky` · `backdrop`은 shadow 없이 z-index만 사용하므로 elevation 클래스가 없다. `--z-sticky` / `--z-backdrop`을 직접 참조한다.\n\n## Local Layer (Modifier)\n\n전역 레이어 내부에서 형제 요소 간 순서 조정이 필요할 때 `--z-above` / `--z-below` modifier를 사용한다. 새로운 전역 토큰을 추가하지 않는다.\n\n| 용도 | 토큰 |\n|------|------|\n| stacking context 내부에서 한 단계 위 | `--z-above` |\n| stacking context 내부에서 한 단계 아래 | `--z-below` |\n\n**사용 패턴:**\n\n```css\n/* 모달 내부 드롭다운이 모달 위에 올라와야 할 때 */\n.modal-dropdown {\n  z-index: calc(var(--z-modal) + var(--z-above));\n}\n\n/* 카드 내부 배지가 이미지 위에 떠야 할 때 */\n.card-badge {\n  z-index: calc(1 + var(--z-above));\n}\n```\n\n> ⚠️ modifier는 같은 stacking context 내부 형제 요소 간 순서 조정에만 사용한다.\n\n## 서드파티 z-index 거버넌스\n\n외부 라이브러리(채팅 위젯, 지도, 결제 모듈 등)에서 임의로 설정한 z-index는 반드시 우리 레이어 시스템 값으로 오버라이드한다.\n\n```css\n.third-party-chat-widget {\n  z-index: var(--z-toast) !important;\n}\n```\n\n## Do / Don't\n\n> ✅ DO — elevation 유틸리티 클래스 사용\n> `<div class=\"elevation-modal\">` ← shadow-lg + z-modal 자동 적용\n> `<div class=\"elevation-dropdown\">` ← shadow-md + z-dropdown 자동 적용\n\n> ✅ DO — modifier로 stacking context 내부 순서 조정\n> `.modal-select { z-index: calc(var(--z-modal) + var(--z-above)); }`\n\n> ✅ DO — backdrop과 modal은 항상 쌍으로 사용. backdrop 없이 modal만 사용하지 않는다\n> `.backdrop { z-index: var(--z-backdrop); } .modal { z-index: var(--z-modal); }`\n\n> ✅ DO — 서드파티 z-index를 레이어 시스템으로 오버라이드\n> `.third-party-widget { z-index: var(--z-toast) !important; }`\n\n> ❌ DON'T — 임의 정수\n> `.modal { z-index: 9999; }`\n\n> ❌ DON'T — shadow와 z-index 계층 불일치\n> `.dropdown { box-shadow: var(--shadow-lg); }` ← dropdown에는 `--shadow-md`\n\n> ❌ DON'T — modifier로 전역 레이어 넘기기\n> `.dropdown { z-index: calc(var(--z-dropdown) + var(--z-above)); }` ← `--z-sticky`(150) 범위 침범 가능\n\n> ❌ DON'T — 전역 레이어 순서 변경을 modifier로 해결\n> modifier로 toast를 tooltip보다 위에 올리려 하지 않는다. 전역 레이어 순서 변경은 시스템 전체에 영향을 주므로 z-index 토큰 값 자체를 수정하고 팀과 합의한다.\n", "previewCSS": "/* 모달 내부 드롭다운이 모달 위에 올라와야 할 때 */\n.modal-dropdown {\n  z-index: calc(var(--z-modal) + var(--z-above));\n}\n\n/* 카드 내부 배지가 이미지 위에 떠야 할 때 */\n.card-badge {\n  z-index: calc(1 + var(--z-above));\n}\n\n.third-party-chat-widget {\n  z-index: var(--z-toast) !important;\n}\n", "usedBy": []}, {"path": "tokens/motion.md", "label": "모션", "group": "tokens", "slug": "tokens--motion", "raw": "---\nfile: tokens/motion.md\nversion: 2.0.0\ndepends-on: tokens/_index.md\n---\n\n# 모션 시스템\n\n모션은 장식이 아닌 정보 전달 수단이다. 세 가지 목적 외 사용 금지.\n\n| 목적 | 사용처 |\n|------|--------|\n| 상태 피드백 | hover, pressed, focus 즉각 반응 |\n| 공간 관계 | 드롭다운 진입, 모달 등장, 슬라이드 패널 |\n| 주의 유도 | 에러 발생, toast 등장 |\n\n## Semantic\n\n### Duration\n\n숫자가 클수록 느리다 (fast 100ms → slow 200ms).\n\n<!-- AI: :::scale duration renders:\n--duration-fast: 100ms  (hover, focus, 즉각 상태 변화)\n--duration-base: 150ms  (드롭다운, 팝오버, 일반 전환)\n--duration-slow: 200ms  (모달, 사이드 패널, 페이지 전환)\n-->\n<div class=\"scale-placeholder\" data-scale=\"duration\"><\/div>\n\n| 사용처 | 토큰 |\n|--------|------|\n| hover, focus, 즉각 상태 변화 | `--duration-fast` |\n| 드롭다운, 팝오버, 일반 전환 | `--duration-base` |\n| 모달, 사이드 패널, 페이지 전환 | `--duration-slow` |\n\n### Easing\n\n등장(enter)은 빠르게 시작해 천천히 정착하고, 퇴장(exit)은 천천히 시작해 빠르게 사라진다. 물리적 이동(move)은 양방향이 부드럽고, base(`ease`)는 방향 없는 토글 전환에 사용한다.\n\n<!-- AI: :::scale easing renders:\n--easing-enter: ease-out    (요소 등장 — 빠르게 시작해 천천히 정착)\n--easing-exit:  ease-in     (요소 퇴장 — 천천히 시작해 빠르게 사라짐)\n--easing-move:  ease-in-out (물리적 이동 — 캐러셀, 드래그 재정렬)\n--easing-base:  ease        (방향 없는 즉각 상태 변화 — hover, focus)\n-->\n<div class=\"scale-placeholder\" data-scale=\"easing\"><\/div>\n\n| 사용처 | 토큰 |\n|--------|------|\n| 요소 등장 (드롭다운 열림, 모달 진입, 툴팁) | `--easing-enter` |\n| 요소 퇴장 (드롭다운 닫힘, 모달 해제) | `--easing-exit` |\n| 물리적 위치 이동 (캐러셀, 드래그 재정렬) | `--easing-move` |\n| 방향 없는 토글 상태 변화 (hover, focus) | `--easing-base` |\n\n### Translate\n\n인터랙티브 요소의 hover 시 수직 이동 값. `transform: translateY()` 에 사용한다. scale 대신 translate를 사용하는 이유는 텍스트 크기가 변하지 않아 폰트 렌더링이 일관되게 유지되기 때문이다.\n\n| 사용처 | 토큰 |\n|--------|------|\n| 버튼·칩 등 hover 시 살짝 부상 | `--translate-interactive-hover` |\n\n## Choreography\n\n여러 요소가 연속으로 전환될 때의 순서 규칙.\n\n| 시나리오 | 순서 |\n|---------|------|\n| 같은 트리거의 여러 요소 | 동시 전환 |\n| 콘텐츠 교체 (탭·스텝) | 새 요소 등장 → 이전 요소 퇴장 |\n| 레이어 해제 (모달 닫기) | 레이어 퇴장 → 배경 콘텐츠 복귀 |\n\n> ⚠️ exit duration은 enter보다 짧게. 퇴장이 느리면 전환 전체가 둔하게 느껴진다.\n\nduration-easing 기본 조합:\n\n| 시나리오 | duration | easing |\n|---------|----------|--------|\n| hover, focus | `--duration-fast` | `--easing-base` |\n| 드롭다운·팝오버 등장 | `--duration-base` | `--easing-enter` |\n| 드롭다운·팝오버 퇴장 | `--duration-fast` | `--easing-exit` |\n| 모달·사이드 패널 등장 | `--duration-slow` | `--easing-enter` |\n| 모달·사이드 패널 퇴장 | `--duration-base` | `--easing-exit` |\n| 캐러셀·슬라이드 이동 | `--duration-base` | `--easing-move` |\n\n## Do / Don't\n\n> ✅ DO — 두 상태 전환은 transition, 반복·복잡한 키프레임은 animation\n> `transition: opacity var(--duration-base) var(--easing-enter);` (등장 — 두 상태 전환)\n> `animation: spin var(--duration-base) linear infinite;` (로딩 스피너 — 반복 키프레임)\n\n> ✅ DO — 등장·퇴장에 방향 easing 명시\n> `transition: opacity var(--duration-base) var(--easing-enter);` (드롭다운 열림)\n> `transition: opacity var(--duration-fast) var(--easing-exit);` (드롭다운 닫힘)\n\n> ✅ DO — 물리적 이동에 move\n> `transition: transform var(--duration-base) var(--easing-move);` (캐러셀 슬라이드)\n\n> ✅ DO — hover·focus는 방향 없으므로 base\n> `transition: background var(--duration-fast) var(--easing-base);`\n\n> ✅ DO — 인터랙티브 요소 hover에 translate 토큰 사용\n> `transition: transform var(--duration-fast) var(--easing-base);`\n> `.btn:hover { transform: translateY(var(--translate-interactive-hover)); }`\n\n> ❌ DON'T — transition: all 금지 (의도치 않은 속성까지 전환되어 성능 저하·레이아웃 버그 유발)\n> `transition: all 0.3s ease-in-out;`\n\n> ❌ DON'T — 의미 없는 반복 animation\n> `animation: pulse 2s infinite;`\n\n> ❌ DON'T — 등장에 exit easing, 퇴장에 enter easing\n> `transition: opacity var(--duration-base) var(--easing-exit);` (모달 등장 — enter 써야 함)\n\n> ⚠️ 자동 반복 애니메이션, 장식용 모션 금지.\n> ⚠️ 사용자가 호출하지 않은 모션은 만들지 않는다(loading 인디케이터 제외).\n\n## `prefers-reduced-motion` 대응 (필수)\n\n전역 스타일시트(`global.css` 또는 `base.css`)에 한 번만 작성한다. 컴포넌트 CSS에 개별 작성하지 않는다.\n\n```css\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    transition-duration: 0.01ms !important;\n    animation-duration:  0.01ms !important;\n    animation-iteration-count: 1 !important;\n  }\n}\n```\n", "previewCSS": "@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    transition-duration: 0.01ms !important;\n    animation-duration:  0.01ms !important;\n    animation-iteration-count: 1 !important;\n  }\n}\n", "usedBy": [{"label": "ActionGroup", "slug": "components--atoms--action-group"}, {"label": "Button", "slug": "components--atoms--button"}]}, {"path": "tokens/stroke.md", "label": "스트로크", "group": "tokens", "slug": "tokens--stroke", "raw": "---\nfile: tokens/stroke.md\nversion: 1.1.0\ndepends-on: tokens/_index.md\n---\n\n# 스트로크 시스템\n\n선의 두께(width)와 스타일(style)을 정의한다.\n\n- **CSS border**: 컴포넌트 외곽선, 표 구분선 등 UI 경계에 사용\n- **SVG stroke**: 지도·데이터 시각화 도형의 획에 사용. 같은 토큰 값을 `stroke-width` 속성으로 참조한다\n\n## Semantic\n\n### Width\n\n<!-- AI: :::scale stroke-width renders:\n--stroke-sm: 1px  (기본선 — 표 구분선, subtle divider)\n--stroke-md: 2px  (강조선 — 주의를 끌어야 할 선)\n--stroke-lg: 4px  (지도 강조 레이어 · 인터랙션 hover/focus 링)\n-->\n<div class=\"scale-placeholder\" data-scale=\"stroke-width\"><\/div>\n\n### Style\n\nCSS `border-style` 전용. SVG stroke에는 적용되지 않는다.\n점·대시가 일정 간격으로 반복되는 패턴(지도 점선, 표 보조 구분선)은 Utility 클래스를 사용한다.\n\n<!-- AI: :::scale stroke-style renders CSS border-style tokens:\n--stroke-solid:  solid\n--stroke-dashed: dashed\n--stroke-dotted: dotted\n-->\n<div class=\"scale-placeholder\" data-scale=\"stroke-style\"><\/div>\n\n## Utility\n\n| 그룹 | 컨텍스트 | 사용처 | 클래스 |\n|------|----------|--------|--------|\n| `dot` | SVG | 지도 점 패턴 (4px 원형 점) | `.stroke-dot` |\n| `dash` | CSS border | 데이터테이블 헤더·셀 하단선을 보조 역할로 표시할 때 | `.stroke-dash` |\n\n`.stroke-dot`은 점 패턴을 만드는 세 가지 SVG 속성(굵기·점 간격·선 끝 처리)을 묶는다. SVG `<path>`에만 동작한다.\n\n```svg\n<path class=\"stroke-dot\" d=\"...\" />\n```\n\n`.stroke-dash`는 해당 헤더·셀이 보조 역할임을 HTML에 표시하는 마커 클래스다. 데이터테이블 컴포넌트 CSS에서 이 클래스를 셀렉터로 사용해 하단선 방향과 color를 지정한다.\n\n```html\n<th class=\"stroke-dash\">보조 헤더<\/th>\n<td class=\"stroke-dash\">보조 셀<\/td>\n```\n\n```css\n/* 데이터테이블 컴포넌트에서 방향·color 지정 */\n.data-table th.stroke-dash,\n.data-table td.stroke-dash {\n  border-bottom-width: var(--stroke-sm);\n  border-bottom-style: var(--stroke-dashed);\n  border-bottom-color: var(--color-border-subtle);\n}\n```\n\n## Do / Don't\n\n> ✅ DO — CSS border에 width + style 토큰 조합\n> `border: var(--stroke-sm) var(--stroke-solid) var(--color-border-default);`\n\n> ✅ DO — SVG 지도 강조 레이어에 width 토큰\n> `stroke-width: var(--stroke-lg); stroke: var(--color-border-selected);`\n\n> ✅ DO — 점·대시 패턴은 Utility 클래스로\n> `<path class=\"stroke-dot\" d=\"...\" />`\n\n> ❌ DON'T — 하드코딩된 수치 사용\n> `border-width: 1px;` `stroke-width: 5;`\n\n> ✅ DO — 인터랙션 hover/focus 링에 `--stroke-lg` 사용\n> `box-shadow: 0 0 0 var(--stroke-lg) var(--color-action-brand-hover);`\n\n> ❌ DON'T — `--stroke-lg`를 UI 컴포넌트 외곽선(border)에 사용\n> 컴포넌트 border에는 `--stroke-sm` 또는 `--stroke-md`를 사용한다.\n\n> ❌ DON'T — `.stroke-dot`을 CSS border에 사용\n> `.stroke-dot`은 SVG `stroke-*` 속성 조합이다. CSS `border`에는 적용되지 않는다.\n\n> ❌ DON'T — `.stroke-dash`를 SVG `<path>`에 사용\n> SVG `<path>`에는 CSS `border` 속성이 없다. `.stroke-dash`를 적용해도 아무 효과가 없다.\n", "previewCSS": "/* 데이터테이블 컴포넌트에서 방향·color 지정 */\n.data-table th.stroke-dash,\n.data-table td.stroke-dash {\n  border-bottom-width: var(--stroke-sm);\n  border-bottom-style: var(--stroke-dashed);\n  border-bottom-color: var(--color-border-subtle);\n}\n", "usedBy": [{"label": "ActionGroup", "slug": "components--atoms--action-group"}, {"label": "Button", "slug": "components--atoms--button"}]}, {"path": "tokens/icon.md", "label": "아이콘", "group": "tokens", "slug": "tokens--icon", "raw": "---\nfile: tokens/icon.md\nversion: 1.0.0\ndepends-on: tokens/_index.md\n---\n\n# 아이콘 시스템\n\n아이콘 크기는 컴포넌트 height와 매칭한다.\n\n모든 아이콘은 SVG fill 방식으로 제작한다(stroke 미사용). 크기는 CSS로 제어한다. 색상 제어 방식은 단색형·조합형에 따라 다르며 아래 Semantic 컬러 섹션을 참조한다.\n\n## Semantic\n\n### 크기\n\n<!-- AI: :::scale icon renders icon size tokens:\n--icon-badge: 12px  (badge 내부, 메타 정보)\n--icon-sm:    16px  (sm 컴포넌트)\n--icon-md:    20px  (md 컴포넌트 - Button, Input)\n--icon-lg:    24px  (lg 컴포넌트, 페이지 헤더)\n--icon-xl:    30px  (xl 컴포넌트, 네비게이션)\n-->\n<div class=\"scale-placeholder\" data-scale=\"icon\"><\/div>\n\n| 그룹 | 사용처 | 토큰 |\n|------|--------|------|\n| badge | badge 내부, 메타 정보 | `--icon-badge` |\n| sm | sm 컴포넌트 | `--icon-sm` |\n| md | md 컴포넌트 (Button, Input) | `--icon-md` |\n| lg | lg 컴포넌트, 페이지 헤더 | `--icon-lg` |\n| xl | xl 컴포넌트, 네비게이션 | `--icon-xl` |\n\n아이콘은 **padding off(기본)** / **padding on** 두 상태로 사용한다. padding on은 아이콘 주위에 padding을 추가해 터치·클릭 영역과 배경을 확보한다. 아이콘이 단독 버튼 역할이거나 배경 컨테이너가 필요한 경우 사용한다. padding off/on 클래스는 Utility 섹션을 참조한다.\n\n### 컬러\n\n아이콘 컬러는 SVG 구현 방식으로 두 가지로 구분한다.\n\n**단색형** — 모든 path가 `fill=\"currentColor\"`. CSS `color` 속성으로 일괄 제어하며 유틸리티 컬러 클래스(`.icon--brand` 등)를 적용한다. 텍스트와 함께 쓸 때는 `color: inherit`으로 상속한다.\n\n**조합형** — 각 path에 `fill=\"var(--color-*)\"` 시멘틱 토큰을 개별 지정. CSS `color`가 아닌 SVG 속성으로 색상이 고정되므로 유틸리티 컬러 클래스를 적용하지 않는다.\n```html\n<!-- 조합형 예시: path별로 다른 시멘틱 토큰 직접 지정 -->\n<path fill=\"var(--color-text-brand-vivid)\" d=\"...\" />\n<path fill=\"var(--color-text-body)\" d=\"...\" />\n```\n\nhover·active 등 상태 변화는 부모 컴포넌트에서 `color`를 오버라이드해 제어한다. 아이콘 자체는 상태를 갖지 않는다.\n\n단색형 아이콘의 허용 컬러 상태. 유틸리티 클래스로 적용하며 아래 Utility 섹션을 참조한다.\n\n| 상태 | 사용처 | 토큰 |\n|------|--------|------|\n| 브랜드 기본 | 단색 아이콘 기본 | `--color-text-brand-vivid` |\n| 중립 dark | 밝은 배경 위 아이콘 | `--color-text-body` |\n| 중립 light | 어두운 배경 위 아이콘 | `--color-text-inverse` |\n| disabled | disabled 단색 아이콘 | `--color-text-disabled` |\n\n## Utility\n\n### 크기\n\npadding off: 아이콘만 표시(배경 없음). padding on: padding 추가로 배경 영역 확보, 단독 버튼 역할 시 사용.\n\n| 그룹 | 사용처 | padding off | padding on |\n|------|--------|------------|-----------|\n| badge | badge 내부, 메타 정보 | `.icon--badge` | `.icon-on--badge` |\n| sm | sm 컴포넌트 | `.icon--sm` | `.icon-on--sm` |\n| md | md 컴포넌트 (Button, Input) | `.icon--md` | `.icon-on--md` |\n| lg | lg 컴포넌트, 페이지 헤더 | `.icon--lg` | `.icon-on--lg` |\n| xl | xl 컴포넌트, 네비게이션 | `.icon--xl` | `.icon-on--xl` |\n\n### 컬러\n\n단색형 아이콘에만 적용한다. 조합형은 SVG 레벨에서 직접 시멘틱 컬러 토큰을 참조한다.\n\n| 상태 | 사용처 | 클래스 |\n|------|--------|--------|\n| 브랜드 기본 | 단색 아이콘 기본 | `.icon--brand` |\n| 중립 dark | 밝은 배경 위 아이콘 | `.icon--dark` |\n| 중립 light | 어두운 배경 위 아이콘 | `.icon--white` |\n| disabled | disabled 상태 | `.icon--disabled` |\n\n### 방향 인디케이터 (임시)\n\n> ⚠️ 아이콘 컴포넌트 추가 전 임시 구현. `--icon-glyph-chevron-down` 토큰 + `mask-image` 방식으로 currentColor 제어. 아이콘 컴포넌트가 추가되면 유틸리티 클래스 구현만 교체한다.\n\n| 그룹 | 사용처 | 클래스 |\n|------|--------|--------|\n| `chevron-down` | 접기/펼치기 — 열린 상태 | `.icon--chevron-down` |\n| `chevron-up` | 접기/펼치기 — 닫힌 상태 | `.icon--chevron-up` |\n\n## Do / Don't\n\n> ✅ DO — padding off: 텍스트와 함께 쓰거나 장식용. SVG에 `aria-hidden=\"true\"` 적용\n> `<div class=\"icon--md icon--brand\"><Icon name=\"search\" aria-hidden=\"true\" /><\/div>`\n\n> ✅ DO — padding on: 아이콘이 단독 버튼 역할을 할 때. `aria-label` 필수\n> `<button class=\"icon-on--md icon--brand\" aria-label=\"삭제\"><Icon name=\"delete\" aria-hidden=\"true\" /><\/button>`\n\n> ❌ DON'T — `icon-on--{size}`와 `icon--{size}` 함께 사용\n> `<div class=\"icon-on--md icon--md\">` ← `icon-on--{size}`는 단독으로 쓴다. 함께 쓰면 border-radius가 중복 적용된다.\n\n> ❌ DON'T — 클래스를 svg에 직접 적용\n> `<svg class=\"icon--md\">` ← 크기·radius가 `> svg` 자식 선택자로 적용되므로 반드시 래퍼에 붙여야 한다.\n\n> ❌ DON'T — aria-label 없는 단독 아이콘 버튼\n> `<button><Icon name=\"delete\" /><\/button>` — 스크린 리더가 버튼 용도를 인식하지 못한다.\n\n> ❌ DON'T — 아이콘 색상에 Primitive 컬러 직접 사용\n> `fill: var(--color-blue-500)` — 단색형은 `--color-text-*`, 조합형은 각 path에 맞는 시멘틱 토큰을 직접 참조한다. Primitive 컬러 직접 참조 금지.\n", "previewCSS": "", "usedBy": [{"label": "ActionGroup", "slug": "components--atoms--action-group"}, {"label": "Button", "slug": "components--atoms--button"}, {"label": "Icon", "slug": "components--atoms--icon"}]}, {"path": "tokens/layout.md", "label": "레이아웃", "group": "tokens", "slug": "tokens--layout", "raw": "---\nfile: tokens/layout.md\nversion: 1.0.0\ndepends-on: tokens/_index.md\n---\n\n# 레이아웃 시스템\n\n페이지 골격 치수를 토큰으로 정의하고, 반복되는 구조 패턴을 유틸리티 클래스로 제공한다.\n\n## Semantic\n\n<!-- AI: :::scale layout renders layout dimension tokens:\n--layout-sidebar-width:           304px   사이드바 너비\n--layout-sidebar-width-collapsed:  76px   사이드바 너비(축소)\n--layout-topbar-height:            56px   상단 바 높이\n-->\n<div class=\"scale-placeholder\" data-scale=\"layout\"><\/div>\n\n| 그룹 | 사용처 | 토큰 |\n|------|--------|------|\n| `sidebar-width` | 글로벌 내비게이션 사이드바 너비 — 확장·축소 두 상태 | `--layout-sidebar-width`<br>`--layout-sidebar-width-collapsed` |\n| `topbar-height` | 글로벌 상단 바 높이 | `--layout-topbar-height` |\n\n## Utility\n\n반복되는 레이아웃 구조 패턴을 클래스로 제공한다. 간격 값은 `tokens/space.css`의 `--space-gap-*`을 참조한다.\n\n| 그룹 | 사용처 | 클래스 |\n|------|--------|--------|\n| `two-panel` | 고정 너비 패널 + 유동 패널 나란히 — 페이지·모달 공용 | `.layout-two-panel` |\n| `row-between` | flex row 양끝 정렬 — 툴바·섹션 헤더 공용 | `.layout-row-between` |\n| `form` | 폼 필드 수직 스택 / 폼 내 가로 필드 묶음 | `.layout-form-stack`<br>`.layout-form-row` |\n\n> `.layout-two-panel`의 고정 패널 너비는 유틸리티가 지정하지 않는다. 컴포넌트에서 직접 `width` 또는 `flex-basis`로 설정한다.\n>\n> **자식 순서 규칙:** 고정 패널은 반드시 첫 번째 자식, 유동 패널은 마지막 자식이어야 한다. `flex: 1`은 마지막 자식에 자동 적용되므로 순서를 바꾸면 고정 패널이 늘어난다.\n>\n> `.layout-form-row` 자식은 기본적으로 균등 너비(`flex: 1`)로 분할된다. 고정 너비가 필요한 자식은 `flex: none; width: [값]`을 직접 지정한다.\n\n## Do / Don't\n\n> ✅ DO — `.layout-two-panel`로 패널 구조 적용\n> `<div class=\"layout-two-panel\"><aside style=\"width:240px\">...<\/aside><main>...<\/main><\/div>`\n\n> ✅ DO — `.layout-form-stack` + `.layout-form-row` 중첩\n> `<div class=\"layout-form-stack\"><div class=\"layout-form-row\"><input><input><\/div><\/div>`\n\n> ✅ DO — `.layout-row-between`을 툴바와 섹션 헤더에 공용으로 사용\n> `<div class=\"layout-row-between\"><span>섹션 제목<\/span><button>+ 추가<\/button><\/div>`\n\n> ❌ DON'T — 레이아웃 패턴을 컴포넌트 CSS에서 반복 정의\n> `.my-form { display: flex; flex-direction: column; gap: 20px; }` ← `.layout-form-stack` 사용\n\n> ❌ DON'T — `.layout-two-panel` 자식에 `flex: 1`을 둘 다 적용\n> 유동 패널은 자동으로 남은 공간을 차지한다. 고정 패널에만 `width`를 지정한다.\n\n> ⚠️ `.layout-row-between`은 자식 간 gap을 지정하지 않는다. 자식 그룹 내부 간격이 필요하면 `.layout-form-row` 또는 `--space-gap-*` 직접 참조\n", "previewCSS": "", "usedBy": []}, {"path": "interaction.md", "label": "인터랙션", "group": "interaction", "slug": "interaction", "raw": "---\nfile: interaction.md\nversion: 1.0.0\n---\n\n# 인터랙션\n\n## 상태 패턴 (모든 인터랙티브 컴포넌트 동일)\n\n```\ndefault  →  hover(밝게)  →  pressed(어둡게)  →  disabled\n                                               bg:   --color-gray-100\n                                               text: --color-gray-400\n```\n\n> ⚠️ 색상만으로 상태를 구분하지 않는다. 아이콘·텍스트를 반드시 병행한다.\n> 텍스트-배경 대비 최소 **4.5:1** (WCAG AA). 자세한 기준은 `accessibility.md` 참조.\n", "previewCSS": ""}, {"path": "adaptation.md", "label": "반응형·다크모드", "group": "adaptation", "slug": "adaptation", "raw": "---\nfile: adaptation.md\nversion: 1.0.0\n---\n\n# 반응형 & 다크모드\n\n> **언제 참조하나:** 레이아웃 결정·테마 처리 시 모든 사람\n\n## 반응형 & Breakpoint\n\n김반장 3.0은 **데스크톱 우선**이다. 태블릿까지 지원, 모바일은 추후 검토.\n\n| Breakpoint | 너비 | 대응 디바이스 |\n|------------|------|--------------|\n| sm | < 768px | (현재 미지원) |\n| md | 768–1024px | 태블릿 |\n| lg | 1024–1440px | 데스크톱 (기본) |\n| xl | ≥ 1440px | 와이드 모니터 |\n\n레이아웃은 사이드바 + 콘텐츠가 화면 전체를 채운다. 콘텐츠 영역에 max-width를 두지 않는다.\n\n### 규칙\n\n- 컴포넌트는 컨테이너 너비에 따라 자연스럽게 stretch한다.\n- Sidebar는 `lg` 이상에서만 고정. `md`에서는 collapse.\n- Table은 `md` 이하에서 가로 스크롤 허용. **컬럼 reflow 금지**(데이터 비교 가능성 유지).\n- Modal은 모든 breakpoint에서 크기별 max-width 고정 + 화면 가운데 정렬. (Modal 컴포넌트 정의 시 토큰 추가)\n\n> ⚠️ 모바일(< 768px) 대응이 필요한 컴포넌트는 별도 기획 후 추가.\n> ⚠️ B2B 워크플로우 특성상 태블릿 미만은 디자인 의사결정 필요.\n\n## 다크모드 정책\n\n**현재 라이트 모드만 지원.** 토큰 구조는 다크모드 전환을 전제로 설계되어 있으나 정식 지원은 추후 결정.\n\n### 규칙\n\n- 컴포넌트에서 hex값 직접 사용 금지(다크모드 전환 시 일괄 갈아끼울 수 없게 됨).\n- Surface, text, border, shadow는 반드시 Semantic 토큰 경유.\n- 향후 다크모드 도입 시 Primitive 추가 + Semantic 매핑 변경만으로 전환 가능하도록 유지.\n\n> ✅ DO — Semantic 경유. 다크모드 전환 시 토큰만 바뀌면 됨\n> `.card { background: var(--color-surface-base); color: var(--color-text-body); }`\n\n> ❌ DON'T — hex·Primitive 직접 참조 (다크모드 전환 불가)\n> `.card { background: #ffffff; color: var(--color-gray-900); }`\n\n> 💡 Semantic 토큰을 지키는 한 다크모드는 토큰 레벨 작업으로 끝난다. 컴포넌트 코드는 그대로.\n", "previewCSS": ""}, {"path": "product.md", "label": "제품 패턴", "group": "product", "slug": "product", "raw": "---\nfile: product.md\nversion: 1.0.0\n---\n\n# 제품 제약 & 패턴\n\n## B2B SaaS 제약\n\n| 제약 | 규칙 |\n|------|------|\n| 정보 밀도 | 장식 최소화. 같은 면적에 더 많은 정보 |\n| 오류 방지 | 비가역 행동(삭제·전송)은 항상 확인 단계 |\n| 반복 효율 | 키보드 내비게이션 필수. 자주 쓰는 행동 = 최소 클릭 |\n| 일관성 | 같은 기능 = 같은 위치·모양. 컴포넌트 용도 이탈 금지 |\n| 데이터 우선 | Table·Form·Filter 최우선. Empty·Loading·Error state 필수 |\n\n### Density 모드\n\n데이터 밀도가 높은 화면(Table, Form, List)은 density 모드를 선택할 수 있다.\n\n| 모드 | 컴포넌트 height | 사용처 |\n|------|-----------------|--------|\n| Compact | `--height-compact` | 데이터 테이블, 관리자 화면 |\n| Comfortable | `--height-base` (기본) | 일반 화면 |\n| Spacious | `--height-spacious` | 폼 중심 화면, 설정 페이지 |\n\n> ⚠️ 한 페이지 내 density 혼용 금지. 페이지 단위로 통일.\n> ⚠️ Density 변경은 height 토큰만 바뀐다. 폰트·radius는 그대로 유지.\n\n## 상태 패턴 (Empty · Loading · Error)\n\n데이터를 다루는 모든 컴포넌트는 4가지 상태를 정의한다: **default · empty · loading · error**.\n\n### Empty State\n\n원인별로 메시지와 액션이 다르다. 같은 빈 화면처럼 처리하지 않는다.\n\n| 종류 | 메시지 | 액션 |\n|------|--------|------|\n| 첫 진입 (데이터 없음) | \"아직 [항목]이 없어요\" | 생성 CTA |\n| 필터 결과 없음 | \"조건에 맞는 [항목]이 없어요\" | 필터 초기화 |\n| 권한 없음 | \"이 [항목]에 접근 권한이 없어요\" | 관리자 문의 안내 |\n\n### Loading State\n\n| 종류 | 사용처 | 기준 |\n|------|--------|------|\n| Skeleton | 레이아웃 예측 가능 (Table, Card list, Form) | 1초 이상 예상 |\n| Spinner | 예측 불가, 짧은 작업 (버튼 내부, 인라인) | 1–3초 |\n| Progress bar | 진행률 표시 가능한 긴 작업 (업로드, 일괄 처리) | 3초 이상 + 진행률 측정 가능 |\n\n### Error State\n\n| 종류 | 사용처 |\n|------|--------|\n| Inline | 단일 필드 에러 (입력 검증) |\n| Banner | 섹션 단위 에러 (저장 실패, 권한 부족) |\n| Page | 전체 페이지 로드 실패 (404, 500) |\n\n### 메시지 작성 규칙\n\n> ✅ \"네트워크 연결이 끊겼어요. 잠시 후 다시 시도해주세요.\"\n\n> ❌ \"죄송합니다, 알 수 없는 오류가 발생했습니다.\"\n\n> ⚠️ 모든 에러 메시지는 **원인 + 해결 방법** 구조. 사과·자조 톤 금지.\n> ⚠️ Loading 1초 미만은 표시하지 않는다(깜빡임 방지).\n\n## 데이터 포맷팅\n\n표시 형식은 시스템 전체에서 통일한다. 같은 데이터 종류는 한 화면 내에서 형식을 맞춘다.\n\n| 종류 | 형식 | 예 |\n|------|------|-----|\n| 숫자 | 천단위 콤마, 음수는 마이너스 부호 | `1,234,567` `-128` |\n| 큰 숫자 | 한국어 단위 표기 | `1,234만` `12.5억` |\n| 소수점 | 항목별 자릿수 통일 | 통화 0자리, 비율 1자리 |\n| 날짜 | `YYYY.MM.DD` | `2025.06.01` |\n| 날짜+시간 | `YYYY.MM.DD HH:mm` | `2025.06.01 14:30` |\n| 상대시간 | 24시간 이내만 사용 | `방금 전`, `3분 전`, `2시간 전` |\n| 통화 | 단위 뒤. 천단위 콤마 | `12,000원` |\n| 빈값 | 모든 컴포넌트 동일 | `—` (em dash) |\n| 진행률 | 정수 % | `85%` |\n| ID·코드 | 고정폭 폰트 | `--font-family-mono` |\n\n> ⚠️ 같은 컬럼·같은 데이터 종류는 형식 통일. `1,234`와 `1234` 혼용 금지.\n> ⚠️ 24시간 초과 시 상대시간 → 절대 날짜로 전환. (`3일 전` 금지, `2025.05.29` 사용)\n\n## Microcopy & Voice\n\n톤은 **해요체** 기반. 짧고 명확하게.\n\n### 버튼 라벨\n\n| 형식 | 사용처 |\n|------|--------|\n| 동사 (`저장`, `삭제`, `취소`) | 1차 액션. 기본 |\n| 동사+명사 (`항목 추가`, `필터 초기화`) | 대상이 모호할 때만 |\n\n> ⚠️ \"저장하기\" \"확인하기\" 같은 ~하기 형태 금지. 명사형으로 통일.\n\n### 다이얼로그·확인\n\n| 상황 | 형식 |\n|------|------|\n| 비가역 행동 | \"[대상]을 삭제할까요?\" + 액션 동사(\"삭제\" / \"취소\") |\n| 저장 성공 | 명시적 확인 다이얼로그 없이 toast 피드백 |\n| 변경사항 손실 위험 | \"변경사항이 저장되지 않아요. 나갈까요?\" |\n\n### 로딩 메시지\n\n`.sr-only` 문구는 동작 + 진행형으로 작성한다. 완료 시 문구도 함께 정의한다.\n\n| 상태 | 형식 | 예 |\n|------|------|-----|\n| 진행 중 | 동작 + `중...` | `저장 중...` · `불러오는 중...` · `업로드 중...` |\n| 완료 | 동작 + `완료` | `저장 완료` · `업로드 완료` |\n\n### 에러 메시지\n\n원인 → 해결 방법 순서. 사용자 잘못으로 단정하지 않는다.\n\n> ✅ \"이메일 형식이 올바르지 않아요. 예: name@company.com\"\n\n> ❌ \"잘못된 이메일을 입력하셨습니다.\"\n\n> ✅ \"파일 크기는 10MB 이하만 업로드할 수 있어요.\"\n\n> ❌ \"파일이 너무 큽니다.\"\n\n### 전문 용어\n\n- B2B 표준 용어는 영어 그대로: 필터, 대시보드, 리포트, API, Webhook\n- 일상화된 용어는 한글: 저장, 검색, 설정, 삭제\n- 신규 용어 도입 시 한글 우선. 영어 병기는 첫 등장 시 1회만.\n", "previewCSS": ""}, {"path": "accessibility.md", "label": "접근성", "group": "accessibility", "slug": "accessibility", "raw": "---\nfile: accessibility.md\nversion: 1.0.0\n---\n\n# 접근성\n\nWCAG 2.1 AA 준수.\n\n---\n\n## 시스템 공통\n\n페이지·레이아웃 수준에서 전역으로 적용한다.\n\n| 영역 | 규칙 |\n|------|------|\n| 키보드 | focus 순서는 시각적 순서와 일치 |\n| 시각 | 색상만으로 의미 전달 금지. 텍스트·아이콘·패턴 병행. 본문 텍스트 최소 13px |\n| 모션 | `prefers-reduced-motion: reduce` 대응 필수 (`tokens/motion.md` 참조). 깜빡임 초당 3회 이하 |\n\n---\n\n## 컴포넌트 공통 필수\n\n모든 인터랙티브 컴포넌트에 적용한다.\n\n| 항목 | 구현 규칙 |\n|------|----------|\n| 키보드 접근 | `Tab`으로 도달 가능 |\n| focus 표시 | `:focus-visible`에 `outline: var(--stroke-md) solid var(--color-border-focus); outline-offset: var(--space-offset-focus)`<br>`:focus` 단독 사용 금지. 전역 규칙으로 일괄 적용 — 컴포넌트별 재선언 불필요 |\n| disabled | `disabled` 속성 지원 요소 (`<button>`, `<input>`, `<select>`, `<textarea>`): `disabled` + `aria-disabled=\"true\"` + `tabindex=\"-1\"`<br>`disabled` 속성 미지원 요소 (`<a>`, `<div>` 등): `aria-disabled=\"true\"` + `tabindex=\"-1\"` |\n| 색상 대비 | 텍스트 4.5:1 이상 (WCAG AA). 대형 텍스트·아이콘 3:1 이상 |\n| 아이콘 전용 | `aria-label` 필수. SVG에 `aria-hidden=\"true\"` |\n| loading 상태 | `aria-busy=\"true\"` + 스크린리더용 숨김 텍스트(`.sr-only`)<br>문구 규칙은 `product.md` 로딩 메시지 참조. 각 컴포넌트 문서에서 문구 예시 명시 |\n| 에러 메시지 | `aria-describedby`로 필드와 연결. `aria-invalid=\"true\"` + `role=\"alert\"`<br>`role=\"alert\"`는 `aria-live=\"assertive\"` 내장 — 중복 선언 불필요<br>문구 규칙은 `product.md` 에러 메시지 참조 |\n| 동적 영역 | 사용자 흐름을 끊어야 하는가로 판단<br>`aria-live=\"polite\"` — 비긴급 업데이트 (검색 결과 카운트, 필터 결과, 저장 완료 토스트)<br>`aria-live=\"assertive\"` — 긴급 시스템 알림 (세션 만료, 네트워크 끊김). 에러는 `role=\"alert\"` 사용 |\n\n**전역 focus CSS** — 프로젝트 base CSS에 한 번만 선언한다. 컴포넌트별 재선언 금지.\n\n```css\n*:focus-visible {\n  outline: var(--stroke-md) var(--stroke-solid) var(--color-border-focus);\n  outline-offset: var(--space-offset-focus);\n  z-index: var(--z-above); /* 컨테이너 border에 가려지지 않도록 */\n}\n```\n\n**에러 메시지 예시** — `aria-describedby`와 `role=\"alert\"`는 같은 요소에 적용한다.\n\n```html\n<input aria-invalid=\"true\" aria-describedby=\"email-error\" />\n<span id=\"email-error\" role=\"alert\">이메일 형식이 올바르지 않아요. 예: name@company.com<\/span>\n```\n\n**loading 상태 `.sr-only` 예시**\n\n```html\n<button aria-busy=\"true\">\n  <span aria-hidden=\"true\"><!-- spinner --><\/span>\n  <span class=\"sr-only\">저장 중...<\/span>\n<\/button>\n```\n\n---\n\n## 컴포넌트 유형별 ARIA·키보드 패턴\n\n컴포넌트 문서 `## 접근성` 섹션에서 해당 유형 행을 참조한다.\n\n| 컴포넌트 유형 | 필수 ARIA | 키보드 인터랙션 |\n|-------------|----------|--------------|\n| 버튼 | `<button>` 네이티브 권장. 불가 시 `role=\"button\"` | `Enter`·`Space` 활성화 |\n| 텍스트 인풋 | `<label>` 연결 또는 `aria-label` | — |\n| 드롭다운 | `aria-expanded`, `aria-haspopup=\"listbox\"` | `Enter` 열기, `Esc` 닫기, `↑↓` 이동 |\n| 모달 | `role=\"dialog\"`, `aria-modal=\"true\"`, `aria-labelledby` | `Esc` 닫기, FocusTrap 필수 |\n| 체크박스·라디오 그룹 | `<fieldset>` + `<legend>` | `Space` 토글 |\n| 토스트·알림 | `role=\"status\"` (비긴급) 또는 `role=\"alert\"` (긴급) | — |\n| 탭 | `role=\"tablist\"`, `role=\"tab\"`, `role=\"tabpanel\"`, `aria-selected` | `←→` 탭 전환, `Tab`으로 패널 진입 |\n| 토글·스위치 | `role=\"switch\"`, `aria-checked` | `Space` 토글 |\n", "previewCSS": "*:focus-visible {\n  outline: var(--stroke-md) var(--stroke-solid) var(--color-border-focus);\n  outline-offset: var(--space-offset-focus);\n  z-index: var(--z-above); /* 컨테이너 border에 가려지지 않도록 */\n}\n"}, {"path": "components/_index.md", "label": "아키텍처", "group": "components", "slug": "components--index", "raw": "---\nfile: components/_index.md\nversion: 1.1.0\ndepends-on: tokens/_index.md\n---\n\n# 컴포넌트 아키텍처\n\n시스템 기반(토큰·공간·색상·타이포·elevation·모션·아이콘)이 모두 정의된 후 컴포넌트를 계층 순서로 작업한다.\n\n## 컴포넌트 계층\n\n```\nAtom  →  Molecule  →  Organism  →  Pattern\n```\n\n| 레이어 | 기준 | 컴포넌트 |\n|--------|------|----------|\n| **Atom** | 분해 불가, 의존성 없음 | Button · Input · Textarea · Checkbox · Radio · Toggle · Badge · Tag · Icon · Spinner · Tooltip · Divider |\n| **Molecule** | Atom 2개+ 결합, 단일 기능 | FormField · SearchBar · Dropdown · DatePicker · DateRangePicker · Pagination · Tabs · Accordion · Toast · Alert · FileUpload |\n| **Organism** | 자체 레이아웃 보유 | Table · SidebarNav · Card · TopNav · FilterBar · Form · Modal · EmptyState · Drawer |\n| **Pattern** | 페이지 수준 구조 | Dashboard · ListPage · DetailPage · SettingsPage · AuthPage · ErrorPage |\n\n### 사용 규칙\n\n> ✅ DO — 하위 레이어 완성 후 상위 레이어 시작. 상위는 하위만 사용.\n> `Atom → Molecule → Organism → Pattern`\n> `/* Organism: Atom + Molecule 사용 가능 */`\n\n> ❌ DON'T — 순서 무시하거나 역방향 참조\n> `/* Atom 없이 FormField(Molecule) 작성 금지 */`\n> `/* Atom에서 Organism 참조 금지 */`\n\n---\n\n## Variant 모델\n\n모든 컴포넌트는 아래 차원의 조합으로 정의한다. 컴포넌트에 따라 `type` 등 추가 차원이 생길 수 있다.\n\n```\n컴포넌트 = style × size × state × icon(optional)\n```\n\n| 차원 | 설명 | 예시 |\n|------|------|------|\n| style | 시각적 변형 | primary, secondary, ghost, danger |\n| type | style 안의 세부 표현 방식. 필요한 컴포넌트에만 추가 | fill(기본·클래스 없음), solid → `btn--solid` |\n| size | 크기 | sm, md, lg |\n| state | 인터랙션 상태 (JS 제어 추가 상태) | loading, error |\n| icon | 아이콘 위치 (optional) | icon-left, icon-only |\n\n**기본값 차원은 클래스 없음**: `type: fill`, `size: md` 처럼 기본값은 별도 클래스를 추가하지 않는다. 문서 Variant 표에 \"(기본, 클래스 없음)\"으로 명시한다.\n\n### CSS 조합 방식\n\n각 차원은 독립된 CSS 클래스로 만들고 관련 속성을 묶는다.\n\n```css\n.btn--primary {\n  background: var(--color-button-brand);\n  color: var(--color-text-inverse);\n  border-color: var(--color-button-brand);\n}\n.btn--primary:hover { box-shadow: 0 0 0 var(--stroke-lg) var(--color-action-brand-hover); }\n\n.btn--md {\n  height: var(--height-base);\n  padding: var(--space-inset-squish-md);\n}\n```\n\nHTML에서는 차원 클래스를 조합해서 사용한다.\n\n```html\n<button class=\"btn btn--primary btn--md text-button-md btn--icon-left\">\n  <span class=\"icon icon--md\"><svg>...<\/svg><\/span>\n  저장\n<\/button>\n```\n\n---\n\n## 상태 규칙\n\n### 상태 완전성\n\n모든 인터랙티브 컴포넌트에 아래 상태를 모두 정의한다.\n\n```\ndefault  ·  hover  ·  disabled\n```\n\n추가: `focus`(키보드 내비게이션) · `loading`(비동기) · `error`(유효성 검사)\n\n### 우선순위\n\n동시에 여러 상태가 충돌할 때 아래 순서로 적용한다. 숫자가 낮을수록 우선.\n\n```\n1. error  →  2. disabled  →  3. loading  →  4. focus  →  5. hover  →  6. default\n```\n\n### 불가능한 조합\n\n아래 조합은 구현하지 않는다. CSS와 JS 양쪽에서 차단한다.\n\n| 조합 | 차단 방법 |\n|------|----------|\n| `disabled` + `hover` | `pointer-events: none` |\n| `disabled` + `focus` | `tabindex=\"-1\"` |\n| `loading` + `hover` | `pointer-events: none` |\n| `loading` + `focus` | `tabindex=\"-1\"` |\n\n`error + focus`는 허용 — 에러 스타일 위에 focus outline을 함께 표시한다.\n\n### 상태별 시각 피드백 패턴\n\n| 상태 | 허용 | 금지 |\n|------|------|------|\n| `hover` | `transform: scale()` 또는 background·border·box-shadow 변경 | opacity 단독 변경 |\n| `focus` | `outline: var(--stroke-md) solid var(--color-border-focus); outline-offset: var(--space-offset-focus)` — `:focus-visible` 사용 | `:focus` 단독 사용, `box-shadow`로 대체 |\n| `disabled` | `pointer-events: none` + `--color-*-disabled` 패턴 토큰 적용 | `opacity` 단독 처리 |\n| `loading` | skeleton shimmer 또는 spinner. 컴포넌트 크기 고정 유지 | 레이아웃 변경 |\n| `error` | `--color-*-error` · `--color-*-error-*` 패턴 토큰 적용 | hex 직접 사용 |\n\n---\n\n## 네이밍 규칙\n\n| 차원 | 패턴 | 예시 |\n|------|------|------|\n| Block | `.[컴포넌트]` | `.btn`, `.badge`, `.input` |\n| style | `.[컴포넌트]--[style]` | `.btn--primary`, `.btn--ghost` |\n| size | `.[컴포넌트]--[size]` | `.btn--sm`, `.btn--lg` |\n| state (JS) | `.[컴포넌트]--[state]` | `.btn--loading`, `.btn--error` |\n| state (CSS) | `.[컴포넌트]:[의사클래스]` | `.btn:hover`, `.btn:focus-visible`, `.btn:active` |\n| icon 위치 | `.[컴포넌트]--icon-[위치]` | `.btn--icon-left`, `.btn--icon-only` |\n\n> ✅ DO — full name 사용\n> `<button class=\"btn btn--primary btn--md\">`\n\n> ✅ DO — `disabled`는 클래스와 HTML 속성을 함께 적용\n> `<button class=\"btn btn--disabled\" disabled aria-disabled=\"true\" tabindex=\"-1\">`\n\n> ❌ DON'T — 약어 사용\n> `<button class=\"btn btn--pr btn--m\">`\n\n> ❌ DON'T — `is-`, `has-` 접두어 사용\n> `<button class=\"btn is-loading has-error\">`\n\n> ❌ DON'T — `disabled` 클래스 단독 사용\n> `<button class=\"btn btn--disabled\">`\n\n---\n\n## 토큰 바인딩\n\n### 결정 트리\n\n컴포넌트 CSS 속성에 값을 지정할 때 아래 순서로 판단한다.\n\n<!-- AI: 유틸리티 클래스 목록은 tokens/_index.md ## 유틸리티 클래스 참조 -->\n```\n1. 유틸리티 클래스가 있나?\n   ├─ 있다 → 유틸리티 클래스 사용. var() 참조 금지.\n   └─ 없다 → 2번으로\n\n2. 2개 이상의 컴포넌트가 같은 의미로 공유하나?\n   ├─ 공유한다 → Semantic 토큰 참조\n   └─ 이 컴포넌트만 쓴다 → 3번으로\n\n3. 다크모드·테마 전환에서 이 값이 독립적으로 바뀌어야 하나?\n   ├─ 독립 전환 필요 → Component 토큰 신규 정의 후 Semantic 참조\n   └─ Semantic과 동일하게 바뀐다 → Semantic 토큰 직접 참조\n```\n\n> ❌ DON'T — hex·px 하드코딩\n> `background: #115ac6; padding: 8px;`\n\n> ❌ DON'T — Primitive 토큰 직접 참조\n> `background: var(--color-blue-600);`\n\n### Component 토큰\n\n복잡한 컴포넌트(Modal, Table 등)의 고유값에만 정의한다. Button·Badge처럼 단순한 컴포넌트는 Semantic 토큰으로 충분하다.\n\n```\n--[속성]-[컴포넌트]-[역할]                     (variant 없을 때)\n--[속성]-[컴포넌트]-[variant]-[역할]           (variant 있을 때)\n\n예: --color-modal-overlay\n    --color-button-primary-fill\n```\n\n> ✅ DO — Component 토큰 신규 정의 시 해당 `tokens/*.css` 파일에 동시에 추가하고 사용처 주석을 명시한다.\n> `/* 사용처: modal 배경 오버레이 */`\n> `--color-modal-overlay: var(--color-surface-overlay);`\n\n---\n\n## 파일 구조\n\n```\ndesign-system/\n  components/\n    _index.md          — 컴포넌트 아키텍처 (이 문서)\n    _spec.md           — 문서 작성 규칙\n    atoms/\n      button.md\n    molecules/\n      form-field.md\n    organisms/\n      table.md\n```\n\n| 규칙 | 예시 |\n|------|------|\n| kebab-case 소문자 | `form-field.md`, `icon-button.md` |\n| 레이어 폴더(`atoms/` `molecules/` `organisms/`) 하위 | `atoms/button.md` |\n| 파일이 과도하게 길어질 때만 디렉터리로 분리 | `atoms/button/index.md` + `atoms/button/variants.md` |\n", "previewCSS": ".btn--primary {\n  background: var(--color-button-brand);\n  color: var(--color-text-inverse);\n  border-color: var(--color-button-brand);\n}\n.btn--primary:hover { box-shadow: 0 0 0 var(--stroke-lg) var(--color-action-brand-hover); }\n\n.btn--md {\n  height: var(--height-base);\n  padding: var(--space-inset-squish-md);\n}\n"}, {"path": "components/_spec.md", "label": "문서 규칙", "group": "components", "slug": "components--spec", "raw": "---\nfile: components/_spec.md\nversion: 1.1.0\ndepends-on: governance/_spec.md, components/_index.md, accessibility.md\n---\n\n# 컴포넌트 문서 작성 규칙\n\n> 표 작성 공통 규칙은 `governance/_spec.md`를 따른다.  \n> 컴포넌트 계층·Variant 모델·네이밍 규칙은 `components/_index.md`를 따른다.\n\n---\n\n## 문서 헤더\n\n최상단에 아래 필드를 포함한다.\n\n```yaml\n---\nfile: components/[layer]/[name].md\nversion:    0.1.0\nstatus:     draft\ndepends-on: components/_index.md, accessibility.md\n---\n```\n\n| 필드 | 작성 기준 | 언제 업데이트 |\n|------|----------|-------------|\n| `version` | Semantic Versioning. 규칙은 `governance/versioning.md` | 내용이 바뀔 때마다 |\n| `status` | `draft` → `stable` → `deprecated`. 팀 리뷰 후 `stable` 승격 | 상태가 바뀔 때 |\n| `depends-on` | 기본은 `components/_index.md`. 특정 토큰 문서에 강하게 의존하면 추가 | 의존성이 바뀔 때 |\n\n---\n\n## 섹션 순서\n\n```\n## 개요  →  ## Variant  →  ## 사용 지침  →  ## Anatomy  →  ## CSS  →  ## 토큰 바인딩(조건부)  →  ## 접근성  →  ## Do / Don't\n```\n\n| 섹션 | 필수 | 비고 |\n|------|------|------|\n| `## 개요` | 필수 | 아래 작성 규칙 참조 |\n| `## Variant` | 필수 | 아래 작성 규칙 참조 |\n| `## 사용 지침` | 조건부 | variant 선택 기준·화면 구성 패턴·제약이 필요한 컴포넌트에 작성 |\n| `## Anatomy` | 필수 | 아래 작성 규칙 참조 |\n| `## CSS` | 필수 | 아래 작성 규칙 참조 |\n| `## 토큰 바인딩` | 조건부 | Component 토큰 신규 정의 시에만 작성 |\n| `## 접근성` | 필수 | 아래 작성 규칙 참조 |\n| `## Do / Don't` | 필수 | `governance/_spec.md` DO/DON'T 형식. 구현 패턴에만 집중하고 선택 기준·제약과 중복되는 내용은 작성하지 않는다 |\n\n### 개요\n\n용도·사용 맥락·유사 컴포넌트와의 구별점을 모두 포함한다.\n\n```\n## 개요\n\n폼 내 단일 입력 필드. Label + Input + HelpText로 구성한다.\nInput 단독과의 차이 — Label·유효성 메시지를 포함한 완성된 입력 단위.\n```\n\n### 사용 지침\n\nvariant 선택이 복잡하거나 배치 규칙이 있는 컴포넌트에 작성한다. 아래 세 가지를 필요에 따라 조합한다.\n\n- **선택 기준 표** — variant × type 조합별 사용 조건\n- **화면 내 구성 패턴** — 실제 화면에서의 배치 예시 (코드 블록으로 작성)\n- **제약** — 금지 조합, 배치 규칙, 위임 규칙(다른 컴포넌트로 넘겨야 할 케이스)\n\n### Variant\n\n차원별 허용값과 기본값을 표로 작성한다. 기본값으로 동작해 **클래스가 없는 차원은 명시**한다.\n\n```\n| 차원 | 허용값 | 기본값 |\n|------|--------|--------|\n| style | primary · ghost · outline | primary |\n| size | sm · md · lg | md |\n```\n\n### Anatomy\n\n`:::preview` 디렉티브로 variant별 렌더링 결과를 보여준다. 뷰어에서 `## CSS` 블록이 자동 주입되어 실제 토큰 CSS가 적용된 상태로 렌더링된다.\n\n<!-- AI: :::preview는 design-system.html 뷰어 전용 디렉티브. 마크다운 표준 문법 아님. CSS는 ## CSS 섹션에 작성하면 뷰어가 자동으로 주입한다. preview 안에 <style> 블록을 별도로 작성하지 않는다. -->\n<!-- AI: 파트 명칭 표는 문서에 노출하지 않는다. 파트 구성은 HTML 예시로 파악한다.\n파트 예시: root(컴포넌트 최상위 요소), label(텍스트 콘텐츠), icon(아이콘 span, optional) -->\n\n````\n:::preview\n<div class=\"anatomy-grid\">\n<div class=\"anatomy-row\">\n  <span class=\"anatomy-label\">fill<\/span>\n  <button data-component class=\"btn btn--primary btn--md text-button-md\">저장<\/button>\n<\/div>\n<\/div>\n:::\n````\n\n> ✅ DO — 실제 사용 형태 그대로, data-component 포함\n> `<button data-component class=\"btn btn--primary btn--md text-button-md btn--icon-left\">...<\/button>`\n\n> ❌ DON'T — 간략화하거나 data-component 생략\n> `<button class=\"btn\">...<\/button>`\n\n`data-component` 속성은 뷰어가 코드 패널 HTML을 추출하는 데 사용하는 전용 속성이다. 실제 구현 코드에는 포함하지 않는다.\n\n### CSS\n\n컴포넌트의 전체 CSS를 하나의 ` ```css ``` ` 블록으로 작성한다. 이 블록은 뷰어 렌더링 시 자동으로 주입되어 `:::preview`에 적용된다.\n\n```css\n/* ── Base ── */\n.btn { ... }\n\n/* ── Size ── */\n.btn--sm { ... }\n\n/* ── Style ── */\n.btn--primary { ... }\n\n/* ── State ── */\n.btn--disabled { ... }\n.btn--loading { ... }\n```\n\n주석으로 섹션을 구분하고, 각 상태 블록은 독립적으로 복사해도 완전히 동작하도록 필요한 속성을 모두 포함한다.\n\n### 토큰 바인딩\n\nComponent 토큰 신규 정의 시에만 작성한다. 판단 기준과 네이밍 패턴은 `components/_index.md ## 토큰 바인딩`을 따른다.\n\n```\n| 파트 | 속성 | Component 토큰 | Semantic 참조 |\n|------|------|----------------|---------------|\n| overlay | background | --color-modal-overlay | --color-surface-overlay |\n| container | shadow | --shadow-modal | --shadow-xl |\n```\n\n### 접근성\n\n컴포넌트 유형을 한 줄로 명시한다. `design-system/accessibility.md` 컴포넌트 공통 필수 항목을 전체 검토해 해당하는 항목만 나열하고, 유형별 패턴에서 벗어나거나 이 컴포넌트에만 해당하는 사항을 추가한다. 공통 필수 항목 전체 복사 금지.\n\n해당 기능·상태를 구현하지 않는 항목은 생략한다. (예: loading 상태가 없으면 loading 행 생략, icon-only 형태가 없으면 아이콘 전용 행 생략)\n\n키보드 인터랙션이 있는 컴포넌트는 JS 키보드 이벤트 예시를 포함한다.\n\nloading 상태가 있는 컴포넌트는 `.sr-only` 문구 예시를 명시한다.\n\n```\n드롭다운 유형 (`design-system/accessibility.md` 드롭다운 행 적용).\n키보드 접근·focus·disabled·색상 대비 해당\n\nel.addEventListener('keydown', (e) => {\n  if (e.key === 'Enter') open();\n  if (e.key === 'Escape') close();\n  if (e.key === 'ArrowDown') focusNext();\n  if (e.key === 'ArrowUp') focusPrev();\n});\n```\n\n### Do / Don't\n\n`governance/_spec.md`의 DO/DON'T 형식을 따른다.\n\n---\n\n## Deprecation 정책\n\n제거 전 반드시 `version`을 올리고 헤더에 아래 필드를 추가한다.\n\n```yaml\n---\nfile: components/atoms/old-button.md\nversion:          2.0.0\nstatus:           deprecated\ndeprecated-since: 1.5.0\nreplaced-by:      components/atoms/button.md\nremove-at:        3.0.0\n---\n```\n\n> ❌ DON'T — Deprecate 선언 즉시 제거\n> `/* remove-at 버전 전까지 코드 유지. 절차는 workflow/designer.md 참조 */`\n", "previewCSS": "/* ── Base ── */\n.btn { ... }\n\n/* ── Size ── */\n.btn--sm { ... }\n\n/* ── Style ── */\n.btn--primary { ... }\n\n/* ── State ── */\n.btn--disabled { ... }\n.btn--loading { ... }\n"}, {"path": "components/atoms/button.md", "label": "Button", "group": "atoms", "slug": "components--atoms--button", "raw": "---\nfile: components/atoms/button.md\nversion: 1.4.0\nstatus: draft\ndepends-on: components/_index.md, accessibility.md, tokens/color.md, tokens/space.md, tokens/stroke.md, tokens/radius.md, tokens/motion.md, tokens/icon.md, components/atoms/icon.md\n---\n\n# Button\n\n## 개요\n\n사용자의 단일 액션을 트리거하는 컴포넌트. 페이지 이동에는 `<a>`를 사용하고, 동작 실행에는 Button을 사용한다.\n\n---\n\n## Variant\n\n| 차원 | 허용값 | 기본값 |\n|------|--------|--------|\n| style | primary · secondary · danger · ghost | primary |\n| type | fill (기본, 클래스 없음) · solid → `btn--solid` (ghost 제외) | fill |\n| size | sm · md · lg | md |\n| typography | text-button-sm · text-button-md · text-button-lg | size에 맞춰 사용 |\n| icon | icon-left · icon-right · icon-only | — |\n\nsize와 typography는 항상 짝을 맞춘다. `btn--sm` → `text-button-sm`, `btn--md` → `text-button-md`, `btn--lg` → `text-button-lg`. icon-only는 텍스트가 없으므로 typography 클래스를 사용하지 않는다.\n\n---\n\n## 사용 지침\n\n<!-- AI: variant 선택 기준 — 결정 계층(primary > secondary > ghost)과 최종성(fill = 최종, solid = 중간·보조) 두 축으로 결정한다. danger는 primary와 동급이나 되돌릴 수 없는 파괴적 액션에만 적용한다. 도구 버튼(필터·내보내기 등)은 ActionGroup 컴포넌트를 사용한다. -->\n\n### 선택 기준\n\n| variant | type | 사용 조건 |\n|---------|------|-----------|\n| primary | fill | 해당 화면·플로우의 **유일한 최종 결정** |\n| primary | solid | primary fill과 같은 플로우 안에서 그 다음으로 중요한 **중간 결정** (예: 다단계 선택 과정) |\n| secondary | fill | 최종 결정이 **두 선택지**로 나뉠 때 primary fill의 대안 |\n| secondary | solid | 주요 결정 영역 안에 있어야 하지만 fill보다 **낮은 우선순위**인 보조 액션. ghost와 달리 액션 자체가 보조적 중요도를 가질 때 사용한다 |\n| ghost | — | 결정의 핵심 흐름에서 **벗어나는 경로**(취소·이전 등). 전진 액션이 아니므로 시각적 무게를 줄인다. secondary solid와 달리 액션 자체의 우선순위를 낮추는 게 아니라 흐름 밖에 있음을 나타낸다 |\n| danger | fill | 되돌릴 수 없는 파괴적 액션이 **해당 화면의 최종 결정**일 때 |\n| danger | solid | 파괴적 요소가 포함되어 있음을 **경고**해야 하나, 더 중요한 최종 결정이 따로 있을 때 |\n\n### 화면 내 구성 패턴\n\n```\n단일 최종 결정\n[ghost: 취소]  [primary fill: 저장]\n\n다단계 플로우 — 중간 결정 → 최종 결정\n[ghost: 이전]  [primary solid: 선택 확인]   ···   [ghost: 취소]  [primary fill: 제출]\n\n최종 결정이 두 갈래\n[ghost: 취소]  [secondary fill: 임시저장]  [primary fill: 게시]\n\n파괴적 액션이 최종 결정\n[ghost: 취소]  [danger fill: 영구 삭제]\n\n파괴적 요소 경고 + 별도 최종 결정\n[danger solid: 삭제 포함 초기화]  [ghost: 취소]  [primary fill: 계속 진행]\n\n보조 액션이 있는 최종 결정\n[ghost: 취소]  [secondary solid: 미리보기]  [primary fill: 게시]\n```\n\n### 제약\n\n- 한 화면에 **fill 버튼은 최대 2개** — primary fill + secondary fill 조합, 또는 danger fill 단독\n- **primary fill과 danger fill을 동시에 사용하지 않는다** — 둘 다 해당 계층의 최종 결정이므로 충돌\n- **ghost는 단독으로 쓰지 않는다** — 항상 fill 또는 solid 버튼과 함께 배치\n- 버튼 **2개 이상 배치 시** `gap: var(--space-gap-xs)`, 중요도가 높은 버튼일수록 오른쪽에 배치한다\n- **danger solid는 항상 왼쪽 끝**에 배치한다 — 경고 역할이지 최종 결정이 아니므로\n- **도구 버튼**(필터·내보내기·컬럼 설정 등 페이지 핵심 목표와 무관한 보조 작업)은 이 컴포넌트가 아닌 `ActionGroup`을 사용한다\n\n---\n\n## Anatomy\n\n<!-- AI: root(.btn), 텍스트 노드(레이블, optional), icon span(.icon.icon--{size}, optional). 아이콘은 항상 DOM 첫 번째에 배치한다. icon-right는 CSS row-reverse로 시각적으로만 오른쪽에 표시된다. -->\n\n### Ghost\n\n아이콘 variant(icon-only · icon-left · icon-right)는 모든 style(primary · secondary · danger · ghost)에서 동일하게 동작한다. ghost에서만 예시를 제공하고 다른 style에서는 생략한다.\n\n<div class=\"component-preview-placeholder\" data-content=\"%3Cdiv%20class%3D%22anatomy-grid%22%3E%0A%3C%21--%20text%3A%20sm%20%2F%20md%20%2F%20lg%20%E2%80%94%20ghost%EB%8A%94%20fill%2Fsolid%20type%20%EA%B5%AC%EB%B6%84%20%EC%97%86%EC%9D%8C%20--%3E%0A%3Cdiv%20class%3D%22anatomy-row%22%3E%0A%20%20%3Cspan%20class%3D%22anatomy-label%22%3Etext%3C%2Fspan%3E%0A%20%20%3Cdiv%20class%3D%22btn-group%22%3E%0A%20%20%20%20%3Cbutton%20data-component%20class%3D%22btn%20btn--ghost%20btn--sm%20text-button-sm%22%3E%EB%B2%84%ED%8A%BC%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20data-component%20class%3D%22btn%20btn--ghost%20btn--md%20text-button-md%22%3E%EB%B2%84%ED%8A%BC%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20data-component%20class%3D%22btn%20btn--ghost%20btn--lg%20text-button-lg%22%3E%EB%B2%84%ED%8A%BC%3
