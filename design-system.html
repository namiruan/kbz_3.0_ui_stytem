v%3E%0A%3C%2Fdiv%3E%0A%3C%21--%20icon-only%20disabled%20--%3E%0A%3Cdiv%20class%3D%22anatomy-row%22%3E%0A%20%20%3Cspan%20class%3D%22anatomy-label%22%3Eicon-only%3C%2Fspan%3E%0A%20%20%3Cdiv%20class%3D%22btn-group%22%3E%0A%20%20%20%20%3Cbutton%20data-component%20class%3D%22btn%20btn--primary%20btn--sm%20btn--icon-only%20btn--disabled%22%20disabled%20aria-disabled%3D%22true%22%20tabindex%3D%22-1%22%20aria-label%3D%22%EC%B6%94%EA%B0%80%22%3E%3Cspan%20class%3D%22icon%20icon--md%22%20aria-hidden%3D%22true%22%3E%3Csvg%20aria-hidden%3D%22true%22%3E%3Cuse%20href%3D%22%23icon-add%22%2F%3E%3C%2Fsvg%3E%3C%2Fspan%3E%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20data-component%20class%3D%22btn%20btn--primary%20btn--md%20btn--icon-only%20btn--disabled%22%20disabled%20aria-disabled%3D%22true%22%20tabindex%3D%22-1%22%20aria-label%3D%22%EC%B6%94%EA%B0%80%22%3E%3Cspan%20class%3D%22icon%20icon--md%22%20aria-hidden%3D%22true%22%3E%3Csvg%20aria-hidden%3D%22true%22%3E%3Cuse%20href%3D%22%23icon-add%22%2F%3E%3C%2Fsvg%3E%3C%2Fspan%3E%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20data-component%20class%3D%22btn%20btn--primary%20btn--lg%20btn--icon-only%20btn--disabled%22%20disabled%20aria-disabled%3D%22true%22%20tabindex%3D%22-1%22%20aria-label%3D%22%EC%B6%94%EA%B0%80%22%3E%3Cspan%20class%3D%22icon%20icon--md%22%20aria-hidden%3D%22true%22%3E%3Csvg%20aria-hidden%3D%22true%22%3E%3Cuse%20href%3D%22%23icon-add%22%2F%3E%3C%2Fsvg%3E%3C%2Fspan%3E%3C%2Fbutton%3E%0A%20%20%3C%2Fdiv%3E%0A%3C%2Fdiv%3E%0A%3C%2Fdiv%3E\"><\/div>\n\n### Loading\n\n비동기 처리 중 중복 제출 방지. `btn--loading`은 variant 색상을 덮어씌우는 스켈레톤 shimmer로 표시된다. 내부 콘텐츠는 숨겨지고 버튼 형태(크기·radius)만 유지된다.\n\n<div class=\"component-preview-placeholder\" data-content=\"%3Cdiv%20class%3D%22anatomy-grid%22%3E%0A%3C%21--%20aria-label%EC%9D%80%20%EC%9B%90%EB%9E%98%20%EC%95%A1%EC%85%98%EB%AA%85%20%2B%20%22%EC%A4%91...%22%20%ED%98%95%ED%83%9C%EB%A1%9C%20%EB%8F%99%EC%A0%81%20%EC%97%85%EB%8D%B0%EC%9D%B4%ED%8A%B8.%20%EC%98%88%3A%20%EC%A0%80%EC%9E%A5%E2%86%92%22%EC%A0%80%EC%9E%A5%20%EC%A4%91...%22%2C%20%EC%A0%9C%EC%B6%9C%E2%86%92%22%EC%A0%9C%EC%B6%9C%20%EC%A4%91...%22%20--%3E%0A%3Cdiv%20class%3D%22anatomy-row%22%3E%0A%20%20%3Cspan%20class%3D%22anatomy-label%22%3Eloading%3C%2Fspan%3E%0A%20%20%3Cdiv%20class%3D%22btn-group%22%3E%0A%20%20%20%20%3Cbutton%20data-component%20class%3D%22btn%20btn--primary%20btn--sm%20btn--loading%22%20aria-label%3D%22%EC%A0%80%EC%9E%A5%20%EC%A4%91...%22%20tabindex%3D%22-1%22%3E%EC%A0%80%EC%9E%A5%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20data-component%20class%3D%22btn%20btn--primary%20btn--md%20btn--loading%22%20aria-label%3D%22%EC%A0%80%EC%9E%A5%20%EC%A4%91...%22%20tabindex%3D%22-1%22%3E%EC%A0%80%EC%9E%A5%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20data-component%20class%3D%22btn%20btn--primary%20btn--lg%20btn--loading%22%20aria-label%3D%22%EC%A0%80%EC%9E%A5%20%EC%A4%91...%22%20tabindex%3D%22-1%22%3E%EC%A0%80%EC%9E%A5%3C%2Fbutton%3E%0A%20%20%3C%2Fdiv%3E%0A%3C%2Fdiv%3E%0A%3Cdiv%20class%3D%22anatomy-row%22%3E%0A%20%20%3Cspan%20class%3D%22anatomy-label%22%3Eicon-only%3C%2Fspan%3E%0A%20%20%3Cdiv%20class%3D%22btn-group%22%3E%0A%20%20%20%20%3Cbutton%20data-component%20class%3D%22btn%20btn--primary%20btn--sm%20btn--icon-only%20btn--loading%22%20aria-label%3D%22%EC%A0%80%EC%9E%A5%20%EC%A4%91...%22%20tabindex%3D%22-1%22%3E%3Cspan%20class%3D%22icon%20icon--md%22%20aria-hidden%3D%22true%22%3E%3Csvg%20aria-hidden%3D%22true%22%3E%3Cuse%20href%3D%22%23icon-add%22%2F%3E%3C%2Fsvg%3E%3C%2Fspan%3E%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20data-component%20class%3D%22btn%20btn--primary%20btn--md%20btn--icon-only%20btn--loading%22%20aria-label%3D%22%EC%A0%80%EC%9E%A5%20%EC%A4%91...%22%20tabindex%3D%22-1%22%3E%3Cspan%20class%3D%22icon%20icon--md%22%20aria-hidden%3D%22true%22%3E%3Csvg%20aria-hidden%3D%22true%22%3E%3Cuse%20href%3D%22%23icon-add%22%2F%3E%3C%2Fsvg%3E%3C%2Fspan%3E%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20data-component%20class%3D%22btn%20btn--primary%20btn--lg%20btn--icon-only%20btn--loading%22%20aria-label%3D%22%EC%A0%80%EC%9E%A5%20%EC%A4%91...%22%20tabindex%3D%22-1%22%3E%3Cspan%20class%3D%22icon%20icon--md%22%20aria-hidden%3D%22true%22%3E%3Csvg%20aria-hidden%3D%22true%22%3E%3Cuse%20href%3D%22%23icon-add%22%2F%3E%3C%2Fsvg%3E%3C%2Fspan%3E%3C%2Fbutton%3E%0A%20%20%3C%2Fdiv%3E%0A%3C%2Fdiv%3E%0A%3C%2Fdiv%3E\"><\/div>\n\n---\n\n## CSS\n\n```css\n/* ── Base ── */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center;\n  gap: var(--space-gap-xs);\n  border: var(--stroke-sm) var(--stroke-solid) transparent;\n  border-radius: var(--radius-pill);\n  cursor: pointer;\n  white-space: nowrap;\n  transition: transform var(--duration-fast) var(--easing-base);\n}\n.btn:hover { transform: translateY(var(--translate-interactive-hover)); }\n\n/* ── Size ── */\n.btn--sm { height: var(--height-compact);   padding: var(--space-inset-squish-sm); }\n.btn--md { height: var(--height-base);      padding: var(--space-inset-squish-md); }\n.btn--lg { height: var(--height-spacious);  padding: var(--space-inset-squish-lg); }\n\n/* ── Style: fill (default) ── */\n.btn--primary   { background: var(--color-button-brand);   color: var(--color-text-inverse); border-color: var(--color-button-brand); }\n.btn--secondary { background: var(--color-button-neutral); color: var(--color-text-inverse); border-color: var(--color-button-neutral); }\n.btn--danger    { background: var(--color-button-error);   color: var(--color-text-inverse); border-color: var(--color-button-error); }\n.btn--ghost     { background: var(--color-surface-base); color: var(--color-text-body); border-color: transparent; }\n\n/* ── Style: solid ── */\n.btn--primary.btn--solid   { background: var(--color-surface-base); color: var(--color-button-brand);   border-color: var(--color-button-brand); }\n.btn--secondary.btn--solid { background: var(--color-surface-base); color: var(--color-button-neutral); border-color: var(--color-button-neutral); }\n.btn--danger.btn--solid    { background: var(--color-surface-base); color: var(--color-button-error);   border-color: var(--color-button-error); }\n\n/* ── Hover ── */\n.btn--primary:hover   { box-shadow: 0 0 0 var(--stroke-lg) var(--color-action-brand-hover); }\n.btn--secondary:hover { box-shadow: 0 0 0 var(--stroke-lg) var(--color-action-neutral-hover); }\n.btn--danger:hover    { box-shadow: 0 0 0 var(--stroke-lg) var(--color-action-error-hover); }\n.btn--ghost:hover     { box-shadow: 0 0 0 var(--stroke-lg) var(--color-action-neutral-hover); }\n\n/* ── State ── */\n.btn--disabled { pointer-events: none; color: var(--color-text-disabled); background: var(--color-surface-disabled); border-color: var(--color-border-disabled); }\n\n/* ── Icon (.icon 컴포넌트 사용) ── */\n.btn--icon-only { padding: 0; }\n.btn--icon-only.btn--sm { width: var(--height-compact); }\n.btn--icon-only.btn--md { width: var(--height-base); }\n.btn--icon-only.btn--lg { width: var(--height-spacious); }\n\n/* icon-left/right: 아이콘 span은 항상 DOM 첫 번째에 둔다.\n   icon-right만 row-reverse로 시각 순서를 역전시킨다. icon-left는 기본 row라 선언 불필요. */\n.btn--icon-right { flex-direction: row-reverse; }\n\n/* ── Button Group (2개 이상 배치 시 간격 규칙) ── */\n.btn-group { display: flex; align-items: center; gap: var(--space-gap-xs); }\n\n/* ── Loading (skeleton shimmer) ── */\n/* variant 색상을 덮어씌우고 버튼 형태만 유지. 내부 콘텐츠는 color: transparent로 숨긴다.\n   background 단축 속성 대신 background-image/color를 분리해야 background-position 애니메이션이 동작한다. */\n@keyframes btn-skeleton-shimmer {\n  0%   { background-position: 200% 0; }\n  100% { background-position: -200% 0; }\n}\n.btn--loading {\n  pointer-events: none;\n  color: transparent;\n  border-color: transparent;\n  background-color: var(--color-surface-neutral);\n  background-image: linear-gradient(90deg, transparent, var(--color-surface-base), transparent);\n  background-size: 300% 100%;\n  background-repeat: no-repeat;\n  animation: btn-skeleton-shimmer 1.4s ease-in-out infinite;\n}\n```\n\n---\n\n## 접근성\n\n전체 규칙은 `accessibility.md` 버튼 행을 따른다. 이 컴포넌트에 적용되는 핵심 사항:\n\n| 상황 | 마크업 |\n|------|--------|\n| icon-only | `aria-label=\"액션명\"` 필수 |\n| disabled | `disabled` + `aria-disabled=\"true\"` + `tabindex=\"-1\"` |\n| loading | `btn--loading` + `tabindex=\"-1\"` + `aria-label`을 액션에 맞게 동적 업데이트 |\n| loading 완료 | `aria-live=\"polite\"` 영역에 완료 문구 출력 후 버튼 원상 복구 |\n\nloading 구현 예시:\n\n```js\n// 시작\nbtn.classList.add('btn--loading');\nbtn.setAttribute('tabindex', '-1');\nbtn.setAttribute('aria-label', '저장 중...');\n\n// 완료\nbtn.classList.remove('btn--loading');\nbtn.removeAttribute('tabindex');\nbtn.setAttribute('aria-label', '저장');         // 원래 레이블로 복구\nliveRegion.textContent = '저장 완료';            // aria-live=\"polite\" 영역\n```\n\n포커스 링은 `:focus-visible`로 처리되어 마우스 클릭 시에는 표시되지 않는다.\n\n---\n\n## Do / Don't\n\n> ✅ DO — 동작 실행에 button 태그 사용\n> `<button class=\"btn btn--primary btn--md text-button-md\">저장<\/button>`\n\n> ❌ DON'T — 페이지 이동에 Button 사용\n> `<button onclick=\"location.href='/home'\">홈으로<\/button>` → `<a>` 사용\n\n> ✅ DO — icon-only에 aria-label 명시\n> `<button class=\"btn btn--icon-only\" aria-label=\"삭제\">`\n\n> ❌ DON'T — loading 중 중복 제출 허용\n> loading 클래스 없이 비동기 처리 → `btn--loading` + `tabindex=\"-1\"` 필수\n\n> ❌ DON'T — data-component 속성을 실제 코드에 포함\n> `data-component`는 디자인 시스템 문서 뷰어 전용. 실제 구현 코드에서는 제거한다.\n", "previewCSS": "/* ── Base ── */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center;\n  gap: var(--space-gap-xs);\n  border: var(--stroke-sm) var(--stroke-solid) transparent;\n  border-radius: var(--radius-pill);\n  cursor: pointer;\n  white-space: nowrap;\n  transition: transform var(--duration-fast) var(--easing-base);\n}\n.btn:hover { transform: translateY(var(--translate-interactive-hover)); }\n\n/* ── Size ── */\n.btn--sm { height: var(--height-compact);   padding: var(--space-inset-squish-sm); }\n.btn--md { height: var(--height-base);      padding: var(--space-inset-squish-md); }\n.btn--lg { height: var(--height-spacious);  padding: var(--space-inset-squish-lg); }\n\n/* ── Style: fill (default) ── */\n.btn--primary   { background: var(--color-button-brand);   color: var(--color-text-inverse); border-color: var(--color-button-brand); }\n.btn--secondary { background: var(--color-button-neutral); color: var(--color-text-inverse); border-color: var(--color-button-neutral); }\n.btn--danger    { background: var(--color-button-error);   color: var(--color-text-inverse); border-color: var(--color-button-error); }\n.btn--ghost     { background: var(--color-surface-base); color: var(--color-text-body); border-color: transparent; }\n\n/* ── Style: solid ── */\n.btn--primary.btn--solid   { background: var(--color-surface-base); color: var(--color-button-brand);   border-color: var(--color-button-brand); }\n.btn--secondary.btn--solid { background: var(--color-surface-base); color: var(--color-button-neutral); border-color: var(--color-button-neutral); }\n.btn--danger.btn--solid    { background: var(--color-surface-base); color: var(--color-button-error);   border-color: var(--color-button-error); }\n\n/* ── Hover ── */\n.btn--primary:hover   { box-shadow: 0 0 0 var(--stroke-lg) var(--color-action-brand-hover); }\n.btn--secondary:hover { box-shadow: 0 0 0 var(--stroke-lg) var(--color-action-neutral-hover); }\n.btn--danger:hover    { box-shadow: 0 0 0 var(--stroke-lg) var(--color-action-error-hover); }\n.btn--ghost:hover     { box-shadow: 0 0 0 var(--stroke-lg) var(--color-action-neutral-hover); }\n\n/* ── State ── */\n.btn--disabled { pointer-events: none; color: var(--color-text-disabled); background: var(--color-surface-disabled); border-color: var(--color-border-disabled); }\n\n/* ── Icon (.icon 컴포넌트 사용) ── */\n.btn--icon-only { padding: 0; }\n.btn--icon-only.btn--sm { width: var(--height-compact); }\n.btn--icon-only.btn--md { width: var(--height-base); }\n.btn--icon-only.btn--lg { width: var(--height-spacious); }\n\n/* icon-left/right: 아이콘 span은 항상 DOM 첫 번째에 둔다.\n   icon-right만 row-reverse로 시각 순서를 역전시킨다. icon-left는 기본 row라 선언 불필요. */\n.btn--icon-right { flex-direction: row-reverse; }\n\n/* ── Button Group (2개 이상 배치 시 간격 규칙) ── */\n.btn-group { display: flex; align-items: center; gap: var(--space-gap-xs); }\n\n/* ── Loading (skeleton shimmer) ── */\n/* variant 색상을 덮어씌우고 버튼 형태만 유지. 내부 콘텐츠는 color: transparent로 숨긴다.\n   background 단축 속성 대신 background-image/color를 분리해야 background-position 애니메이션이 동작한다. */\n@keyframes btn-skeleton-shimmer {\n  0%   { background-position: 200% 0; }\n  100% { background-position: -200% 0; }\n}\n.btn--loading {\n  pointer-events: none;\n  color: transparent;\n  border-color: transparent;\n  background-color: var(--color-surface-neutral);\n  background-image: linear-gradient(90deg, transparent, var(--color-surface-base), transparent);\n  background-size: 300% 100%;\n  background-repeat: no-repeat;\n  animation: btn-skeleton-shimmer 1.4s ease-in-out infinite;\n}\n"}, {"path": "components/atoms/action-group.md", "label": "ActionGroup", "group": "atoms", "slug": "components--atoms--action-group", "raw": "---\nfile: components/atoms/action-group.md\nversion: 0.2.0\nstatus: draft\ndepends-on: components/_index.md, accessibility.md, tokens/color.md, tokens/space.md, tokens/stroke.md, tokens/radius.md, tokens/motion.md, tokens/icon.md, tokens/typography.md, components/atoms/icon.md\n---\n\n# ActionGroup\n\n## 개요\n\n페이지 핵심 목표와 무관한 보조 도구 버튼을 묶는 컨테이너. 필터·내보내기·컬럼 설정·새로 고침 등 결정 계층이 없는 동등한 도구 액션에 사용한다. 버튼이 1개뿐이어도 도구 영역임을 시각적으로 나타내야 할 때 ActionGroup을 사용한다.\n\nButton과의 차이 — ActionGroup은 결정 계층이 없는 도구 영역에 사용하고, 결정을 트리거하는 버튼은 Button 컴포넌트를 사용한다.\n\n---\n\n## Variant\n\n| 차원 | 허용값 | 기본값 |\n|------|--------|--------|\n| size | sm · md | sm |\n| typography | text-button-sm · text-button-md | size에 맞춰 사용 |\n| icon | icon-left · icon-right · icon-only | — |\n| label | 있음 · 없음 | 없음 |\n\nsize와 typography는 항상 짝을 맞춘다. `action-btn--sm` → `text-button-sm`, `action-btn--md` → `text-button-md`. icon-only는 텍스트가 없으므로 typography 클래스를 사용하지 않는다.\n\n---\n\n## 사용 지침\n\n### 선택 기준\n\nActionGroup은 결정 계층이 필요 없는 도구 버튼 모음에 사용한다. 특정 버튼이 다른 버튼보다 중요하거나 결정을 트리거해야 한다면 Button 컴포넌트를 사용한다.\n\n### 화면 내 구성 패턴\n\n```\n페이지 상단 도구 영역 — 복수 도구\n[action-group: 시간변경  퇴근시간  단가]           [primary fill: 새 항목 추가]\n\n페이지 상단 도구 영역 — 라벨 있는 그룹\n일괄변경 [action-group: 퇴근시간  단가]            [primary fill: 새 항목 추가]\n\n페이지 상단 도구 영역 — 단일 도구\n[action-group: 실시간 위치요청]                    [primary fill: 새 항목 추가]\n\n테이블 행 인라인 도구 — 행별 퀵 액션\n[action-group: 승인  반려]\n```\n\n### 제약\n\n- ActionGroup 내 버튼은 **결정 계층이 없는 동등한 도구 액션**만 배치한다. 중요도 차이가 생기면 Button 컴포넌트로 분리한다.\n- 버튼 수는 **최대 5개**를 권장한다. 그 이상은 드롭다운으로 묶는다.\n- ActionGroup 내 `.action-btn`은 **항상 같은 size**를 사용한다. 혼용 금지.\n- **icon 유형은 그룹 안에서 통일**한다 — icon-only·icon-left·icon-right·텍스트 단독을 혼용하지 않는다.\n- **라벨은 버튼명만으로 그룹 목적을 파악하기 어려울 때만** 붙인다. 버튼명이 이미 명확하면 생략한다. 라벨을 붙일 때는 `.action-group-labeled` wrapper를 사용하고, 라벨을 `.action-group` 안에 넣지 않는다.\n\n---\n\n## Anatomy\n\n<!-- AI: root(.action-group), label(.action-group-label, optional), item(.action-btn), icon span(.icon.icon--{size}, optional).\n  - 라벨이 있을 때는 .action-group-labeled wrapper로 감싸고, 라벨은 .action-group 밖에 위치한다. 라벨은 bordered box 안에 들어가지 않는다.\n  - 아이콘 span은 항상 DOM 첫 번째에 배치한다. icon-right는 CSS row-reverse로 시각적으로만 오른쪽에 표시된다.\n  - 라벨 있음: aria-labelledby로 label id 참조. 라벨 없음: aria-label 직접 명시. -->\n\n### 기본\n\n버튼 1개 단독 또는 여러 개 조합 모두 `.action-group` 컨테이너를 그대로 사용한다. 단일일 때는 구분선 없이 외곽 테두리만 표시된다.\n\n<div class=\"component-preview-placeholder\" data-content=\"%3Cdiv%20class%3D%22anatomy-grid%22%3E%0A%3C%21--%20single%3A%20sm%20%2F%20md%20--%3E%0A%3Cdiv%20class%3D%22anatomy-row%22%3E%0A%20%20%3Cspan%20class%3D%22anatomy-label%22%3Esingle%3C%2Fspan%3E%0A%20%20%3Cdiv%20data-component%20class%3D%22action-group%22%20role%3D%22toolbar%22%20aria-label%3D%22%EA%B7%BC%ED%83%9C%20%EB%8F%84%EA%B5%AC%22%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--sm%20text-button-sm%22%3E%ED%87%B4%EA%B7%BC%EC%8B%9C%EA%B0%84%3C%2Fbutton%3E%0A%20%20%3C%2Fdiv%3E%0A%20%20%3Cdiv%20data-component%20class%3D%22action-group%22%20role%3D%22toolbar%22%20aria-label%3D%22%EA%B7%BC%ED%83%9C%20%EB%8F%84%EA%B5%AC%22%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--md%20text-button-md%22%3E%ED%87%B4%EA%B7%BC%EC%8B%9C%EA%B0%84%3C%2Fbutton%3E%0A%20%20%3C%2Fdiv%3E%0A%3C%2Fdiv%3E%0A%3C%21--%20multi%3A%20sm%20%2F%20md%20--%3E%0A%3Cdiv%20class%3D%22anatomy-row%22%3E%0A%20%20%3Cspan%20class%3D%22anatomy-label%22%3Emulti%3C%2Fspan%3E%0A%20%20%3Cdiv%20data-component%20class%3D%22action-group%22%20role%3D%22toolbar%22%20aria-label%3D%22%EA%B7%BC%ED%83%9C%20%EA%B4%80%EB%A6%AC%20%EB%8F%84%EA%B5%AC%22%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--sm%20text-button-sm%22%3E%EC%8B%9C%EA%B0%84%EB%B3%80%EA%B2%BD%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--sm%20text-button-sm%22%3E%ED%87%B4%EA%B7%BC%EC%8B%9C%EA%B0%84%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--sm%20text-button-sm%22%3E%EB%8B%A8%EA%B0%80%3C%2Fbutton%3E%0A%20%20%3C%2Fdiv%3E%0A%20%20%3Cdiv%20data-component%20class%3D%22action-group%22%20role%3D%22toolbar%22%20aria-label%3D%22%EA%B7%BC%ED%83%9C%20%EA%B4%80%EB%A6%AC%20%EB%8F%84%EA%B5%AC%22%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--md%20text-button-md%22%3E%EC%8B%9C%EA%B0%84%EB%B3%80%EA%B2%BD%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--md%20text-button-md%22%3E%ED%87%B4%EA%B7%BC%EC%8B%9C%EA%B0%84%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--md%20text-button-md%22%3E%EB%8B%A8%EA%B0%80%3C%2Fbutton%3E%0A%20%20%3C%2Fdiv%3E%0A%3C%2Fdiv%3E%0A%3C%2Fdiv%3E\"><\/div>\n\n### 아이콘\n\n<div class=\"component-preview-placeholder\" data-content=\"%3Cdiv%20class%3D%22anatomy-grid%22%3E%0A%3C%21--%20icon-only%3A%20sm%20%28%EA%B8%B0%EB%B3%B8%EA%B0%92%29%20%E2%80%94%20aria-label%20%ED%95%84%EC%88%98%20--%3E%0A%3Cdiv%20class%3D%22anatomy-row%22%3E%0A%20%20%3Cspan%20class%3D%22anatomy-label%22%3Eicon-only%3C%2Fspan%3E%0A%20%20%3Cdiv%20data-component%20class%3D%22action-group%22%20role%3D%22toolbar%22%20aria-label%3D%22%EC%9C%84%EC%B9%98%20%EB%8F%84%EA%B5%AC%22%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--sm%20action-btn--icon-only%22%20aria-label%3D%22%EC%8B%A4%EC%8B%9C%EA%B0%84%20%EC%9C%84%EC%B9%98%EC%9A%94%EC%B2%AD%22%3E%3Cspan%20class%3D%22icon%20icon--md%22%20aria-hidden%3D%22true%22%3E%3Csvg%20aria-hidden%3D%22true%22%3E%3Cuse%20href%3D%22%23icon-add%22%2F%3E%3C%2Fsvg%3E%3C%2Fspan%3E%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--sm%20action-btn--icon-only%22%20aria-label%3D%22%EC%8A%B9%EC%9D%B8%22%3E%3Cspan%20class%3D%22icon%20icon--md%22%20aria-hidden%3D%22true%22%3E%3Csvg%20aria-hidden%3D%22true%22%3E%3Cuse%20href%3D%22%23icon-chevron-right%22%2F%3E%3C%2Fsvg%3E%3C%2Fspan%3E%3C%2Fbutton%3E%0A%20%20%3C%2Fdiv%3E%0A%3C%2Fdiv%3E%0A%3C%21--%20icon-left%3A%20sm%20%28%EA%B8%B0%EB%B3%B8%EA%B0%92%29%20%E2%80%94%20%EC%95%84%EC%9D%B4%EC%BD%98%20span%20%ED%95%AD%EC%83%81%20DOM%20%EC%B2%AB%20%EB%B2%88%EC%A7%B8%20--%3E%0A%3Cdiv%20class%3D%22anatomy-row%22%3E%0A%20%20%3Cspan%20class%3D%22anatomy-label%22%3Eicon-left%3C%2Fspan%3E%0A%20%20%3Cdiv%20data-component%20class%3D%22action-group%22%20role%3D%22toolbar%22%20aria-label%3D%22%EC%8B%9C%EA%B0%84%20%EA%B4%80%EB%A6%AC%20%EB%8F%84%EA%B5%AC%22%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--sm%20text-button-sm%20action-btn--icon-left%22%3E%3Cspan%20class%3D%22icon%20icon--md%22%20aria-hidden%3D%22true%22%3E%3Csvg%20aria-hidden%3D%22true%22%3E%3Cuse%20href%3D%22%23icon-add%22%2F%3E%3C%2Fsvg%3E%3C%2Fspan%3E%EC%8B%9C%EA%B0%84%EB%B3%80%EA%B2%BD%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--sm%20text-button-sm%20action-btn--icon-left%22%3E%3Cspan%20class%3D%22icon%20icon--md%22%20aria-hidden%3D%22true%22%3E%3Csvg%20aria-hidden%3D%22true%22%3E%3Cuse%20href%3D%22%23icon-add%22%2F%3E%3C%2Fsvg%3E%3C%2Fspan%3E%ED%87%B4%EA%B7%BC%EC%8B%9C%EA%B0%84%3C%2Fbutton%3E%0A%20%20%3C%2Fdiv%3E%0A%3C%2Fdiv%3E%0A%3C%21--%20icon-right%3A%20sm%20%28%EA%B8%B0%EB%B3%B8%EA%B0%92%29%20%E2%80%94%20 %84%EA%B5%AC%22%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--md%20text-button-md%20action-btn--disabled%22%20disabled%20aria-disabled%3D%22true%22%20tabindex%3D%22-1%22%3E%ED%87%B4%EA%B7%BC%EC%8B%9C%EA%B0%84%3C%2Fbutton%3E%0A%20%20%3C%2Fdiv%3E%0A%3C%2Fdiv%3E%0A%3C%21--%20multi%3A%20%EC%9D%BC%EB%B6%80%20disabled%20--%3E%0A%3Cdiv%20class%3D%22anatomy-row%22%3E%0A%20%20%3Cspan%20class%3D%22anatomy-label%22%3Emulti%3C%2Fspan%3E%0A%20%20%3Cdiv%20data-component%20class%3D%22action-group%22%20role%3D%22toolbar%22%20aria-label%3D%22%EA%B7%BC%ED%83%9C%20%EA%B4%80%EB%A6%AC%20%EB%8F%84%EA%B5%AC%22%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--sm%20text-button-sm%22%3E%EC%8B%9C%EA%B0%84%EB%B3%80%EA%B2%BD%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--sm%20text-button-sm%20action-btn--disabled%22%20disabled%20aria-disabled%3D%22true%22%20tabindex%3D%22-1%22%3E%ED%87%B4%EA%B7%BC%EC%8B%9C%EA%B0%84%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--sm%20text-button-sm%22%3E%EB%8B%A8%EA%B0%80%3C%2Fbutton%3E%0A%20%20%3C%2Fdiv%3E%0A%20%20%3Cdiv%20data-component%20class%3D%22action-group%22%20role%3D%22toolbar%22%20aria-label%3D%22%EA%B7%BC%ED%83%9C%20%EA%B4%80%EB%A6%AC%20%EB%8F%84%EA%B5%AC%22%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--md%20text-button-md%22%3E%EC%8B%9C%EA%B0%84%EB%B3%80%EA%B2%BD%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--md%20text-button-md%20action-btn--disabled%22%20disabled%20aria-disabled%3D%22true%22%20tabindex%3D%22-1%22%3E%ED%87%B4%EA%B7%BC%EC%8B%9C%EA%B0%84%3C%2Fbutton%3E%0A%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--md%20text-button-md%22%3E%EB%8B%A8%EA%B0%80%3C%2Fbutton%3E%0A%20%20%3C%2Fdiv%3E%0A%3C%2Fdiv%3E%0A%3C%2Fdiv%3E\"><\/div>\n\n### 라벨\n\n버튼명만으로 그룹 목적을 파악하기 어려울 때 `.action-group-labeled` wrapper로 감싸고 라벨을 `.action-group` 앞에 배치한다. 라벨은 bordered box 바깥에 위치하며 버튼명이 충분히 명확하면 생략한다. 라벨 텍스트 스타일은 `.text-form-label` 유틸리티를 사용한다.\n\n<div class=\"component-preview-placeholder\" data-content=\"%3Cdiv%20class%3D%22anatomy-grid%22%3E%0A%3Cdiv%20class%3D%22anatomy-row%22%3E%0A%20%20%3Cspan%20class%3D%22anatomy-label%22%3Elabel%3C%2Fspan%3E%0A%20%20%3Cdiv%20data-component%20class%3D%22action-group-labeled%22%3E%0A%20%20%20%20%3Cspan%20class%3D%22action-group-label%20text-form-label%22%20id%3D%22ag-ex-1%22%3E%EC%9D%BC%EA%B4%84%EB%B3%80%EA%B2%BD%3C%2Fspan%3E%0A%20%20%20%20%3Cdiv%20class%3D%22action-group%22%20role%3D%22toolbar%22%20aria-labelledby%3D%22ag-ex-1%22%3E%0A%20%20%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--sm%20text-button-sm%22%3E%ED%87%B4%EA%B7%BC%EC%8B%9C%EA%B0%84%3C%2Fbutton%3E%0A%20%20%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--sm%20text-button-sm%22%3E%EB%8B%A8%EA%B0%80%3C%2Fbutton%3E%0A%20%20%20%20%3C%2Fdiv%3E%0A%20%20%3C%2Fdiv%3E%0A%20%20%3Cdiv%20data-component%20class%3D%22action-group-labeled%22%3E%0A%20%20%20%20%3Cspan%20class%3D%22action-group-label%20text-form-label%22%20id%3D%22ag-ex-2%22%3E%EC%9D%BC%EA%B4%84%EB%B3%80%EA%B2%BD%3C%2Fspan%3E%0A%20%20%20%20%3Cdiv%20class%3D%22action-group%22%20role%3D%22toolbar%22%20aria-labelledby%3D%22ag-ex-2%22%3E%0A%20%20%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--md%20text-button-md%22%3E%ED%87%B4%EA%B7%BC%EC%8B%9C%EA%B0%84%3C%2Fbutton%3E%0A%20%20%20%20%20%20%3Cbutton%20class%3D%22action-btn%20action-btn--md%20text-button-md%22%3E%EB%8B%A8%EA%B0%80%3C%2Fbutton%3E%0A%20%20%20%20%3C%2Fdiv%3E%0A%20%20%3C%2Fdiv%3E%0A%3C%2Fdiv%3E%0A%3C%2Fdiv%3E\"><\/div>\n\n---\n\n## CSS\n\n```css\n/* ── Container ── */\n.action-group {\n  display: inline-flex;\n  border: var(--stroke-sm) var(--stroke-solid) var(--color-border-brand);\n  border-radius: var(--radius-xs);\n  /* overflow: hidden 사용 금지 — focus outline이 잘린다.\n     대신 첫·마지막 버튼에 border-radius를 직접 적용해 모서리를 처리한다. */\n}\n/* 활성 버튼이 하나도 없으면(단일 disabled 포함) 컨테이너 테두리도 disabled 색으로 자동 전환 */\n.action-group:not(:has(.action-btn:not(.action-btn--disabled))) {\n  border-color: var(--color-border-disabled);\n}\n\n/* ── Corner radius (overflow: hidden 대신) ── */\n/* 내부 radius = 컨테이너 radius - 테두리 두께(1px) */\n.action-group > .action-btn:first-child { border-radius: calc(var(--radius-xs) - var(--stroke-sm)) 0 0 calc(var(--radius-xs) - var(--stroke-sm)); }\n.action-group > .action-btn:last-child  { border-radius: 0 calc(var(--radius-xs) - var(--stroke-sm)) calc(var(--radius-xs) - var(--stroke-sm)) 0; }\n.action-group > .action-btn:only-child  { border-radius: calc(var(--radius-xs) - var(--stroke-sm)); }\n\n/* ── Item Base ── */\n.action-btn {\n  position: relative;\n  display: inline-flex; align-items: center; justify-content: center;\n  gap: var(--space-gap-xs);\n  background: var(--color-surface-base);\n  color: var(--color-text-brand);\n  border: none;\n  cursor: pointer;\n  white-space: nowrap;\n  transition: background var(--duration-fast) var(--easing-base);\n}\n/* 구분선을 ::before 가상 요소로 분리 — 버튼 상태(disabled 등)가 구분선 색에 영향을 주지 않는다 */\n.action-btn + .action-btn::before {\n  content: '';\n  position: absolute;\n  left: 0; top: 0; bottom: 0;\n  width: var(--stroke-sm);\n  background: var(--color-border-brand);\n}\n.action-btn:hover { background: var(--color-action-brand-hover); }\n\n/* ── Size ── */\n.action-btn--sm { height: var(--height-compact);  padding: var(--space-inset-squish-sm); }\n.action-btn--md { height: var(--height-base);     padding: var(--space-inset-squish-sm); }\n\n/* ── State ── */\n.action-btn--disabled { pointer-events: none; color: var(--color-text-disabled); background: var(--color-surface-disabled); }\n\n/* ── Icon (.icon 컴포넌트 사용) ── */\n.action-btn--icon-only { padding: 0; }\n.action-btn--icon-only.action-btn--sm { width: var(--height-compact); }\n.action-btn--icon-only.action-btn--md { width: var(--height-base); }\n\n/* icon-left/right: 아이콘 span은 항상 DOM 첫 번째에 둔다.\n   icon-right만 row-reverse로 시각 순서를 역전시킨다. icon-left는 기본 row라 선언 불필요. */\n.action-btn--icon-right { flex-direction: row-reverse; }\n\n/* ── Labeled wrapper ── */\n/* 라벨과 .action-group을 가로로 묶는 컨테이너. 라벨은 bordered box 밖에 위치한다. */\n.action-group-labeled {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--space-gap-xs);\n}\n/* 텍스트 스타일은 .text-form-label 유틸리티에서 가져온다. */\n.action-group-label { white-space: nowrap; color: var(--color-text-brand-muted); }\n```\n\n---\n\n## 접근성\n\n버튼 유형 (`accessibility.md` 버튼 행 적용). 키보드 접근·focus·disabled 해당.\n\n| 상황 | 마크업 |\n|------|--------|\n| 컨테이너 (라벨 없음) | `role=\"toolbar\"` + `aria-label=\"그룹 목적\"` |\n| 컨테이너 (라벨 있음) | `role=\"toolbar\"` + `aria-labelledby=\"label-id\"` — visible label이 있으므로 aria-label 대신 참조 |\n| icon-only | `aria-label=\"액션명\"` 필수 |\n| disabled | `disabled` + `aria-disabled=\"true\"` + `tabindex=\"-1\"` |\n\n```html\n<!-- 라벨 없음 -->\n<div class=\"action-group\" role=\"toolbar\" aria-label=\"근태 관리 도구\">\n  <button class=\"action-btn action-btn--sm text-button-sm\">시간변경<\/button>\n  <button class=\"action-btn action-btn--sm text-button-sm\">퇴근시간<\/button>\n<\/div>\n\n<!-- 라벨 있음 -->\n<div class=\"action-group-labeled\">\n  <span class=\"action-group-label text-form-label\" id=\"ag-label\">일괄변경<\/span>\n  <div class=\"action-group\" role=\"toolbar\" aria-labelledby=\"ag-label\">\n    <button class=\"action-btn action-btn--sm text-button-sm\">퇴근시간<\/button>\n    <button class=\"action-btn action-btn--sm text-button-sm\">단가<\/button>\n  <\/div>\n<\/div>\n```\n\n포커스 링은 `:focus-visible`로 처리되어 마우스 클릭 시에는 표시되지 않는다.\n\n---\n\n## Do / Don't\n\n> ✅ DO — 컨테이너에 role=\"toolbar\" + aria-label 명시\n> `<div class=\"action-group\" role=\"toolbar\" aria-label=\"근태 관리 도구\">`\n\n> ✅ DO — 라벨 있을 때 .action-group-labeled wrapper + aria-labelledby 사용\n> `<div class=\"action-group-labeled\"><span class=\"action-group-label text-form-label\" id=\"lbl\">일괄변경<\/span><div class=\"action-group\" role=\"toolbar\" aria-labelledby=\"lbl\">...<\/div><\/div>`\n\n> ❌ DON'T — 라벨을 .action-group 안에 넣기\n> 라벨은 bordered box 밖에 위치해야 한다. `.action-group` 첫 자식으로 넣으면 라벨에 테두리가 씌워진다.\n\n> ❌ DON'T — action-btn에 button 태그 대신 div·span 사용\n> `<div class=\"action-btn\">시간변경<\/div>` → `<button class=\"action-btn ...\">시간변경<\/button>`\n\n> ❌ DON'T — data-component 속성을 실제 코드에 포함\n> `data-component`는 디자인 시스템 문서 뷰어 전용. 실제 구현 코드에서는 제거한다.\n", "previewCSS": "/* ── Container ── */\n.action-group {\n  display: inline-flex;\n  border: var(--stroke-sm) var(--stroke-solid) var(--color-border-brand);\n  border-radius: var(--radius-xs);\n  /* overflow: hidden 사용 금지 — focus outline이 잘린다.\n     대신 첫·마지막 버튼에 border-radius를 직접 적용해 모서리를 처리한다. */\n}\n/* 활성 버튼이 하나도 없으면(단일 disabled 포함) 컨테이너 테두리도 disabled 색으로 자동 전환 */\n.action-group:not(:has(.action-btn:not(.action-btn--disabled))) {\n  border-color: var(--color-border-disabled);\n}\n\n/* ── Corner radius (overflow: hidden 대신) ── */\n/* 내부 radius = 컨테이너 radius - 테두리 두께(1px) */\n.action-group > .action-btn:first-child { border-radius: calc(var(--radius-xs) - var(--stroke-sm)) 0 0 calc(var(--radius-xs) - var(--stroke-sm)); }\n.action-group > .action-btn:last-child  { border-radius: 0 calc(var(--radius-xs) - var(--stroke-sm)) calc(var(--radius-xs) - var(--stroke-sm)) 0; }\n.action-group > .action-btn:only-child  { border-radius: calc(var(--radius-xs) - var(--stroke-sm)); }\n\n/* ── Item Base ── */\n.action-btn {\n  position: relative;\n  display: inline-flex; align-items: center; justify-content: center;\n  gap: var(--space-gap-xs);\n  background: var(--color-surface-base);\n  color: var(--color-text-brand);\n  border: none;\n  cursor: pointer;\n  white-space: nowrap;\n  transition: background var(--duration-fast) var(--easing-base);\n}\n/* 구분선을 ::before 가상 요소로 분리 — 버튼 상태(disabled 등)가 구분선 색에 영향을 주지 않는다 */\n.action-btn + .action-btn::before {\n  content: '';\n  position: absolute;\n  left: 0; top: 0; bottom: 0;\n  width: var(--stroke-sm);\n  background: var(--color-border-brand);\n}\n.action-btn:hover { background: var(--color-action-brand-hover); }\n\n/* ── Size ── */\n.action-btn--sm { height: var(--height-compact);  padding: var(--space-inset-squish-sm); }\n.action-btn--md { height: var(--height-base);     padding: var(--space-inset-squish-sm); }\n\n/* ── State ── */\n.action-btn--disabled { pointer-events: none; color: var(--color-text-disabled); background: var(--color-surface-disabled); }\n\n/* ── Icon (.icon 컴포넌트 사용) ── */\n.action-btn--icon-only { padding: 0; }\n.action-btn--icon-only.action-btn--sm { width: var(--height-compact); }\n.action-btn--icon-only.action-btn--md { width: var(--height-base); }\n\n/* icon-left/right: 아이콘 span은 항상 DOM 첫 번째에 둔다.\n   icon-right만 row-reverse로 시각 순서를 역전시킨다. icon-left는 기본 row라 선언 불필요. */\n.action-btn--icon-right { flex-direction: row-reverse; }\n\n/* ── Labeled wrapper ── */\n/* 라벨과 .action-group을 가로로 묶는 컨테이너. 라벨은 bordered box 밖에 위치한다. */\n.action-group-labeled {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--space-gap-xs);\n}\n/* 텍스트 스타일은 .text-form-label 유틸리티에서 가져온다. */\n.action-group-label { white-space: nowrap; color: var(--color-text-brand-muted); }\n"}, {"path": "components/atoms/icon.md", "label": "Icon", "group": "atoms", "slug": "components--atoms--icon", "raw": "---\nfile: components/atoms/icon.md\nversion: 1.1.0\nstatus: draft\ndepends-on: components/_index.md, accessibility.md, tokens/icon.md, tokens/color.md\n---\n\n# Icon\n\n## 개요\n\nSVG 아이콘 래퍼. 크기·색상은 `tokens/icon.md`에 정의된 유틸리티 클래스로 제어한다. 단색형(`fill=\"currentColor\"`)과 조합형(path별 시멘틱 토큰 직접 지정) 두 방식을 모두 수용한다.\n\n---\n\n## Variant\n\n| 차원 | 허용값 | 기본값 |\n|------|--------|--------|\n| size | badge · sm · md · lg · xl | md |\n| padding | off (기본, 클래스 없음) · on → `icon-on--{size}` | off |\n| color | brand · dark · white · disabled | — (currentColor 상속) |\n\n`icon-on--{size}`는 `icon--{size}`와 함께 사용하지 않는다. padding on 시 `icon-on--{size}` 단독으로 크기를 제어한다.\n\ncolor 차원은 단색형(`fill=\"currentColor\"`) 아이콘에만 적용한다. 조합형은 SVG path에 시멘틱 토큰을 직접 지정하므로 color 유틸리티 클래스를 사용하지 않는다.\n\n---\n\n## 사용 지침\n\n### 선택 기준\n\n| 상황 | 처리 방식 |\n|------|-----------|\n| 텍스트와 함께 — 아이콘이 보조 장식 | root에 `aria-hidden=\"true\"`. color는 부모에서 상속하거나 color 클래스 적용 |\n| 아이콘 단독 — 의미 전달 | root에 `role=\"img\"` + `aria-label` 필수. svg에도 `aria-hidden=\"true\"` |\n| 아이콘이 버튼 역할 — 클릭 가능 | `<button>`을 root로, `icon-on--{size}` 적용, `aria-label` 필수 |\n\n---\n\n## Anatomy\n\n<!-- AI: root(.icon + size class), svg(aria-hidden=\"true\" 항상).\n  - 장식(decoration): root에 aria-hidden=\"true\". color 클래스 또는 부모 color 상속.\n  - 단독(standalone): root에 role=\"img\" + aria-label. svg에도 aria-hidden=\"true\".\n  - 단독 버튼: button이 root, icon-on--{size} 적용, aria-label 필수. icon--{size}와 혼용 금지.\n  - 단색형/조합형 구분은 sprite.svg symbol 내부 path fill 방식으로 결정된다. 아이콘 목록은 아래 갤러리 참조. -->\n\n### 아이콘 목록\n\n아이콘 이름을 클릭하면 ID가 복사됩니다. size · color 필터를 조합해 실제 적용 모습을 확인할 수 있습니다. color 필터 전환 시 색이 바뀌면 단색형, 바뀌지 않으면 조합형입니다.\n\n<div class=\"icon-gallery-placeholder\"><\/div>\n\n---\n\n## CSS\n\n```css\n/* ── Base ── */\n.icon {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  color: currentColor;\n  flex-shrink: 0;\n}\n.icon svg { width: 100%; height: 100%; shape-rendering: geometricPrecision; }\n\n/* ── Size ── */\n.icon--badge { width: var(--icon-badge); height: var(--icon-badge); }\n.icon--sm    { width: var(--icon-sm);    height: var(--icon-sm); }\n.icon--md    { width: var(--icon-md);    height: var(--icon-md); }\n.icon--lg    { width: var(--icon-lg);    height: var(--icon-lg); }\n.icon--xl    { width: var(--icon-xl);    height: var(--icon-xl); }\n\n/* ── Color (단색형 전용) ── */\n.icon--brand    { color: var(--color-text-brand-vivid); }\n.icon--dark     { color: var(--color-text-body); }\n.icon--white    { color: var(--color-text-inverse); }\n.icon--disabled { color: var(--color-text-disabled); }\n```\n\n---\n\n## 접근성\n\n비인터랙티브 SVG 유형 (`accessibility.md` 아이콘 행 적용).\n\n| 상황 | 마크업 |\n|------|--------|\n| 장식 (텍스트와 함께) | root에 `aria-hidden=\"true\"` |\n| 단독 의미 전달 | root에 `role=\"img\"` + `aria-label=\"액션명\"`, svg에 `aria-hidden=\"true\"` |\n| 단독 버튼 | `<button aria-label=\"액션명\">` root, 내부 svg에 `aria-hidden=\"true\"` |\n\n색상 대비: lg(24px) 이상은 3:1 이상, sm(16px) 이하는 텍스트 기준(4.5:1) 권장.\n\n---\n\n## Do / Don't\n\n> ✅ DO — 장식 아이콘에 `aria-hidden=\"true\"` 적용\n> `<span class=\"icon icon--md icon--brand\" aria-hidden=\"true\"><svg>...<\/svg><\/span>`\n\n> ✅ DO — 단독 의미 전달 시 `role=\"img\"` + `aria-label` 부여\n> `<span class=\"icon icon--md\" role=\"img\" aria-label=\"설정\"><svg aria-hidden=\"true\">...<\/svg><\/span>`\n\n> ✅ DO — 단독 버튼은 `<button>`을 root로\n> `<button class=\"icon-on--md icon--brand\" aria-label=\"삭제\"><svg aria-hidden=\"true\">...<\/svg><\/button>`\n\n> ❌ DON'T — `icon-on--{size}`와 `icon--{size}` 함께 사용\n> `<div class=\"icon-on--md icon--md\">` — `icon-on--{size}` 단독으로 크기를 제어한다\n\n> ❌ DON'T — SVG에 직접 크기 속성 지정\n> `<svg width=\"20\" height=\"20\">` → `.icon--md` 클래스로 제어\n\n> ❌ DON'T — 아이콘 색상에 Primitive 토큰 직접 참조\n> `color: var(--color-blue-500)` → 단색형은 `.icon--brand` 등 color 유틸리티 클래스 사용\n\n> ❌ DON'T — data-component 속성을 실제 코드에 포함\n> `data-component`는 디자인 시스템 문서 뷰어 전용. 실제 구현 코드에서는 제거한다.\n", "previewCSS": "/* ── Base ── */\n.icon {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  color: currentColor;\n  flex-shrink: 0;\n}\n.icon svg { width: 100%; height: 100%; shape-rendering: geometricPrecision; }\n\n/* ── Size ── */\n.icon--badge { width: var(--icon-badge); height: var(--icon-badge); }\n.icon--sm    { width: var(--icon-sm);    height: var(--icon-sm); }\n.icon--md    { width: var(--icon-md);    height: var(--icon-md); }\n.icon--lg    { width: var(--icon-lg);    height: var(--icon-lg); }\n.icon--xl    { width: var(--icon-xl);    height: var(--icon-xl); }\n\n/* ── Color (단색형 전용) ── */\n.icon--brand    { color: var(--color-text-brand-vivid); }\n.icon--dark     { color: var(--color-text-body); }\n.icon--white    { color: var(--color-text-inverse); }\n.icon--disabled { color: var(--color-text-disabled); }\n"}, {"path": "components/atoms/input.md", "label": "Input", "group": "atoms", "slug": "components--atoms--input", "raw": "---\nfile: components/atoms/input.md\nversion: 1.0.0\nstatus: draft\ndepends-on: components/_index.md, accessibility.md, tokens/color.md, tokens/space.md, tokens/stroke.md, tokens/radius.md, tokens/typography.md\n---\n\n# Input\n\n## 개요\n\n단일 줄 텍스트 입력 필드. Label·HelpText와 함께 쓰일 때는 FormField(Molecule)를 사용한다. Input은 입력 영역 단독 컴포넌트다.\n\n---\n\n## Anatomy\n\n<!-- AI: root(.input), 선택적으로 앞뒤에 아이콘 래퍼(.input--icon-left, .input--icon-right) 추가 가능 -->\n\n```html\n<!-- 기본 -->\n<input class=\"input input--md\" type=\"text\" placeholder=\"입력하세요\" />\n\n<!-- 에러 -->\n<input class=\"input input--md input--error\" type=\"text\" aria-invalid=\"true\" aria-describedby=\"field-error\" />\n\n<!-- disabled -->\n<input class=\"input input--md input--disabled\" type=\"text\" disabled aria-disabled=\"true\" tabindex=\"-1\" />\n\n<!-- 아이콘 포함 (래퍼 필요) -->\n<div class=\"input-wrapper input-wrapper--icon-left\">\n  <span class=\"input-icon\" aria-hidden=\"true\"><!-- icon --><\/span>\n  <input class=\"input input--md\" type=\"text\" />\n<\/div>\n```\n\n<div class=\"component-preview-placeholder\" data-content=\"%3Cstyle%3E%0A%20%20.input%20%7B%0A%20%20%20%20display%3A%20block%3B%20width%3A%20100%25%3B%0A%20%20%20%20border%3A%20var%28--stroke-sm%29%20var%28--stroke-solid%29%20var%28--color-border-default%29%3B%0A%20%20%20%20border-radius%3A%20var%28--radius-md%29%3B%0A%20%20%20%20background%3A%20var%28--color-surface-base%29%3B%0A%20%20%20%20color%3A%20var%28--color-text-body%29%3B%0A%20%20%20%20font-family%3A%20var%28--font-family-base%29%3B%0A%20%20%20%20outline%3A%20none%3B%0A%20%20%7D%0A%20%20.input--sm%20%7B%20height%3A%20var%28--height-compact%29%3B%20padding%3A%20var%28--space-inset-squish-sm%29%3B%20font-size%3A%20var%28--font-size-sm%29%3B%20%7D%0A%20%20.input--md%20%7B%20height%3A%20var%28--height-base%29%3B%20padding%3A%20var%28--space-inset-squish-md%29%3B%20font-size%3A%20var%28--font-size-base%29%3B%20%7D%0A%20%20.input%3Ahover%20%7B%20border-color%3A%20var%28--color-border-selected%29%3B%20%7D%0A%20%20.input%3Afocus-visible%20%7B%20border-color%3A%20var%28--color-border-brand%29%3B%20outline%3A%20var%28--stroke-md%29%20solid%20var%28--color-border-focus%29%3B%20outline-offset%3A%202px%3B%20%7D%0A%20%20.input%3A%3Aplaceholder%20%7B%20color%3A%20var%28--color-text-subtle%29%3B%20%7D%0A%20%20.input--error%20%7B%20border-color%3A%20var%28--color-border-error%29%3B%20%7D%0A%20%20.input--error%3Afocus-visible%20%7B%20outline-color%3A%20var%28--color-border-focus%29%3B%20%7D%0A%20%20.input--disabled%20%7B%20background%3A%20var%28--color-surface-disabled%29%3B%20color%3A%20var%28--color-text-disabled%29%3B%20border-color%3A%20var%28--color-border-disabled%29%3B%20pointer-events%3A%20none%3B%20%7D%0A%3C%2Fstyle%3E%0A%3Cdiv%20style%3D%22display%3Aflex%3B%20flex-direction%3Acolumn%3B%20gap%3A8px%3B%20max-width%3A320px%3B%22%3E%0A%20%20%3Cinput%20class%3D%22input%20input--md%22%20type%3D%22text%22%20placeholder%3D%22%EA%B8%B0%EB%B3%B8%22%20%2F%3E%0A%20%20%3Cinput%20class%3D%22input%20input--md%20input--error%22%20type%3D%22text%22%20value%3D%22%EC%98%A4%EB%A5%98%20%EC%83%81%ED%83%9C%22%20aria-invalid%3D%22true%22%20%2F%3E%0A%20%20%3Cinput%20class%3D%22input%20input--md%20input--disabled%22%20type%3D%22text%22%20placeholder%3D%22%EB%B9%84%ED%99%9C%EC%84%B1%22%20disabled%20%2F%3E%0A%3C%2Fdiv%3E\"><\/div>\n\n---\n\n## Variant\n\n| 차원 | 허용값 | 기본값 |\n|------|--------|--------|\n| size | sm · md | md |\n\n---\n\n## 접근성\n\n텍스트 인풋 유형 (`design-system/accessibility.md` 텍스트 인풋 행 적용).\n\n키보드 접근·focus·disabled·색상 대비·에러 메시지 해당.\n\n에러 상태: `aria-invalid=\"true\"` + `aria-describedby`로 에러 메시지 연결.\n\n---\n\n## Do / Don't\n\n> ✅ DO — FormField와 함께 Label을 항상 연결\n> `<label for=\"name\">이름<\/label><input id=\"name\" class=\"input input--md\" />`\n\n> ❌ DON'T — placeholder를 label 대용으로 사용\n> 입력 시 placeholder가 사라지면 레이블 역할 불가\n\n> ✅ DO — 에러 시 `aria-invalid` + `aria-describedby` 함께 적용\n> `<input aria-invalid=\"true\" aria-describedby=\"name-error\" />`\n\n> ❌ DON'T — padding으로 높이 조절\n> height 토큰으로 높이를 고정한다\n", "previewCSS": ""}, {"path": "components/atoms/textarea.md", "label": "Textarea", "group": "atoms", "slug": "components--atoms--textarea", "raw": "---\nfile: components/atoms/textarea.md\nversion: 1.0.0\nstatus: draft\ndepends-on: components/_index.md, accessibility.md, tokens/color.md, tokens/space.md, tokens/stroke.md, tokens/radius.md, tokens/typography.md\n---\n\n# Textarea\n\n## 개요\n\n여러 줄 텍스트 입력 필드. Input과의 차이 — 줄바꿈이 필요한 긴 텍스트 입력에 사용한다. 높이는 고정하지 않고 콘텐츠에 따라 조정할 수 있다.\n\n---\n\n## Anatomy\n\n<!-- AI: root(.textarea). height 토큰을 사용하지 않고 rows 속성 또는 min-height로 최소 높이를 지정한다. -->\n\n```html\n<!-- 기본 -->\n<textarea class=\"textarea textarea--md\" rows=\"4\" placeholder=\"내용을 입력하세요\"><\/textarea>\n\n<!-- 에러 -->\n<textarea class=\"textarea textarea--md textarea--error\" rows=\"4\" aria-invalid=\"true\" aria-describedby=\"field-error\"><\/textarea>\n\n<!-- disabled -->\n<textarea class=\"textarea textarea--md textarea--disabled\" rows=\"4\" disabled aria-disabled=\"true\" tabindex=\"-1\"><\/textarea>\n```\n\n<div class=\"component-preview-placeholder\" data-content=\"%3Cstyle%3E%0A%20%20.textarea%20%7B%0A%20%20%20%20display%3A%20block%3B%20width%3A%20100%25%3B%0A%20%20%20%20border%3A%20var%28--stroke-sm%29%20var%28--stroke-solid%29%20var%28--color-border-default%29%3B%0A%20%20%20%20border-radius%3A%20var%28--radius-md%29%3B%0A%20%20%20%20background%3A%20var%28--color-surface-base%29%3B%0A%20%20%20%20color%3A%20var%28--color-text-body%29%3B%0A%20%20%20%20font-family%3A%20var%28--font-family-base%29%3B%0A%20%20%20%20resize%3A%20vertical%3B%0A%20%20%20%20outline%3A%20none%3B%0A%20%20%7D%0A%20%20.textarea--sm%20%7B%20padding%3A%20var%28--space-inset-sm%29%3B%20font-size%3A%20var%28--font-size-sm%29%3B%20%7D%0A%20%20.textarea--md%20%7B%20padding%3A%20var%28--space-inset-md%29%3B%20font-size%3A%20var%28--font-size-base%29%3B%20%7D%0A%20%20.textarea%3Ahover%20%7B%20border-color%3A%20var%28--color-border-selected%29%3B%20%7D%0A%20%20.textarea%3Afocus-visible%20%7B%20border-color%3A%20var%28--color-border-brand%29%3B%20outline%3A%20var%28--stroke-md%29%20solid%20var%28--color-border-focus%29%3B%20outline-offset%3A%202px%3B%20%7D%0A%20%20.textarea%3A%3Aplaceholder%20%7B%20color%3A%20var%28--color-text-subtle%29%3B%20%7D%0A%20%20.textarea--error%20%7B%20border-color%3A%20var%28--color-border-error%29%3B%20%7D%0A%20%20.textarea--disabled%20%7B%20background%3A%20var%28--color-surface-disabled%29%3B%20color%3A%20var%28--color-text-disabled%29%3B%20border-color%3A%20var%28--color-border-disabled%29%3B%20pointer-events%3A%20none%3B%20%7D%0A%3C%2Fstyle%3E%0A%3Cdiv%20style%3D%22display%3Aflex%3B%20flex-direction%3Acolumn%3B%20gap%3A8px%3B%20max-width%3A320px%3B%22%3E%0A%20%20%3Ctextarea%20class%3D%22textarea%20textarea--md%22%20rows%3D%223%22%20placeholder%3D%22%EA%B8%B0%EB%B3%B8%22%3E%3C%2Ftextarea%3E%0A%20%20%3Ctextarea%20class%3D%22textarea%20textarea--md%20textarea--error%22%20rows%3D%223%22%20aria-invalid%3D%22true%22%3E%EC%98%A4%EB%A5%98%20%EC%83%81%ED%83%9C%3C%2Ftextarea%3E%0A%20%20%3Ctextarea%20class%3D%22textarea%20textarea--md%20textarea--disabled%22%20rows%3D%223%22%20disabled%3E%EB%B9%84%ED%99%9C%EC%84%B1%3C%2Ftextarea%3E%0A%3C%2Fdiv%3E\"><\/div>\n\n---\n\n## Variant\n\n| 차원 | 허용값 | 기본값 |\n|------|--------|--------|\n| size | sm · md | md |\n\n---\n\n## 접근성\n\n텍스트 인풋 유형 (`design-system/accessibility.md` 텍스트 인풋 행 적용).\n\n키보드 접근·focus·disabled·색상 대비·에러 메시지 해당.\n\n에러 상태: `aria-invalid=\"true\"` + `aria-describedby`로 에러 메시지 연결.\n\n---\n\n## Do / Don't\n\n> ✅ DO — 최소 높이를 `rows` 속성으로 지정\n> `<textarea rows=\"4\">` — 내용이 늘어나면 자동 확장\n\n> ❌ DON'T — height 토큰으로 높이 고정\n> Textarea는 멀티라인이므로 height 고정 금지\n\n> ✅ DO — resize: vertical 허용 (기본값)\n> 수평 resize만 금지: `resize: horizontal` → 레이아웃 깨짐\n", "previewCSS": ""}, {"path": "components/atoms/checkbox.md", "label": "Checkbox", "group": "atoms", "slug": "components--atoms--checkbox", "raw": "---\nfile: components/atoms/checkbox.md\nversion: 1.0.0\nstatus: draft\ndepends-on: components/_index.md, accessibility.md, tokens/color.md, tokens/space.md, tokens/stroke.md, tokens/typography.md\n---\n\n# Checkbox\n\n## 개요\n\n단일 또는 복수 항목 선택. 그룹으로 사용할 때는 `<fieldset>` + `<legend>`로 묶는다. Radio와의 차이 — 여러 항목을 동시에 선택할 수 있다.\n\n---\n\n## Anatomy\n\n<!-- AI: root(.checkbox), input(네이티브 <input type=\"checkbox\">), label(.checkbox__label) -->\n\n```html\n<!-- 단일 -->\n<label class=\"checkbox checkbox--md\">\n  <input type=\"checkbox\" />\n  <span class=\"checkbox__label\">항목 이름<\/span>\n<\/label>\n\n<!-- 그룹 -->\n<fieldset>\n  <legend>카테고리 선택<\/legend>\n  <label class=\"checkbox checkbox--md\">\n    <input type=\"checkbox\" />\n    <span class=\"checkbox__label\">옵션 A<\/span>\n  <\/label>\n  <label class=\"checkbox checkbox--md\">\n    <input type=\"checkbox\" />\n    <span class=\"checkbox__label\">옵션 B<\/span>\n  <\/label>\n<\/fieldset>\n\n<!-- 에러 -->\n<label class=\"checkbox checkbox--md checkbox--error\">\n  <input type=\"checkbox\" aria-invalid=\"true\" aria-describedby=\"field-error\" />\n  <span class=\"checkbox__label\">항목 이름<\/span>\n<\/label>\n\n<!-- disabled -->\n<label class=\"checkbox checkbox--md checkbox--disabled\">\n  <input type=\"checkbox\" disabled aria-disabled=\"true\" tabindex=\"-1\" />\n  <span class=\"checkbox__label\">항목 이름<\/span>\n<\/label>\n```\n\n<div class=\"component-preview-placeholder\" data-content=\"%3Cstyle%3E%0A%20%20.checkbox%20%7B%20display%3A%20inline-flex%3B%20align-items%3A%20center%3B%20gap%3A%20var%28--space-gap-xs%29%3B%20cursor%3A%20pointer%3B%20%7D%0A%20%20.checkbox--md%20input%20%7B%20width%3A%2016px%3B%20height%3A%2016px%3B%20accent-color%3A%20var%28--color-button-brand%29%3B%20cursor%3A%20pointer%3B%20%7D%0A%20%20.checkbox--md%20.checkbox__label%20%7B%20font-family%3A%20var%28--font-family-base%29%3B%20font-size%3A%20var%28--font-size-base%29%3B%20color%3A%20var%28--color-text-body%29%3B%20%7D%0A%20%20.checkbox--md%20input%3Afocus-visible%20%7B%20outline%3A%20var%28--stroke-md%29%20solid%20var%28--color-border-focus%29%3B%20outline-offset%3A%202px%3B%20%7D%0A%20%20.checkbox--error%20input%20%7B%20accent-color%3A%20var%28--color-button-error%29%3B%20%7D%0A%20%20.checkbox--error%20.checkbox__label%20%7B%20color%3A%20var%28--color-text-error%29%3B%20%7D%0A%20%20.checkbox--disabled%20%7B%20pointer-events%3A%20none%3B%20%7D%0A%20%20.checkbox--disabled%20.checkbox__label%20%7B%20color%3A%20var%28--color-text-disabled%29%3B%20%7D%0A%3C%2Fstyle%3E%0A%3Cdiv%20style%3D%22display%3Aflex%3B%20flex-direction%3Acolumn%3B%20gap%3A8px%3B%22%3E%0A%20%20%3Clabel%20class%3D%22checkbox%20checkbox--md%22%3E%3Cinput%20type%3D%22checkbox%22%20%2F%3E%3Cspan%20class%3D%22checkbox__label%22%3E%EA%B8%B0%EB%B3%B8%3C%2Fspan%3E%3C%2Flabel%3E%0A%20%20%3Clabel%20class%3D%22checkbox%20checkbox--md%22%3E%3Cinput%20type%3D%22checkbox%22%20checked%20%2F%3E%3Cspan%20class%3D%22checkbox__label%22%3E%EC%84%A0%ED%83%9D%EB%90%A8%3C%2Fspan%3E%3C%2Flabel%3E%0A%20%20%3Clabel%20class%3D%22checkbox%20checkbox--md%20checkbox--error%22%3E%3Cinput%20type%3D%22checkbox%22%20%2F%3E%3Cspan%20class%3D%22checkbox__label%22%3E%EC%97%90%EB%9F%AC%3C%2Fspan%3E%3C%2Flabel%3E%0A%20%20%3Clabel%20class%3D%22checkbox%20checkbox--md%20checkbox--disabled%22%3E%3Cinput%20type%3D%22checkbox%22%20disabled%20%2F%3E%3Cspan%20class%3D%22checkbox__label%22%3E%EB%B9%84%ED%99%9C%EC%84%B1%3C%2Fspan%3E%3C%2Flabel%3E%0A%3C%2Fdiv%3E\"><\/div>\n\n---\n\n## Variant\n\n| 차원 | 허용값 | 기본값 |\n|------|--------|--------|\n| size | sm · md | md |\n\n---\n\n## 접근성\n\n체크박스·라디오 그룹 유형 (`design-system/accessibility.md` 체크박스·라디오 그룹 행 적용).\n\n키보드 접근·focus·disabled·색상 대비·에러 메시지 해당.\n\n그룹 사용 시 `<fieldset>` + `<legend>` 필수.\n\n---\n\n## Do / Don't\n\n> ✅ DO — 그룹에 `<fieldset>` + `<legend>` 사용\n> 스크린리더가 그룹 맥락을 각 항목 읽기 전에 함께 읽는다\n\n> ❌ DON'T — CSS로만 체크 표시 구현 후 네이티브 input 숨김\n> 스크린리더·키보드 접근 불가. 네이티브 `<input type=\"checkbox\">` 유지 필수\n\n> ✅ DO — indeterminate 상태는 JS로 `input.indeterminate = true` 설정\n", "previewCSS": ""}, {"path": "components/atoms/radio.md", "label": "Radio", "group": "atoms", "slug": "components--atoms--radio", "raw": "---\nfile: components/atoms/radio.md\nversion: 1.0.0\nstatus: draft\ndepends-on: components/_index.md, accessibility.md, tokens/color.md, tokens/space.md, tokens/stroke.md, tokens/typography.md\n---\n\n# Radio\n\n## 개요\n\n그룹 내 단일 항목 선택. 반드시 2개 이상의 항목을 `<fieldset>` + `<legend>`로 묶어 그룹으로 제공한다. Checkbox와의 차이 — 하나만 선택 가능하며 단독으로 사용하지 않는다.\n\n---\n\n## Anatomy\n\n<!-- AI: root(.radio), input(네이티브 <input type=\"radio\">), label(.radio__label). 항상 name 속성으로 같은 그룹임을 명시한다. -->\n\n```html\n<fieldset>\n  <legend>결제 수단<\/legend>\n  <label class=\"radio radio--md\">\n    <input type=\"radio\" name=\"payment\" value=\"card\" />\n    <span class=\"radio__label\">신용카드<\/span>\n  <\/label>\n  <label class=\"radio radio--md\">\n    <input type=\"radio\" name=\"payment\" value=\"transfer\" />\n    <span class=\"radio__label\">계좌이체<\/span>\n  <\/label>\n<\/fieldset>\n\n<!-- 에러 -->\n<label class=\"radio radio--md radio--error\">\n  <input type=\"radio\" name=\"payment\" aria-invalid=\"true\" aria-describedby=\"field-error\" />\n  <span class=\"radio__label\">신용카드<\/span>\n<\/label>\n\n<!-- disabled -->\n<label class=\"radio radio--md radio--disabled\">\n  <input type=\"radio\" name=\"payment\" disabled aria-disabled=\"true\" tabindex=\"-1\" />\n  <span class=\"radio__label\">신용카드<\/span>\n<\/label>\n```\n\n<div class=\"component-preview-placeholder\" data-content=\"%3Cstyle%3E%0A%20%20.radio%20%7B%20display%3A%20inline-flex%3B%20align-items%3A%20center%3B%20gap%3A%20var%28--space-gap-xs%29%3B%20cursor%3A%20pointer%3B%20%7D%0A%20%20.radio--md%20input%20%7B%20width%3A%2016px%3B%20height%3A%2016px%3B%20accent-color%3A%20var%28--color-button-brand%29%3B%20cursor%3A%20pointer%3B%20%7D%0A%20%20.radio--md%20.radio__label%20%7B%20font-family%3A%20var%28--font-family-base%29%3B%20font-size%3A%20var%28--font-size-base%29%3B%20color%3A%20var%28--color-text-body%29%3B%20%7D%0A%20%20.radio--md%20input%3Afocus-visible%20%7B%20outline%3A%20var%28--stroke-md%29%20solid%20var%28--color-border-focus%29%3B%20outline-offset%3A%202px%3B%20%7D%0A%20%20.radio--error%20input%20%7B%20accent-color%3A%20var%28--color-button-error%29%3B%20%7D%0A%20%20.radio--error%20.radio__label%20%7B%20color%3A%20var%28--color-text-error%29%3B%20%7D%0A%20%20.radio--disabled%20%7B%20pointer-events%3A%20none%3B%20%7D%0A%20%20.radio--disabled%20.radio__label%20%7B%20color%3A%20var%28--color-text-disabled%29%3B%20%7D%0A%3C%2Fstyle%3E%0A%3Cfieldset%20style%3D%22border%3Anone%3B%20padding%3A0%3B%20display%3Aflex%3B%20flex-direction%3Acolumn%3B%20gap%3A8px%3B%22%3E%0A%20%20%3Clegend%20style%3D%22font-family%3Avar%28--font-family-base%29%3B%20font-size%3Avar%28--font-size-sm%29%3B%20color%3Avar%28--color-text-subtle%29%3B%20margin-bottom%3A4px%3B%22%3E%EA%B2%B0%EC%A0%9C%20%EC%88%98%EB%8B%A8%3C%2Flegend%3E%0A%20%20%3Clabel%20class%3D%22radio%20radio--md%22%3E%3Cinput%20type%3D%22radio%22%20name%3D%22ex%22%20value%3D%22a%22%20%2F%3E%3Cspan%20class%3D%22radio__label%22%3E%EC%8B%A0%EC%9A%A9%EC%B9%B4%EB%93%9C%3C%2Fspan%3E%3C%2Flabel%3E%0A%20%20%3Clabel%20class%3D%22radio%20radio--md%22%3E%3Cinput%20type%3D%22radio%22%20name%3D%22ex%22%20value%3D%22b%22%20checked%20%2F%3E%3Cspan%20class%3D%22radio__label%22%3E%EA%B3%84%EC%A2%8C%EC%9D%B4%EC%B2%B4%20%28%EC%84%A0%ED%83%9D%EB%90%A8%29%3C%2Fspan%3E%3C%2Flabel%3E%0A%20%20%3Clabel%20class%3D%22radio%20radio--md%20radio--disabled%22%3E%3Cinput%20type%3D%22radio%22%20name%3D%22ex%22%20value%3D%22c%22%20disabled%20%2F%3E%3Cspan%20class%3D%22radio__label%22%3E%EB%B9%84%ED%99%9C%EC%84%B1%3C%2Fspan%3E%3C%2Flabel%3E%0A%3C%2Ffieldset%3E\"><\/div>\n\n---\n\n## Variant\n\n| 차원 | 허용값 | 기본값 |\n|------|--------|--------|\n| size | sm · md | md |\n\n---\n\n## 접근성\n\n체크박스·라디오 그룹 유형 (`design-system/accessibility.md` 체크박스·라디오 그룹 행 적용).\n\n키보드 접근·focus·disabled·색상 대비·에러 메시지 해당.\n\n`<fieldset>` + `<legend>` + 동일 `name` 속성 필수. 키보드 `↑↓` 또는 `←→`로 그룹 내 이동.\n\n---\n\n## Do / Don't\n\n> ✅ DO — 같은 그룹은 동일한 `name` 속성 사용\n> `<input type=\"radio\" name=\"payment\" value=\"card\">`\n\n> ❌ DON'T — Radio를 단독으로 사용\n> 단일 on/off에는 Checkbox 또는 Toggle 사용\n\n> ❌ DON'T — `<fieldset>` 없이 그룹 제공\n> 스크린리더가 그룹 맥락 없이 각 항목만 읽는다\n", "previewCSS": ""}, {"path": "components/atoms/toggle.md", "label": "Toggle", "group": "atoms", "slug": "components--atoms--toggle", "raw": "---\nfile: components/atoms/toggle.md\nversion: 1.0.0\nstatus: draft\ndepends-on: components/_index.md, accessibility.md, tokens/color.md, tokens/space.md, tokens/stroke.md, tokens/typography.md, tokens/radius.md, tokens/motion.md\n---\n\n# Toggle\n\n## 개요\n\n즉시 적용되는 이진 설정(on/off)을 전환한다. Checkbox와의 차이 — 저장 액션 없이 변경이 즉시 반영될 때 사용한다. 폼 제출이 필요한 경우 Checkbox를 사용한다.\n\n---\n\n## Anatomy\n\n<!-- AI: root(.toggle), input(네이티브 <input type=\"checkbox\">로 상태 관리), track(.toggle__track), thumb(.toggle__thumb), label(.toggle__label, optional) -->\n\n```html\n<!-- 기본 (레이블 없음) -->\n<label class=\"toggle toggle--md\" aria-label=\"알림 활성화\">\n  <input type=\"checkbox\" role=\"switch\" />\n  <span class=\"toggle__track\">\n    <span class=\"toggle__thumb\"><\/span>\n  <\/span>\n<\/label>\n\n<!-- 레이블 포함 -->\n<label class=\"toggle toggle--md\">\n  <input type=\"checkbox\" role=\"switch\" />\n  <span class=\"toggle__track\">\n    <span class=\"toggle__thumb\"><\/span>\n  <\/span>\n  <span class=\"toggle__label\">이메일 알림<\/span>\n<\/label>\n\n<!-- disabled -->\n<label class=\"toggle toggle--md toggle--disabled\">\n  <input type=\"checkbox\" role=\"switch\" disabled aria-disabled=\"true\" tabindex=\"-1\" />\n  <span class=\"toggle__track\">\n    <span class=\"toggle__thumb\"><\/span>\n  <\/span>\n  <span class=\"toggle__label\">이메일 알림<\/span>\n<\/label>\n```\n\n<div class=\"component-preview-placeholder\" data-content=\"%3Cstyle%3E%0A%20%20.toggle%20%7B%20display%3A%20inline-flex%3B%20align-items%3A%20center%3B%20gap%3A%20var%28--space-gap-sm%29%3B%20cursor%3A%20pointer%3B%20%7D%0A%20%20.toggle%20input%20%7B%20position%3A%20absolute%3B%20opacity%3A%200%3B%20width%3A%200%3B%20height%3A%200%3B%20% 3D%22checkbox%22%20role%3D%22switch%22%20checked%20%2F%3E%0A%20%20%20%20%3Cspan%20class%3D%22toggle__track%22%3E%3Cspan%20class%3D%22toggle__thumb%22%3E%3C%2Fspan%3E%3C%2Fspan%3E%0A%20%20%20%20%3Cspan%20class%3D%22toggle__label%22%3E%EC%BC%9C%EC%A7%90%3C%2Fspan%3E%0A%20%20%3C%2Flabel%3E%0A%20%20%3Clabel%20class%3D%22toggle%20toggle--md%20toggle--disabled%22%3E%0A%20%20%20%20%3Cinput%20type%3D%22checkbox%22%20role%3D%22switch%22%20disabled%20%2F%3E%0A%20%20%20%20%3Cspan%20class%3D%22toggle__track%22%3E%3Cspan%20class%3D%22toggle__thumb%22%3E%3C%2Fspan%3E%3C%2Fspan%3E%0A%20%20%20%20%3Cspan%20class%3D%22toggle__label%22%3E%EB%B9%84%ED%99%9C%EC%84%B1%3C%2Fspan%3E%0A%20%20%3C%2Flabel%3E%0A%3C%2Fdiv%3E\"><\/div>\n\n---\n\n## Variant\n\n| 차원 | 허용값 | 기본값 |\n|------|--------|--------|\n| size | sm · md | md |\n\n---\n\n## 접근성\n\n토글·스위치 유형 (`design-system/accessibility.md` 토글·스위치 행 적용).\n\n키보드 접근·focus·disabled 해당.\n\n`role=\"switch\"` + `aria-checked`는 네이티브 `<input type=\"checkbox\">`가 자동 처리. 레이블 없는 경우 `aria-label` 필수.\n\n---\n\n## Do / Don't\n\n> ✅ DO — 즉시 반영되는 설정에만 사용\n> 알림 on/off, 테마 전환 등 저장 없이 즉시 적용되는 경우\n\n> ❌ DON'T — 폼 내 선택지에 Toggle 사용\n> 저장 버튼이 있는 폼에서는 Checkbox 사용\n\n> ✅ DO — 레이블 없는 Toggle에 `aria-label` 제공\n> `<label class=\"toggle\" aria-label=\"다크모드 활성화\">`\n", "previewCSS": ""}, {"path": "components/atoms/badge.md", "label": "Badge", "group": "atoms", "slug": "components--atoms--badge", "raw": "---\nfile: components/atoms/badge.md\nversion: 1.0.0\nstatus: draft\ndepends-on: components/_index.md, accessibility.md, tokens/color.md, tokens/space.md, tokens/typography.md, tokens/radius.md\n---\n\n# Badge\n\n## 개요\n\n상태·분류·수량을 나타내는 인라인 레이블. 비인터랙티브 컴포넌트이며 클릭 가능한 분류 필터에는 Tag를 사용한다.\n\n---\n\n## Anatomy\n\n<!-- AI: root(.badge). 텍스트만 포함하거나 앞에 dot indicator를 추가할 수 있다. -->\n\n```html\n<!-- 기본 -->\n<span class=\"badge badge--neutral badge--md\">진행 중<\/span>\n\n<!-- dot indicator 포함 -->\n<span class=\"badge badge--success badge--md\">\n  <span class=\"badge__dot\" aria-hidden=\"true\"><\/span>\n  완료\n<\/span>\n```\n\n<div class=\"component-preview-placeholder\" data-content=\"%3Cstyle%3E%0A%20%20.badge%20%7B%0A%20%20%20%20display%3A%20inline-flex%3B%20align-items%3A%20center%3B%20gap%3A%20var%28--space-gap-2xs%29%3B%0A%20%20%20%20border-radius%3A%20var%28--radius-pill%29%3B%0A%20%20%20%20font-family%3A%20var%28--font-family-base%29%3B%0A%20%20%20%20font-weight%3A%20var%28--font-weight-heading%29%3B%0A%20%20%20%20white-space%3A%20nowrap%3B%0A%20%20%7D%0A%20%20.badge--sm%20%7B%20height%3A%20var%28--height-tight%29%3B%20padding%3A%20var%28--space-inset-squish-xs%29%3B%20font-size%3A%20var%28--font-size-meta%29%3B%20%7D%0A%20%20.badge--md%20%7B%20height%3A%20var%28--height-dense%29%3B%20padding%3A%20var%28--space-inset-squish-sm%29%3B%20font-size%3A%20var%28--font-size-label%29%3B%20%7D%0A%20%20.badge__dot%20%7B%20width%3A%206px%3B%20height%3A%206px%3B%20border-radius%3A%2050%25%3B%20background%3A%20currentColor%3B%20flex-shrink%3A%200%3B%20%7D%0A%0A%20%20.badge--neutral%20%7B%20background%3A%20var%28--color-surface-neutral%29%3B%20color%3A%20var%28--color-text-label%29%3B%20%7D%0A%20%20.badge--brand%20%20%20%7B%20background%3A%20var%28--color-surface-brand-subtle%29%3B%20color%3A%20var%28--color-text-brand-vivid%29%3B%20%7D%0A%20%20.badge--info%20%20%20%20%7B%20background%3A%20var%28--color-surface-info-subtle%29%3B%20color%3A%20var%28--color-text-info%29%3B%20%7D%0A%20%20.badge--success%20%7B%20background%3A%20var%28--color-surface-success-subtle%29%3B%20color%3A%20var%28--color-text-success%2C%20var%28--color-text-brand%29%29%3B%20%7D%0A%20%20.badge--caution%20%7B%20background%3A%20var%28--color-surface-caution-subtle%29%3B%20color%3A%20var%28--color-text-caution%29%3B%20%7D%0A%20%20.badge--error%20%20%20%7B%20background%3A%20var%28--color-surface-error-subtle%29%3B%20color%3A%20var%28--color-text-error%29%3B%20%7D%0A%3C%2Fstyle%3E%0A%3Cdiv%20style%3D%22display%3Aflex%3B%20gap%3A8px%3B%20flex-wrap%3Awrap%3B%20align-items%3Acenter%3B%22%3E%0A%20%20%3Cspan%20class%3D%22badge%20badge--neutral%20badge--md%22%3E%EC%A4%91%EB%A6%BD%3C%2Fspan%3E%0A%20%20%3Cspan%20class%3D%22badge%20badge--brand%20badge--md%22%3E%EB%B8%8C%EB%9E%9C%EB%93%9C%3C%2Fspan%3E%0A%20%20%3Cspan%20class%3D%22badge%20badge--info%20badge--md%22%3E%EC%A0%95%EB%B3%B4%3C%2Fspan%3E%0A%20%20%3Cspan%20class%3D%22badge%20badge--success%20badge--md%22%3E%3Cspan%20class%3D%22badge__dot%22%20aria-hidden%3D%22true%22%3E%3C%2Fspan%3E%EC%84%B1%EA%B3%B5%3C%2Fspan%3E%0A%20%20%3Cspan%20class%3D%22badge%20badge--caution%20badge--md%22%3E%EC%A3%BC%EC%9D%98%3C%2Fspan%3E%0A%20%20%3Cspan%20class%3D%22badge%20badge--error%20badge--md%22%3E%EC%98%A4%EB%A5%98%3C%2Fspan%3E%0A%3C%2Fdiv%3E\"><\/div>\n\n---\n\n## Variant\n\n| 차원 | 허용값 | 기본값 |\n|------|--------|--------|\n| style | neutral · brand · info · success · caution · error | neutral |\n| size | sm · md | md |\n\n---\n\n## 접근성\n\n비인터랙티브 컴포넌트. 키보드 접근·focus·disabled 불해당.\n\n색상 대비 해당 — 배경과 텍스트 색상 4.5:1 이상 유지.\n\n색상만으로 의미를 전달하지 않는다. 텍스트 레이블이 항상 포함되어야 한다.\n\n---\n\n## Do / Don't\n\n> ✅ DO — 텍스트 레이블과 함께 사용\n> `<span class=\"badge badge--error badge--md\">오류<\/span>`\n\n> ❌ DON'T — 색상만으로 상태 전달\n> 빨간 dot만 표시하고 텍스트 없이 사용 금지\n\n> ❌ DON'T — 클릭 가능한 필터에 Badge 사용\n> 인터랙티브 용도에는 Tag 사용\n", "previewCSS": ""}, {"path": "components/atoms/tag.md", "label": "Tag", "group": "atoms", "slug": "components--atoms--tag", "raw": "---\nfile: components/atoms/tag.md\nversion: 1.0.0\nstatus: draft\ndepends-on: components/_index.md, accessibility.md, tokens/color.md, tokens/space.md, tokens/stroke.md, tokens/typography.md, tokens/radius.md, tokens/motion.md\n---\n\n# Tag\n\n## 개요\n\n분류·필터·속성을 표시하는 인라인 레이블. Badge와의 차이 — 선택/제거 인터랙션이 가능하다. 비인터랙티브 단순 레이블에는 Badge를 사용한다.\n\n---\n\n## Anatomy\n\n<!-- AI: root(.tag), label(.tag__label), remove button(.tag__remove, optional). 인터랙티브 여부에 따라 <span> 또는 <button> 사용. -->\n\n```html\n<!-- 읽기 전용 (비인터랙티브) -->\n<span class=\"tag tag--neutral\">디자인<\/span>\n\n<!-- 선택 가능 -->\n<button class=\"tag tag--neutral tag--selectable\">디자인<\/button>\n\n<!-- 선택됨 -->\n<button class=\"tag tag--brand tag--selected\" aria-pressed=\"true\">디자인<\/button>\n\n<!-- 제거 가능 -->\n<span class=\"tag tag--neutral tag--removable\">\n  <span class=\"tag__label\">디자인<\/span>\n  <button class=\"tag__remove\" aria-label=\"디자인 제거\">\n    <span aria-hidden=\"true\"><!-- icon close --><\/span>\n  <\/button>\n<\/span>\n```\n\n<div class=\"component-preview-placeholder\" data-content=\"%3Cstyle%3E%0A%20%20.tag%20%7B%0A%20%20%20%20display%3A%20inline-flex%3B%20align-items%3A%20center%3B%20gap%3A%20var%28--space-gap-xs%29%3B%0A%20%20%20%20height%3A%20var%28--height-dense%29%3B%0A%20%20%20%20padding%3A%20var%28--space-inset-squish-sm%29%3B%0A%20%20%20%20border-radius%3A%20var%28--radius-pill%29%3B%0A%20%20%20%20border%3A%20var%28--stroke-sm%29%20var%28--stroke-solid%29%20transparent%3B%0A%20%20%20%20font-family%3A%20var%28--font-family-base%29%3B%0A%20%20%20%20font-size%3A%20var%28--font-size-label%29%3B%0A%20%20%20%20white-space%3A%20nowrap%3B%0A%20%20%20%20cursor%3A%20default%3B%0A%20%20%7D%0A%20%20.tag--selectable%2C%20.tag__remove%20%7B%20cursor%3A%20pointer%3B%20%7D%0A%20%20.tag--neutral%20%7B%20background%3A%20var%28--color-surface-neutral%29%3B%20color%3A%20var%28--color-text-label%29%3B%20border-color%3A%20var%28--color-border-subtle%29%3B%20%7D%0A%20%20.tag--brand%2C%20.tag--selected%20%7B%20background%3A%20var%28--color-surface-brand-subtle%29%3B%20color%3A%20var%28--color-text-brand-vivid%29%3B%20border-color%3A%20var%28--color-border-brand%29%3B%20%7D%0A%20%20.tag--selectable%3Ahover%20%7B%20background%3A%20var%28--color-action-neutral-hover%29%3B%20%7D%0A%20%20.tag--selectable%3Afocus-visible%2C%20.tag__remove%3Afocus-visible%20%7B%20outline%3A%20var%28--stroke-md%29%20solid%20var%28--color-border-focus%29%3B%20outline-offset%3A%202px%3B%20%7D%0A%20%20.tag__remove%20%7B%20display%3A%20inline-flex%3B%20align-items%3A%20center%3B%20background%3A%20none%3B%20border%3A%20none%3B%20padding%3A%200%3B%20color%3A%20inherit%3B%20%7D%0A%3C%2Fstyle%3E%0A%3Cdiv%20style%3D%22display%3Aflex%3B%20gap%3A8px%3B%20flex-wrap%3Awrap%3B%20align-items%3Acenter%3B%22%3E%0A%20%20%3Cspan%20class%3D%22tag%20tag--neutral%22%3E%EC%9D%BD%EA%B8%B0%20%EC%A0%84%EC%9A%A9%3C%2Fspan%3E%0A%20%20%3Cbutton%20class%3D%22tag%20tag--neutral%20tag--selectable%22%3E%EC%84%A0%ED%83%9D%20%EA%B0%80%EB%8A%A5%3C%2Fbutton%3E%0A%20%20%3Cbutton%20class%3D%22tag%20tag--brand%20tag--selected%22%20aria-pressed%3D%22true%22%3E%EC%84%A0%ED%83%9D%EB%90%A8%3C%2Fbutton%3E%0A%20%20%3Cspan%20class%3D%22tag%20tag--neutral%20tag--removable%22%3E%0A%20%20%20%20%3Cspan%20class%3D%22tag__label%22%3E%EC%A0%9C%EA%B1%B0%20%EA%B0%80%EB%8A%A5%3C%2Fspan%3E%0A%20%20%20%20%3Cbutton%20class%3D%22tag__remove%22%20aria-label%3D%22%EC%A0%9C%EA%B1%B0%20%EA%B0%80%EB%8A%A5%20%EC%A0%9C%EA%B1%B0%22%3E%E2%9C%95%3C%2Fbutton%3E%0A%20%20%3C%2Fspan%3E%0A%3C%2Fdiv%3E\"><\/div>\n\n---\n\n## Variant\n\n| 차원 | 허용값 | 기본값 |\n|------|--------|--------|\n| style | neutral · brand | neutral |\n| 인터랙션 | (없음) · selectable · removable | (없음) |\n\n---\n\n## 접근성\n\n버튼 유형 (선택/제거 인터랙션이 있는 경우, `design-system/accessibility.md` 버튼 행 적용).\n\n- 선택 가능한 Tag: `<button>` 사용. 선택 상태는 `aria-pressed=\"true/false\"`.\n- 제거 버튼: `aria-label=\"[태그명] 제거\"` 필수.\n- 읽기 전용 Tag: `<span>` 사용. 인터랙션 없음.\n\n---\n\n## Do / Don't\n\n> ✅ DO — 선택 가능한 Tag는 `<button>` 사용\n> `<button class=\"tag tag--selectable\" aria-pressed=\"false\">디자인<\/button>`\n\n> ❌ DON'T — 상태 표시용 레이블에 Tag 사용\n> 비인터랙티브 상태 레이블에는 Badge 사용\n\n> ✅ DO — 제거 버튼에 태그명 포함한 `aria-label` 제공\n> `<button aria-label=\"디자인 제거\">`\n", "previewCSS": ""}, {"path": "components/atoms/spinner.md", "label": "Spinner", "group": "atoms", "slug": "components--atoms--spinner", "raw": "---\nfile: components/atoms/spinner.md\nversion: 1.0.0\nstatus: draft\ndepends-on: components/_index.md, accessibility.md, tokens/motion.md, tokens/color.md, tokens/stroke.md\n---\n\n# Spinner\n\n## 개요\n\n비동기 작업 진행 중임을 나타내는 로딩 인디케이터. 1–3초의 예측 불가한 짧은 작업에 사용한다. 레이아웃을 예측할 수 있는 긴 로딩에는 Skeleton을 사용한다. (`product.md` Loading State 참조)\n\n---\n\n## Anatomy\n\n<!-- AI: root(.spinner). 항상 .sr-only 텍스트를 함께 제공한다. 단독으로 쓰일 때는 래퍼에 aria-busy=\"true\"와 aria-live=\"polite\"를 적용한다. -->\n\n```html\n<!-- 단독 사용 -->\n<div class=\"spinner spinner--md\" role=\"status\" aria-live=\"polite\">\n  <span aria-hidden=\"true\"><\/span>\n  <span class=\"sr-only\">불러오는 중...<\/span>\n<\/div>\n\n<!-- 버튼 내부 (버튼에 aria-busy 적용) -->\n<button class=\"btn btn--primary btn--md btn--loading\" aria-busy=\"true\" tabindex=\"-1\">\n  <span class=\"spinner spinner--sm\" aria-hidden=\"true\"><\/span>\n  <span class=\"sr-only\">저장 중...<\/span>\n<\/button>\n```\n\n<div class=\"component-preview-placeholder\" data-content=\"%3Cstyle%3E%0A%20%20%40keyframes%20spin%20%7B%20to%20%7B%20transform%3A%20rotate%28360deg%29%3B%20%7D%20%7D%0A%20%20.spinner%20%7B%20display%3A%20inline-flex%3B%20align-items%3A%20center%3B%20justify-content%3A%20center%3B%20%7D%0A%20%20.spinner%20span%3Afirst-child%20%7B%0A%20%20%20%20display%3A%20block%3B%20border-radius%3A%2050%25%3B%0A%20%20%20%20border%3A%20var%28--stroke-md%29%20solid%20var%28--color-border-subtle%29%3B%0A%20%20%20%20border-top-color%3A%20var%28--color-button-brand%29%3B%0A%20%20%20%20animation%3A%20spin%200.75s%20linear%20infinite%3B%0A%20%20%7D%0A%20%20.spinner--sm%20span%3Afirst-child%20%7B%20width%3A%2014px%3B%20height%3A%2014px%3B%20%7D%0A%20%20.spinner--md%20span%3Afirst-child%20%7B%20width%3A%2020px%3B%20height%3A%2020px%3B%20%7D%0A%20%20.spinner--lg%20span%3Afirst-child%20%7B%20width%3A%2028px%3B%20height%3A%2028px%3B%20%7D%0A%3C%2Fstyle%3E%0A%3Cdiv%20style%3D%22display%3Aflex%3B%20gap%3A24px%3B%20align-items%3Acenter%3B%22%3E%0A%20%20%3Cdiv%20class%3D%22spinner%20spinner--sm%22%20role%3D%22status%22%3E%3Cspan%3E%3C%2Fspan%3E%3Cspan%20class%3D%22sr-only%22%3E%EB%A1%9C%EB%94%A9%20%EC%A4%91%3C%2Fspan%3E%3C%2Fdiv%3E%0A%20%20%3Cdiv%20class%3D%22spinner%20spinner--md%22%20role%3D%22status%22%3E%3Cspan%3E%3C%2Fspan%3E%3Cspan%20class%3D%22sr-only%22%3E%EB%A1%9C%EB%94%A9%20%EC%A4%91%3C%2Fspan%3E%3C%2Fdiv%3E%0A%20%20%3Cdiv%20class%3D%22spinner%20spinner--lg%22%20role%3D%22status%22%3E%3Cspan%3E%3C%2Fspan%3E%3Cspan%20class%3D%22sr-only%22%3E%EB%A1%9C%EB%94%A9%20%EC%A4%91%3C%2Fspan%3E%3C%2Fdiv%3E%0A%3C%2Fdiv%3E\"><\/div>\n\n---\n\n## Variant\n\n| 차원 | 허용값 | 기본값 |\n|------|--------|--------|\n| size | sm · md · lg | md |\n\n---\n\n## 접근성\n\n비인터랙티브 컴포넌트. 키보드 접근·focus·disabled 불해당.\n\nloading 상태 규칙 적용. `role=\"status\"` + `aria-live=\"polite\"` + `.sr-only` 텍스트 필수.\n\n버튼 내부에 사용 시 Spinner 자체에는 `aria-hidden=\"true\"` 적용. 버튼에 `aria-busy=\"true\"` 적용.\n\n`prefers-reduced-motion: reduce` 대응 필수 — 애니메이션 중단 또는 opacity 변화로 대체.\n\n`.sr-only` 문구: `불러오는 중...` · `저장 중...` 등 (`product.md` 로딩 메시지 참조)\n\n---\n\n## Do / Don't\n\n> ✅ DO — 단독 사용 시 `role=\"status\"` + `.sr-only` 텍스트 제공\n> `<div class=\"spinner spinner--md\" role=\"status\"><span class=\"sr-only\">불러오는 중...<\/span><\/div>`\n\n> ❌ DON'T — 1초 미만 작업에 Spinner 표시\n> 깜빡임 방지를 위해 최소 1초 이상 지속될 작업에만 표시 (`product.md` 참조)\n\n> ❌ DON'T — Spinner 표시 중 레이아웃 변경\n> 컴포넌트 크기 고정 유지 필수\n", "previewCSS": ""}, {"path": "components/atoms/tooltip.md", "label": "Tooltip", "group": "atoms", "slug": "components--atoms--tooltip", "raw": "---\nfile: components/atoms/tooltip.md\nversion: 1.0.0\nstatus: draft\ndepends-on: components/_index.md, accessibility.md, tokens/color.md, tokens/space.md, tokens/stroke.md, tokens/typography.md, tokens/radius.md, tokens/elevation.md\n---\n\n# Tooltip\n\n## 개요\n\n트리거 요소에 hover 또는 focus 시 보조 설명을 표시한다. 인터랙션에 필수적인 정보는 Tooltip에 두지 않는다 — 키보드 사용자도 접근할 수 있어야 하며, 모바일에서는 hover가 없다.\n\n---\n\n## Anatomy\n\n<!-- AI: trigger(.tooltip-trigger), panel(.tooltip-panel). panel의 위치는 JS로 동적 계산하고 placement 클래스로 방향을 지정한다. -->\n\n```html\n<!-- hover·focus 시 표시 -->\n<span class=\"tooltip-wrapper\">\n  <button class=\"tooltip-trigger btn btn--ghost btn--md btn--icon-only\" aria-label=\"도움말\" aria-describedby=\"tip-1\">\n    <span aria-hidden=\"true\"><!-- icon --><\/span>\n  <\/button>\n  <div class=\"tooltip-panel tooltip-panel--top\" id=\"tip-1\" role=\"tooltip\">\n    최대 100자까지 입력할 수 있어요\n  <\/div>\n<\/span>\n```\n\n<div class=\"component-preview-placeholder\" data-content=\"%3Cstyle%3E%0A%20%20.tooltip-wrapper%20%7B%20position%3A%20relative%3B%20display%3A%20inline-block%3B%20%7D%0A%20%20.tooltip-trigger%20%7B%20all%3A%20unset%3B%20cursor%3A%20pointer%3B%20display%3A%20inline-flex%3B%20align-items%3A%20center%3B%20justify-content%3A%20center%3B%0A%20%20%20%20width%3A%2028px%3B%20height%3A%2028px%3B%20border-radius%3A%20var%28--radius-sm%29%3B%0A%20%20%20%20background%3A%20var%28--color-surface-neutral%29%3B%20color%3A%20var%28--color-text-label%29%3B%20font-family%3A%20var%28--font-family-base%29%3B%20%7D%0A%20%20.tooltip-trigger%3Afocus-visible%20%7B%20outline%3A%20var%28--stroke-md%29%20solid%20var%28--color-border-focus%29%3B%20outline-offset%3A%202px%3B%20%7D%0A%20%20.tooltip-panel%20%7B%0A%20%20%20%20position%3A%20absolute%3B%20z-index%3A%20100%3B%0A%20%20%20%20padding%3A%20var%28--space-inset-sm%29%3B%0A%20%20%20%20background%3A%20var%28--color-surface-dark%29%3B%0A%20%20%20%20color%3A%20var%28--color-text-inverse%29%3B%0A%20%20%20%20border-radius%3A%20var%28--radius-sm%29%3B%0A%20%20%20%20font-family%3A%20var%28--font-family-base%29%3B%0A%20%20%20%20font-size%3A%20var%28--font-size-label%29%3B%0A%20%20%20%20white-space%3A%20nowrap%3B%0A%20%20%20%20pointer-events%3A%20none%3B%0A%20%20%20%20opacity%3A%200%3B%0A%20%20%20%20transition%3A%20opacity%200.1s%3B%0A%20%20%7D%0A%20%20.tooltip-panel--top%20%7B%20bottom%3A%20calc%28100%25%20%2B%206px%29%3B%20left%3A%2050%25%3B%20transform%3A%20translateX%28-50%25%29%3B%20%7D%0A%20%20.tooltip-panel--bottom%20%7B%20top%3A%20calc%28100%25%20%2B%206px%29%3B%20left%3A%2050%25%3B%20transform%3A%20translateX%28-50%25%29%3B%20%7D%0A%20%20.tooltip-wrapper%3Ahover%20.tooltip-panel%2C%0A%20%20.tooltip-trigger%3Afocus-visible%20~%20.tooltip-panel%20%7B%20opacity%3A%201%3B%20%7D%0A%3C%2Fstyle%3E%0A%3Cdiv%20style%3D%22display%3Aflex%3B%20gap%3A32px%3B%20align-items%3Acenter%3B%20padding%3A%2032px%2016px%3B%22%3E%0A%20%20%3Cspan%20class%3D%22tooltip-wrapper%22%3E%0A%20%20%20%20%3Cbutton%20class%3D%22tooltip-trigger%22%20aria-describedby%3D%22tip-top%22%3E%3F%3C%2Fbutton%3E%0A%20%20%20%20%3Cdiv%20class%3D%22tooltip-panel%20tooltip-panel--top%22%20id%3D%22tip-top%22%20role%3D%22tooltip%22%3E%EC%9C%84%EC%AA%BD%20%ED%88%B4%ED%8C%81%3C%2Fdiv%3E%0A%20%20%3C%2Fspan%3E%0A%20%20%3Cspan%20class%3D%22tooltip-wrapper%22%3E%0A%20%20%20%20%3Cbutton%20class%3D%22tooltip-trigger%22%20aria-describedby%3D%22tip-bottom%22%3E%3F%3C%2Fbutton%3E%0A%20%20%20%20%3Cdiv%20class%3D%22tooltip-panel%20tooltip-panel--bottom%22%20id%3D%22tip-bottom%22%20role%3D%22tooltip%22%3E%EC%95%84%EB%9E%98%EC%AA%BD%20%ED%88%B4%ED%8C%81%3C%2Fdiv%3E%0A%20%20%3C%2Fspan%3E%0A%3C%2Fdiv%3E\"><\/div>\n\n---\n\n## Variant\n\n| 차원 | 허용값 | 기본값 |\n|------|--------|--------|\n| placement | top · bottom · left · right | top |\n\n---\n\n## 접근성\n\n비인터랙티브 패널 + 인터랙티브 트리거 구조.\n\n트리거에 `aria-describedby`로 패널 연결. 패널에 `role=\"tooltip\"` + `id` 필수.\n\nhover와 focus 양쪽에서 표시. 키보드 `Esc`로 닫기.\n\n```js\ntrigger.addEventListener('keydown', (e) => {\n  if (e.key === 'Escape') hideTooltip();\n});\n```\n\n---\n\n## Do / Don't\n\n> ✅ DO — 트리거에 `aria-describedby`로 패널 연결\n> `<button aria-describedby=\"tip-1\">` + `<div id=\"tip-1\" role=\"tooltip\">`\n\n> ❌ DON'T — 필수 정보를 Tooltip에만 표시\n> 모바일·키보드 사용자가 접근 못할 수 있다. 필수 정보는 항상 노출 상태로 유지\n\n> ❌ DON'T — 긴 텍스트나 인터랙티브 요소를 Tooltip 안에 배치\n> Tooltip은 간단한 보조 설명용. 복잡한 내용은 Popover 또는 Modal 사용\n", "previewCSS": ""}, {"path": "components/atoms/divider.md", "label": "Divider", "group": "atoms", "slug": "components--atoms--divider", "raw": "---\nfile: components/atoms/divider.md\nversion: 1.0.0\nstatus: draft\ndepends-on: components/_index.md, accessibility.md, tokens/color.md, tokens/space.md, tokens/stroke.md, tokens/typography.md\n---\n\n# Divider\n\n## 개요\n\n콘텐츠 영역을 시각적으로 구분하는 선. 비인터랙티브 컴포넌트. 의미 있는 섹션 구분에는 `<hr>`을, 장식용으로만 쓰일 때는 CSS border를 직접 사용한다.\n\n---\n\n## Anatomy\n\n<!-- AI: root(.divider). 수평이 기본. 수직은 인라인 요소 사이 구분에 사용한다. -->\n\n```html\n<!-- 수평 (기본) -->\n<hr class=\"divider\" />\n\n<!-- 수직 -->\n<span class=\"divider divider--vertical\" role=\"separator\" aria-orientation=\"vertical\"><\/span>\n\n<!-- 텍스트 포함 (섹션 구분) -->\n<div class=\"divider divider--labeled\">\n  <hr />\n  <span>또는<\/span>\n  <hr />\n<\/div>\n```\n\n<div class=\"component-preview-placeholder\" data-content=\"%3Cstyle%3E%0A%20%20.divider%20%7B%0A%20%20%20%20border%3A%20none%3B%0A%20%20%20%20border-top%3A%20var%28--stroke-sm%29%20var%28--stroke-solid%29%20var%28--color-border-subtle%29%3B%0A%20%20%20%20margin%3A%200%3B%0A%20%20%7D%0A%20%20.divider--vertical%20%7B%0A%20%20%20%20display%3A%20inline-block%3B%0A%20%20%20%20width%3A%200%3B%0A%20%20%20%20border-top%3A%20none%3B%0A%20%20%20%20border-left%3A%20var%28--stroke-sm%29%20var%28--stroke-solid%29%20var%28--color-border-subtle%29%3B%0A%20%20%20%20align-self%3A%20stretch%3B%0A%20%20%20%20margin%3A%200%20var%28--space-generic-sm%29%3B%0A%20%20%7D%0A%20%20.divider--labeled%20%7B%0A%20%20%20%20display%3A%20flex%3B%20align-items%3A%20center%3B%20gap%3A%20var%28--space-gap-sm%29%3B%0A%20%20%7D%0A%20%20.divider--labeled%20hr%20%7B%0A%20%20%20%20flex%3A%201%3B%20border%3A%20none%3B%0A%20%20%20%20border-top%3A%20var%28--stroke-sm%29%20var%28--stroke-solid%29%20var%28--color-border-subtle%29%3B%0A%20%20%20%20margin%3A%200%3B%0A%20%20%7D%0A%20%20.divider--labeled%20span%20%7B%0A%20%20%20%20font-family%3A%20var%28--font-family-base%29%3B%0A%20%20%20%20font-size%3A%20var%28--font-size-label%29%3B%0A%20%20%20%20color%3A%20var%28--color-text-subtle%29%3B%0A%20%20%20%20white-space%3A%20nowrap%3B%0A%20%20%7D%0A%3C%2Fstyle%3E%0A%3Cdiv%20style%3D%22display%3Aflex%3B%20flex-direction%3Acolumn%3B%20gap%3A16px%3B%20max-width%3A320px%3B%22%3E%0A%20%20%3Chr%20class%3D%22divider%22%20%2F%3E%0A%20%20%3Cdiv%20style%3D%22display%3Aflex%3B%20align-items%3Acenter%3B%20he         s = s.replace(/(&lt;)([a-zA-Z][\w-]*)((?:\s[\s\S]*?)?)(\s*\/&gt;|\s*&gt;)/g,

        var colorBtns = {};

        search.addEventListener('input', function() {

        function copyText(text, card) {
          var fn = (navigator.clipboard && navigator.clipboard.writeText)
            ? navigator.clipboard.writeText.bind(navigator.clipboard)
            : function(t) {

      // ─── 컴포넌트 Anatomy 프리뷰 (:::preview) ───
      bodyEl.querySelectorAll('.component-preview-placeholder').forEach(function(el) {

        // visual preview stage

        function parseBtnLabels(el) {
          var cls = el.className || '';

          if (cls.indexOf('action-group') !== -1) {
            var btns = Array.from(el.querySelectorAll('.action-btn'));
            tags.push(btns.length === 1 ? 'single' : 'multi');
            var firstCls = btns.length ? (btns[0].className || '') : '';
            if (firstCls.indexOf('action-btn--md') !== -1) tags.push('md');
            else tags.push('sm');
            var hasIconOnly  = btns.some(function(b) { return b.className.indexOf('action-btn--icon-only')  !== -1; });
            var hasIconLeft  = btns.some(function(b) { return b.className.indexOf('action-btn--icon-left')  !== -1; });
            var hasIconRight = btns.some(function(b) { return b.className.indexOf('action-btn--icon-right') !== -1; });
            if (hasIconOnly) tags.push('icon-only');
            else if (hasIconLeft) tags.push('icon-left');
            else if (hasIconRight) tags.push('icon-right');
            if (btns.some(function(b) { return b.className.indexOf('action-btn--disabled') !== -1; })) tags.push('disabled');
            return tags;
          }

          // ── Button ──
          var styleMap = { 'btn--primary':'primary', 'btn--secondary':'secondary', 'btn--danger':'danger', 'btn--ghost':'ghost' };
          Object.keys(styleMap).forEach(function(k) { if (cls.indexOf(k) !== -1) tags.push(styleMap[k]); });
          if (cls.indexOf('btn--solid') !== -1) tags.push('solid');
          else if (cls.indexOf('btn--ghost') === -1) tags.push('fill');
          if (cls.indexOf('btn--icon-only') !== -1) tags.push('icon-only');
          else if (cls.indexOf('btn--icon-left') !== -1) tags.push('icon-left');
          else if (cls.indexOf('btn--icon-right') !== -1) tags.push('icon-right');
          if (cls.indexOf('btn--disabled') !== -1) tags.push('disabled');
          else if (cls.indexOf('btn--loading') !== -1) tags.push('loading');
          if (cls.indexOf('btn--sm') !== -1) tags.push('sm');
          else if (cls.indexOf('btn--md') !== -1) tags.push('md');
          else if (cls.indexOf('btn--lg') !== -1) tags.push('lg');
          return tags;
        }

        function copyText(text, btn) {
          var fn = (navigator.clipboard && navigator.clipboard.writeText)
            ? navigator.clipboard.writeText.bind(navigator.clipboard)
            : function(t) {
                var ta = document.createElement('textarea');
                ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
                document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy'); } catch(e) {}
                document.body.removeChild(ta);
                return Promise.resolve();
              };
          fn(text).then(function() {
            btn.classList.add('copied');
            setTimeout(function() { btn.classList.remove('copied'); }, 1000);

        if (components.length > 0) {

            copyBtn.addEventListener('click', function() { copyText(html, copyBtn); });

      // ─── 표 셀 안의 code 사이 ", " → 줄바꿈 ───
      bodyEl.querySelectorAll('td').forEach(function(td) {
